<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>福島・規制区域マップ</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html,body{
 margin:0;
 height:100%;
 font-family:-apple-system,BlinkMacSystemFont,
 "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}

#app{
 height:100%;
 display:flex;
 flex-direction:column;
}

header{
 padding:9px 11px;
 background:white;
 border-bottom:1px solid #ddd;
}

h1{
 margin:0;
 font-size:20px;
}

.sub{
 margin-top:2px;
 font-size:10px;
 color:#666;
}

#status{
 margin-top:7px;
 padding:8px 9px;
 border-radius:9px;
 background:#eef3f8;
 font-size:11px;
 line-height:1.45;
}

#mapWrap{
 position:relative;
 flex:1;
 min-height:330px;
}

#map{
 width:100%;
 height:100%;
}

#panel{
 position:absolute;
 left:7px;
 right:7px;
 bottom:8px;
 z-index:1000;
 background:rgba(255,255,255,.95);
 padding:7px;
 border-radius:11px;
 box-shadow:0 2px 10px rgba(0,0,0,.3);
}

.panelTitle{
 font-size:10px;
 font-weight:bold;
 margin-bottom:5px;
}

.grid3{
 display:grid;
 grid-template-columns:1fr 1fr 1fr;
 gap:4px;
}

.grid2{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:4px;
 margin-top:4px;
}

button{
 border:0;
 border-radius:8px;
 padding:9px 2px;
 color:white;
 font-weight:bold;
 font-size:10px;
}

.zone{
 background:#70418b;
}

.zone.active{
 background:#9d35c3;
 outline:2px solid #4d1761;
}

#opacity{
 background:#607681;
}

#imageOff{
 background:#555;
}

.bottom{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:5px;
 padding:6px;
 background:#fff;
 border-top:1px solid #ddd;
}

#gps{
 background:#1769e0;
}

#track{
 background:#08752e;
}

#official{
 background:#6c5200;
}

#reset{
 background:#555;
}

.warning{
 grid-column:1/3;
 font-size:8px;
 color:#666;
 line-height:1.45;
 padding:1px 3px;
}

.legend{
 background:rgba(255,255,255,.95);
 padding:6px 7px;
 border-radius:7px;
 box-shadow:0 1px 6px rgba(0,0,0,.3);
 font-size:9px;
 line-height:1.5;
}

.gpsPopup{
 font-size:11px;
 line-height:1.45;
}

.badge{
 display:inline-block;
 margin-top:3px;
 padding:2px 5px;
 border-radius:8px;
 background:#fff2ba;
 color:#6e5500;
 font-size:9px;
 font-weight:bold;
}

.cross{
 width:14px;
 height:14px;
 border-radius:50%;
 border:2px solid #000;
 background:#fff;
 box-sizing:border-box;
}

.cross:before{
 content:"";
 position:absolute;
 width:2px;
 height:24px;
 background:#000;
 left:6px;
 top:-5px;
}

.cross:after{
 content:"";
 position:absolute;
 height:2px;
 width:24px;
 background:#000;
 top:6px;
 left:-5px;
}
</style>
</head>

<body>

<div id="app">

<header>

<h1>福島・規制区域マップ</h1>

<div class="sub">
v28｜大熊町・公式規制図＋GPS実用版
</div>

<div id="status">
<b>🟢 2026年6月22日 立入規制緩和区域</b><br>
公式区域図を地理院地図と重ねて確認できます。
GPS位置も同じ地図上に表示します。
</div>

</header>


<div id="mapWrap">

<div id="map"></div>

<div id="panel">

<div class="panelTitle">
🗺 大熊町公式・立入規制緩和区域図
</div>

<div class="grid3">

<button
 id="z1"
 class="zone"
 onclick="showZone(1)">
① 野上・下野上
</button>

<button
 id="z2"
 class="zone"
 onclick="showZone(2)">
② 熊2・熊3
</button>

<button
 id="z3"
 class="zone"
 onclick="showZone(3)">
③ 熊2・町区
</button>

</div>

<div class="grid2">

<button
 id="opacity"
 onclick="changeOpacity()">
👁 透明度45%
</button>

<button
 id="imageOff"
 onclick="hideImage()">
画像OFF
</button>

</div>

</div>

</div>


<div class="bottom">

<button id="gps">
📍 現在地
</button>

<button id="track">
▶ 移動追跡
</button>

<button id="official">
🏛 大熊町公式
</button>

<button id="reset">
🗾 全体表示
</button>

<div class="warning">
⚠️ 緑色＝大熊町公式図の立入規制緩和区域。
画像は位置確認用です。地番境界・GPSによる法的な区域内外判定には使用しません。
</div>

</div>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script>

/* =========================================
 MAP
========================================= */

const map=L.map("map").setView(
 [37.400,140.985],
 13
);

L.tileLayer(
 "https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",
 {
  attribution:"地理院タイル",
  maxZoom:18
 }
).addTo(map);


/* =========================================
 DAIICHI
========================================= */

L.circleMarker(
 [37.4211,141.0328],
 {
  radius:5,
  color:"#fff",
  weight:2,
  fillColor:"#111",
  fillOpacity:1
 }
)
.addTo(map)
.bindPopup(
 "<b>福島第一原子力発電所</b>"
);


/* =========================================
 OFFICIAL MAPS
========================================= */

const zones={

 1:{
  name:"① 野上2区・下野上1区",
  image:
  "https://www.town.okuma.fukushima.jp/uploaded/image/18395.jpg",

  bounds:[
   [37.3990,140.9400],
   [37.4235,140.9850]
  ],

  view:[
   37.4115,
   140.9635
  ],

  zoom:15
 },


 2:{
  name:"② 熊2区・熊3区の一部",
  image:
  "https://www.town.okuma.fukushima.jp/uploaded/image/18400.jpg",

  bounds:[
   [37.3690,140.9850],
   [37.4000,141.0250]
  ],

  view:[
   37.3845,
   141.0060
  ],

  zoom:15
 },


 3:{
  name:"③ 熊2区・町区の一部",
  image:
  "https://www.town.okuma.fukushima.jp/uploaded/image/18397.jpg",

  bounds:[
   [37.3680,140.9950],
   [37.3980,141.0320]
  ],

  view:[
   37.3830,
   141.0130
  ],

  zoom:15
 }

};


/* =========================================
 IMAGE CONTROL
========================================= */

let overlay=null;
let activeZone=1;

const opacities=[
 .25,
 .45,
 .65,
 .80
];

let opacityIndex=1;


function showZone(n){

 activeZone=n;

 const z=zones[n];


 if(overlay){
  map.removeLayer(overlay);
 }


 overlay=L.imageOverlay(
  z.image,
  z.bounds,
  {
   opacity:
   opacities[opacityIndex],

   zIndex:450,

   interactive:false
  }
 );


 overlay.addTo(map);


 map.setView(
  z.view,
  z.zoom,
  {
   animate:false
  }
 );


 document
 .querySelectorAll(".zone")
 .forEach(
  b=>b.classList.remove("active")
 );


 document
 .getElementById("z"+n)
 .classList.add("active");


 document
 .getElementById("status")
 .innerHTML=

 "<b>🟢 "+
 z.name+
 "</b><br>"+
 "緑色部分が2026年6月22日からの立入規制緩和区域です。"+
 "<br><span class='badge'>公式区域図・参考表示</span>";

}


function changeOpacity(){

 opacityIndex=
 (opacityIndex+1)%
 opacities.length;


 const o=
 opacities[opacityIndex];


 if(overlay){
  overlay.setOpacity(o);
 }


 document
 .getElementById("opacity")
 .innerHTML=
 "👁 透明度"+
 Math.round(o*100)+"%";

}


function hideImage(){

 if(overlay){

  map.removeLayer(overlay);
  overlay=null;

 }

 document
 .getElementById("status")
 .innerHTML=
 "<b>公式区域図を非表示にしました。</b><br>"+
 "地理院地図のみ表示しています。";

}


/* =========================================
 GPS
========================================= */

let gpsMarker=null;
let accuracyCircle=null;


function drawGPS(pos,follow){

 const lat=
 pos.coords.latitude;

 const lng=
 pos.coords.longitude;

 const accuracy=
 pos.coords.accuracy;


 if(gpsMarker){
  map.removeLayer(gpsMarker);
 }

 if(accuracyCircle){
  map.removeLayer(accuracyCircle);
 }


 gpsMarker=
 L.circleMarker(
  [lat,lng],
  {
   radius:9,
   color:"#fff",
   weight:3,
   fillColor:"#1677ff",
   fillOpacity:1,
   zIndexOffset:5000
  }
 )
 .addTo(map);


 accuracyCircle=
 L.circle(
  [lat,lng],
  {
   radius:accuracy,
   color:"#1677ff",
   weight:1,
   fillColor:"#1677ff",
   fillOpacity:.08
  }
 )
 .addTo(map);


 gpsMarker.bindPopup(

  "<div class='gpsPopup'>"+
  "<b>📍 GPS現在地</b><br>"+
  lat.toFixed(6)+
  ", "+
  lng.toFixed(6)+
  "<br>GPS精度 約±"+
  Math.round(accuracy)+
  "m"+
  "<br><span class='badge'>区域内外は自動判定しません</span>"+
  "</div>"

 ).openPopup();


 if(follow){

  map.setView(
   [lat,lng],
   16
  );

 }


 document
 .getElementById("status")
 .innerHTML=

 "<b>📍 GPS現在地</b><br>"+
 lat.toFixed(6)+
 ", "+
 lng.toFixed(6)+
 "　精度 約±"+
 Math.round(accuracy)+
 "m<br>"+
 "<span class='badge'>公式区域図と目視で確認</span>";

}


/* =========================================
 GPS BUTTON
========================================= */

document
.getElementById("gps")
.onclick=()=>{

 document
 .getElementById("status")
 .innerHTML=
 "📍 現在地を取得しています…";


 navigator.geolocation.getCurrentPosition(

  p=>drawGPS(p,true),

  ()=>{

   document
   .getElementById("status")
   .innerHTML=
   "<b>現在地を取得できませんでした。</b>";

  },

  {
   enableHighAccuracy:true,
   timeout:15000,
   maximumAge:1000
  }

 );

};


/* =========================================
 TRACKING
========================================= */

let tracking=false;
let watchId=null;


document
.getElementById("track")
.onclick=()=>{

 const button=
 document.getElementById("track");


 if(!tracking){

  tracking=true;

  button.innerHTML=
  "■ 追跡停止";

  button.style.background=
  "#a26b00";


  watchId=
  navigator.geolocation.watchPosition(

   p=>drawGPS(p,true),

   ()=>{},

   {
    enableHighAccuracy:true,
    timeout:20000,
    maximumAge:2000
   }

  );


 }else{

  tracking=false;


  if(watchId!==null){

   navigator.geolocation.clearWatch(
    watchId
   );

  }


  watchId=null;


  button.innerHTML=
  "▶ 移動追跡";

  button.style.background=
  "#08752e";

 }

};


/* =========================================
 OFFICIAL SITE
========================================= */

document
.getElementById("official")
.onclick=()=>{

 window.open(
  "https://www.town.okuma.fukushima.jp/soshiki/kankyoutaisaku/34555.html",
  "_blank"
 );

};


/* =========================================
 RESET
========================================= */

document
.getElementById("reset")
.onclick=()=>{

 map.setView(
  [37.400,140.985],
  13
 );

};


/* =========================================
 LEGEND
========================================= */

const legend=
L.control({
 position:"topright"
});


legend.onAdd=function(){

 const d=
 L.DomUtil.create(
  "div",
  "legend"
 );


 d.innerHTML=

 "<b>v28</b><br>"+
 "🟢 立入規制緩和<br>"+
 "🔵 GPS現在地<br>"+
 "⚫ 福島第一<br>"+
 "<hr style='margin:4px 0'>"+
 "公式図＋地理院地図";


 return d;

};


legend.addTo(map);


/* =========================================
 START
========================================= */

setTimeout(
 ()=>showZone(1),
 350
);

</script>

</body>
</html>
