<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>福島・規制区域マップ</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

html,body{
 margin:0;
 height:100%;
 font-family:-apple-system,BlinkMacSystemFont,
 "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}

#app{
 height:100%;
 display:flex;
 flex-direction:column;
}

header{
 background:#fff;
 padding:7px 9px;
 border-bottom:1px solid #ddd;
 z-index:1000;
}

h1{
 margin:0;
 font-size:18px;
}

.sub{
 font-size:10px;
 color:#666;
 margin-top:2px;
}

#status{
 margin-top:6px;
 padding:7px;
 border-radius:9px;
 background:#eef3f8;
 font-size:11px;
 line-height:1.4;
}

#mapWrap{
 position:relative;
 flex:1;
 min-height:280px;
}

#map{
 width:100%;
 height:100%;
}

#anchorPanel{
 position:absolute;
 z-index:2000;
 left:8px;
 right:8px;
 bottom:8px;
 background:rgba(255,255,255,.95);
 border-radius:11px;
 padding:7px;
 box-shadow:0 2px 12px rgba(0,0,0,.28);
}

.anchorTitle{
 font-size:10px;
 font-weight:bold;
 margin-bottom:5px;
}

.anchorButtons{
 display:grid;
 grid-template-columns:1fr 1fr 1fr;
 gap:4px;
}

.anchorButtons button{
 background:#292929;
 padding:8px 2px;
}

#overlayToggle{
 margin-top:5px;
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:4px;
}

#overlayToggle button{
 background:#71418c;
}

#opacityBtn{
 background:#596d78 !important;
}

.controls{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:5px;
 padding:6px;
 background:#fff;
 border-top:1px solid #ddd;
}

button{
 border:0;
 border-radius:8px;
 padding:9px 3px;
 font-size:11px;
 font-weight:600;
 color:#fff;
}

#gps{
 background:#1769e0;
}

#track{
 background:#08752e;
}

#whole{
 background:#876000;
}

#official{
 background:#444;
}

.note{
 grid-column:1/3;
 font-size:8px;
 color:#666;
 line-height:1.4;
}

.legend{
 background:#fff;
 padding:6px 8px;
 font-size:9px;
 line-height:1.5;
 box-shadow:0 1px 5px rgba(0,0,0,.3);
 border-radius:5px;
}

.anchorIcon{
 width:18px;
 height:18px;
 border:2px solid #000;
 border-radius:50%;
 background:#fff;
 box-sizing:border-box;
 position:relative;
}

.anchorIcon:before{
 content:"";
 position:absolute;
 left:7px;
 top:-7px;
 width:2px;
 height:28px;
 background:#000;
}

.anchorIcon:after{
 content:"";
 position:absolute;
 left:-7px;
 top:7px;
 width:28px;
 height:2px;
 background:#000;
}

.anchorLabel{
 background:#fff;
 color:#000;
 border:1px solid #222;
 border-radius:4px;
 padding:1px 4px;
 font-size:9px;
 font-weight:bold;
 white-space:nowrap;
}

.place{
 font-weight:bold;
 font-size:13px;
}

.row{
 background:#fff;
 padding:5px 7px;
 border-radius:7px;
 margin-top:4px;
}

.detail{
 display:block;
 color:#555;
 font-size:10px;
 margin-top:2px;
}

.coords{
 color:#777;
 font-size:9px;
 margin-top:5px;
}

</style>
</head>

<body>

<div id="app">

<header>

<h1>福島・規制区域マップ</h1>

<div class="sub">
v25｜大熊町公式図・3基準点位置合わせ
</div>

<div id="status">
<b>🎯 下の「大熊IC」「大野駅」「熊町」を順番に押してください。</b>
</div>

</header>


<div id="mapWrap">

<div id="map"></div>

<div id="anchorPanel">

<div class="anchorTitle">
🎯 位置合わせ基準点
</div>

<div class="anchorButtons">

<button onclick="focusAnchor('ic')">
① 大熊IC
</button>

<button onclick="focusAnchor('station')">
② 大野駅
</button>

<button onclick="focusAnchor('kumamachi')">
③ 熊町
</button>

</div>

<div id="overlayToggle">

<button id="overlayButton"
onclick="toggleOverlay()">
🗺 公式図 ON
</button>

<button id="opacityBtn"
onclick="changeOpacity()">
👁 透明度 45%
</button>

</div>

</div>

</div>


<div class="controls">

<button id="gps">
📍 現在地
</button>

<button id="track">
▶ 移動追跡
</button>

<button id="whole">
🗾 大熊町全体
</button>

<button id="official">
🏛 公式資料
</button>

<div class="note">

🔴帰還困難　
🟣特定帰還居住　
▧立入規制緩和　
🟢解除済み　
⬛中間貯蔵　
🔵GPS<br>

v25の公式図は位置合わせ用です。
<strong>まだ区域判定には使用しません。</strong>

</div>

</div>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =====================================================
 MAP
===================================================== */

const map =
L.map("map",{
 zoomControl:true
}).setView(
 [37.402,140.985],
 13
);


L.tileLayer(
 "https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",
 {
  attribution:"地理院タイル",
  maxZoom:18
 }
).addTo(map);


/* =====================================================
 FUKUSHIMA DAIICHI
===================================================== */

L.circleMarker(
 [37.4211,141.0328],
 {
  radius:6,
  color:"#fff",
  weight:2,
  fillColor:"#111",
  fillOpacity:1
 }
)
.addTo(map)
.bindPopup(
 "<b>福島第一原子力発電所</b>"
);


/* =====================================================
 OFFICIAL IMAGE
===================================================== */

const OKUMA_IMAGE =
"https://www.town.okuma.fukushima.jp/uploaded/image/18390.jpg";


/*
 v23/v24 provisional bounds.

 この値はまだ最終GIS座標ではない。
*/

const OKUMA_BOUNDS = [
 [37.3600,140.8300],
 [37.4470,141.0600]
];


let officialOverlay =
L.imageOverlay(
 OKUMA_IMAGE,
 OKUMA_BOUNDS,
 {
  opacity:0.45,
  zIndex:450,
  interactive:false
 }
);


officialOverlay.addTo(map);


let overlayVisible=true;

let opacityIndex=1;

const opacityLevels=[
 0.25,
 0.45,
 0.65,
 0.80
];


/* =====================================================
 ANCHORS
===================================================== */

const anchors={

 ic:{
  name:"大熊IC",
  lat:37.41237,
  lng:140.96395,
  zoom:16
 },

 station:{
  name:"大野駅",
  lat:37.40938,
  lng:140.98431,
  zoom:17
 },

 kumamachi:{
  name:"熊町周辺",
  lat:37.38174,
  lng:141.00752,
  zoom:16
 }

};


const anchorLayer =
L.layerGroup().addTo(map);


function makeAnchor(key){

 const a=
 anchors[key];


 const icon=
 L.divIcon({
  className:"",
  html:'<div class="anchorIcon"></div>',
  iconSize:[18,18],
  iconAnchor:[9,9]
 });


 const marker=
 L.marker(
  [a.lat,a.lng],
  {
   icon:icon,
   zIndexOffset:2000
  }
 )
 .addTo(anchorLayer);


 marker.bindTooltip(
  a.name,
  {
   permanent:true,
   direction:"top",
   offset:[0,-12],
   className:"anchorLabel"
  }
 );

}


makeAnchor("ic");
makeAnchor("station");
makeAnchor("kumamachi");


/* =====================================================
 FOCUS ANCHOR
===================================================== */

function focusAnchor(key){

 const a=
 anchors[key];


 if(!overlayVisible){

  officialOverlay.addTo(map);
  overlayVisible=true;

 }


 map.setView(
  [a.lat,a.lng],
  a.zoom,
  {
   animate:false
  }
 );


 document
 .getElementById("status")
 .innerHTML=

 '<div class="place">'+
 '🎯 '+a.name+
 '</div>'+

 '<div class="row">'+
 '<b>黒い十字＝実座標</b>'+
 '<span class="detail">'+
 '半透明の公式区域図上で、同じ地点がどこに描かれているか確認します。'+
 '</span>'+
 '</div>'+

 '<div class="coords">'+
 a.lat.toFixed(5)+
 ', '+
 a.lng.toFixed(5)+
 '</div>';

}


/* =====================================================
 OVERLAY
===================================================== */

function toggleOverlay(){

 const b=
 document.getElementById(
  "overlayButton"
 );


 if(overlayVisible){

  map.removeLayer(
   officialOverlay
  );

  overlayVisible=false;

  b.innerHTML=
  "🗺 公式図 OFF";


 }else{

  officialOverlay.addTo(map);

  overlayVisible=true;

  b.innerHTML=
  "🗺 公式図 ON";

 }

}


/* =====================================================
 OPACITY
===================================================== */

function changeOpacity(){

 opacityIndex=
 (opacityIndex+1)
 %opacityLevels.length;


 const value=
 opacityLevels[
  opacityIndex
 ];


 officialOverlay.setOpacity(
  value
 );


 document
 .getElementById(
  "opacityBtn"
 )
 .innerHTML=

 "👁 透明度 "+
 Math.round(value*100)+
 "%";

}


/* =====================================================
 WHOLE AREA
===================================================== */

document
.getElementById("whole")
.onclick=()=>{

 map.fitBounds(
  OKUMA_BOUNDS
 );

};


/* =====================================================
 SIMPLE REVERSE GEOCODER
===================================================== */

async function reverseGeocode(
 lat,
 lng
){

 try{

  const url=

  "https://mreversegeocoder.gsi.go.jp/reverse-geocoder/"+
  "LonLatToAddress?lat="+
  encodeURIComponent(lat)+
  "&lon="+
  encodeURIComponent(lng);


  const r=
  await fetch(url);


  const j=
  await r.json();


  if(!j.results)
   return null;


  return{

   code:
   String(
    j.results.muniCd||""
   ),

   town:
   j.results.lv01Nm||""

  };


 }catch(e){

  return null;

 }

}


/* =====================================================
 MUNICIPALITY
===================================================== */

const municipalityNames={

 "07212":"南相馬市",
 "07543":"富岡町",
 "07545":"大熊町",
 "07546":"双葉町",
 "07547":"浪江町",
 "07548":"葛尾村",
 "07564":"飯舘村"

};


/* =====================================================
 CURRENT GPS
===================================================== */

let gpsMarker=null;
let accuracyCircle=null;

let tracking=false;
let watchId=null;


async function displayGPS(
 pos,
 follow
){

 const lat=
 pos.coords.latitude;

 const lng=
 pos.coords.longitude;

 const acc=
 pos.coords.accuracy;


 const ad=
 await reverseGeocode(
  lat,
  lng
 );


 let place=
 "住所取得中";


 if(ad){

  place=
  (
   municipalityNames[ad.code]||
   "対象7市町村外"
  )+
  (
   ad.town
   ?" "+ad.town
   :""
  );

 }


 if(gpsMarker)
  map.removeLayer(
   gpsMarker
  );


 if(accuracyCircle)
  map.removeLayer(
   accuracyCircle
  );


 gpsMarker=

 L.circleMarker(
  [lat,lng],
  {
   radius:10,
   color:"#fff",
   weight:3,
   fillColor:"#1677ff",
   fillOpacity:1,
   zIndexOffset:3000
  }
 )
 .addTo(map)
 .bindPopup(
  "<b>"+place+"</b>"
 );


 accuracyCircle=

 L.circle(
  [lat,lng],
  {
   radius:acc,
   color:"#1677ff",
   weight:1,
   fillColor:"#1677ff",
   fillOpacity:.06
  }
 )
 .addTo(map);


 document
 .getElementById("status")
 .innerHTML=

 '<div class="place">'+
 '📍 '+place+
 '</div>'+

 '<div class="row">'+
 '<b>🔵 GPS現在地</b>'+
 '<span class="detail">'+
 '区域ポリゴン完成後、この座標と各規制レイヤーを自動照合します。'+
 '</span>'+
 '</div>'+

 '<div class="coords">'+
 lat.toFixed(6)+
 ', '+
 lng.toFixed(6)+
 '・精度 約'+
 Math.round(acc)+
 'm'+
 '</div>';


 if(follow){

  map.setView(
   [lat,lng],
   16
  );

 }

}


/* =====================================================
 GPS BUTTON
===================================================== */

document
.getElementById("gps")
.onclick=()=>{

 document
 .getElementById("status")
 .innerHTML=
 "<b>📍 現在地を取得しています…</b>";


 navigator.geolocation.getCurrentPosition(

  p=>displayGPS(p,true),

  ()=>{

   document
   .getElementById("status")
   .innerHTML=
   "<b>現在地を取得できませんでした。</b>";

  },

  {
   enableHighAccuracy:true,
   timeout:15000,
   maximumAge:2000
  }

 );

};


/* =====================================================
 TRACK
===================================================== */

document
.getElementById("track")
.onclick=()=>{

 const b=
 document.getElementById(
  "track"
 );


 if(!tracking){

  tracking=true;

  b.innerHTML=
  "■ 追跡停止";

  b.style.background=
  "#a06400";


  watchId=

  navigator.geolocation.watchPosition(

   p=>displayGPS(
    p,
    true
   ),

   ()=>{},

   {
    enableHighAccuracy:true,
    maximumAge:3000,
    timeout:20000
   }

  );


 }else{

  tracking=false;


  if(watchId!==null){

   navigator.geolocation.clearWatch(
    watchId
   );

  }


  watchId=null;


  b.innerHTML=
  "▶ 移動追跡";

  b.style.background=
  "#08752e";

 }

};


/* =====================================================
 MAP TAP
===================================================== */

let selectedMarker=null;


map.on(
 "click",
 async e=>{

  const lat=
  e.latlng.lat;

  const lng=
  e.latlng.lng;


  const ad=
  await reverseGeocode(
   lat,
   lng
  );


  let place=
  "住所不明";


  if(ad){

   place=
   (
    municipalityNames[ad.code]||
    "対象7市町村外"
   )+
   (
    ad.town
    ?" "+ad.town
    :""
   );

  }


  if(selectedMarker){

   map.removeLayer(
    selectedMarker
   );

  }


  selectedMarker=

  L.circleMarker(
   [lat,lng],
   {
    radius:8,
    color:"#fff",
    weight:3,
    fillColor:"#e28a00",
    fillOpacity:1
   }
  )
  .addTo(map)
  .bindPopup(
   "<b>"+place+"</b>"
  )
  .openPopup();


  document
  .getElementById("status")
  .innerHTML=

  '<div class="place">'+
  '👆 '+place+
  '</div>'+

  '<div class="coords">'+
  lat.toFixed(6)+
  ', '+
  lng.toFixed(6)+
  '</div>';

 }
);


/* =====================================================
 OFFICIAL
===================================================== */

document
.getElementById("official")
.onclick=()=>{

 window.open(
  "https://www.town.okuma.fukushima.jp/site/fukkou/4598.html",
  "_blank"
 );

};


/* =====================================================
 LEGEND
===================================================== */

const legend=
L.control({
 position:"topright"
});


legend.onAdd=function(){

 const d=
 L.DomUtil.create(
  "div",
  "legend"
 );


 d.innerHTML=

 '<b>完成版予定</b><br>'+
 '🔴 帰還困難<br>'+
 '🟣 特定帰還居住<br>'+
 '▧ 立入規制緩和<br>'+
 '🟢 解除済み<br>'+
 '⬛ 中間貯蔵<br>'+
 '🔵 GPS';


 return d;

};


legend.addTo(map);


/* =====================================================
 INITIAL
===================================================== */

setTimeout(
 ()=>focusAnchor("ic"),
 500
);

</script>

</body>
</html>
