<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>福島・規制区域マップ</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html,body{
 margin:0;
 height:100%;
 font-family:-apple-system,BlinkMacSystemFont,
 "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}

#app{
 height:100%;
 display:flex;
 flex-direction:column;
}

header{
 background:#fff;
 padding:8px 10px;
 border-bottom:1px solid #ddd;
 z-index:1000;
}

h1{
 margin:0;
 font-size:19px;
}

.sub{
 font-size:10px;
 color:#666;
 margin-top:2px;
}

#status{
 margin-top:6px;
 padding:8px;
 border-radius:9px;
 background:#eef3f8;
 font-size:11px;
 line-height:1.45;
}

#mapWrap{
 position:relative;
 flex:1;
 min-height:310px;
}

#map{
 height:100%;
 width:100%;
}

#panel{
 position:absolute;
 left:7px;
 right:7px;
 bottom:7px;
 z-index:2000;
 background:rgba(255,255,255,.95);
 border-radius:10px;
 padding:7px;
 box-shadow:0 2px 10px rgba(0,0,0,.28);
}

.title{
 font-size:10px;
 font-weight:bold;
 margin-bottom:5px;
}

.grid3{
 display:grid;
 grid-template-columns:1fr 1fr 1fr;
 gap:4px;
}

.grid2{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:4px;
 margin-top:4px;
}

button{
 border:0;
 border-radius:7px;
 padding:8px 2px;
 color:#fff;
 font-size:10px;
 font-weight:700;
}

.zone{
 background:#70418b;
}

#opacity{
 background:#596b77;
}

#off{
 background:#555;
}

.controls{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:5px;
 background:#fff;
 border-top:1px solid #ddd;
 padding:6px;
}

#gps{
 background:#1769e0;
}

#whole{
 background:#7d5900;
}

.note{
 grid-column:1/3;
 font-size:8px;
 color:#666;
 line-height:1.4;
}

.anchor{
 width:18px;
 height:18px;
 border-radius:50%;
 border:2px solid #000;
 background:#fff;
 position:relative;
 box-sizing:border-box;
}

.anchor:before{
 content:"";
 position:absolute;
 left:7px;
 top:-7px;
 width:2px;
 height:28px;
 background:#000;
}

.anchor:after{
 content:"";
 position:absolute;
 top:7px;
 left:-7px;
 width:28px;
 height:2px;
 background:#000;
}

.anchorLabel{
 background:white;
 border:1px solid #222;
 color:#000;
 padding:1px 3px;
 border-radius:3px;
 font-size:8px;
 font-weight:bold;
 white-space:nowrap;
}

.legend{
 background:rgba(255,255,255,.94);
 padding:6px 7px;
 border-radius:6px;
 box-shadow:0 1px 5px rgba(0,0,0,.3);
 font-size:9px;
 line-height:1.45;
}
</style>
</head>

<body>

<div id="app">

<header>
<h1>福島・規制区域マップ</h1>

<div class="sub">
v27｜大熊町・公式詳細区域図 地理参照
</div>

<div id="status">
<b>①～③の公式詳細図を個別に確認します。</b><br>
今回は区域判定ではなく、GeoJSON化のための位置合わせです。
</div>
</header>


<div id="mapWrap">

<div id="map"></div>

<div id="panel">

<div class="title">
🗺 2026年6月22日 立入規制緩和詳細図
</div>

<div class="grid3">

<button class="zone"
onclick="showZone(1)">
① 野上・下野上
</button>

<button class="zone"
onclick="showZone(2)">
② 熊2・熊3
</button>

<button class="zone"
onclick="showZone(3)">
③ 熊2・町区
</button>

</div>

<div class="grid2">

<button id="opacity"
onclick="cycleOpacity()">
👁 透明度45%
</button>

<button id="off"
onclick="hideOverlay()">
画像OFF
</button>

</div>

</div>

</div>


<div class="controls">

<button id="gps">
📍 現在地
</button>

<button id="whole">
🗾 大熊町
</button>

<div class="note">
⚠️ この画像位置は地理参照作業中です。
まだGPSによる区域判定には使用しません。
次工程で画像の緑輪郭をGeoJSON化します。
</div>

</div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =====================================================
 MAP
===================================================== */

const map=L.map("map").setView(
 [37.400,140.985],
 13
);

L.tileLayer(
 "https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",
 {
  attribution:"地理院タイル",
  maxZoom:18
 }
).addTo(map);


/* =====================================================
 FUKUSHIMA DAIICHI
===================================================== */

L.circleMarker(
 [37.4211,141.0328],
 {
  radius:5,
  color:"#fff",
  weight:2,
  fillColor:"#111",
  fillOpacity:1
 }
)
.addTo(map)
.bindPopup("福島第一原子力発電所");


/* =====================================================
 OFFICIAL DETAIL IMAGES

 ① 野上2区・下野上1区
 ② 熊2区・熊3区
 ③ 熊2区・町区
===================================================== */

const zoneData={

 1:{
  name:"① 野上2区・下野上1区",

  image:
  "https://www.town.okuma.fukushima.jp/uploaded/image/18395.jpg",

  /*
   仮地理参照範囲。
   v27では道路・ICとの照合用。
  */
  bounds:[
   [37.3990,140.9400],
   [37.4235,140.9850]
  ],

  view:[37.4115,140.9635],
  zoom:15
 },


 2:{
  name:"② 熊2区・熊3区の一部",

  image:
  "https://www.town.okuma.fukushima.jp/uploaded/image/18400.jpg",

  bounds:[
   [37.3690,140.9850],
   [37.4000,141.0250]
  ],

  view:[37.3845,141.0060],
  zoom:15
 },


 3:{
  name:"③ 熊2区・町区の一部",

  image:
  "https://www.town.okuma.fukushima.jp/uploaded/image/18397.jpg",

  bounds:[
   [37.3680,140.9950],
   [37.3980,141.0320]
  ],

  view:[37.3830,141.0130],
  zoom:15
 }

};


/* =====================================================
 OVERLAY
===================================================== */

let currentOverlay=null;
let currentZone=1;

const opacityValues=[
 .25,
 .45,
 .65,
 .80
];

let opacityIndex=1;


/* =====================================================
 CONTROL POINTS
===================================================== */

const anchors=[

 {
  name:"大熊IC",
  lat:37.412372,
  lng:140.963952
 },

 {
  name:"大野駅",
  lat:37.409384,
  lng:140.984313
 },

 {
  name:"野上",
  lat:37.410516,
  lng:140.958734
 },

 {
  name:"下野上",
  lat:37.413843,
  lng:140.975327
 },

 {
  name:"熊町",
  lat:37.381742,
  lng:141.007522
 },

 {
  name:"西大和久",
  lat:37.405128,
  lng:141.000187
 }

];


const anchorLayer=
L.layerGroup().addTo(map);


anchors.forEach(a=>{

 const icon=L.divIcon({
  className:"",
  html:'<div class="anchor"></div>',
  iconSize:[18,18],
  iconAnchor:[9,9]
 });

 const m=L.marker(
  [a.lat,a.lng],
  {
   icon,
   zIndexOffset:3000
  }
 )
 .addTo(anchorLayer);

 m.bindTooltip(
  a.name,
  {
   permanent:true,
   direction:"top",
   offset:[0,-11],
   className:"anchorLabel"
  }
 );

});


/* =====================================================
 SHOW ZONE
===================================================== */

function showZone(number){

 currentZone=number;

 const z=zoneData[number];

 if(currentOverlay){
  map.removeLayer(currentOverlay);
 }

 currentOverlay=
 L.imageOverlay(
  z.image,
  z.bounds,
  {
   opacity:
   opacityValues[opacityIndex],

   zIndex:450,

   interactive:false
  }
 );

 currentOverlay.addTo(map);

 map.setView(
  z.view,
  z.zoom,
  {
   animate:false
  }
 );

 document
 .getElementById("status")
 .innerHTML=

 "<b>"+z.name+"</b><br>"+
 "黒い十字は既知の実座標です。"+
 "公式図の道路・IC・駅・河川との位置関係を確認します。";

}


/* =====================================================
 OPACITY
===================================================== */

function cycleOpacity(){

 opacityIndex=
 (opacityIndex+1)%
 opacityValues.length;

 const value=
 opacityValues[opacityIndex];

 if(currentOverlay){
  currentOverlay.setOpacity(value);
 }

 document
 .getElementById("opacity")
 .innerHTML=
 "👁 透明度"+
 Math.round(value*100)+"%";

}


/* =====================================================
 HIDE
===================================================== */

function hideOverlay(){

 if(currentOverlay){

  map.removeLayer(currentOverlay);
  currentOverlay=null;

 }

 document
 .getElementById("status")
 .innerHTML=
 "<b>公式詳細図を非表示にしました。</b>";

}


/* =====================================================
 GPS
===================================================== */

let gpsMarker=null;
let accCircle=null;


document
.getElementById("gps")
.onclick=()=>{

 document
 .getElementById("status")
 .innerHTML=
 "📍 現在地を取得しています…";


 navigator.geolocation.getCurrentPosition(

  pos=>{

   const lat=
   pos.coords.latitude;

   const lng=
   pos.coords.longitude;

   const acc=
   pos.coords.accuracy;


   if(gpsMarker)
    map.removeLayer(gpsMarker);

   if(accCircle)
    map.removeLayer(accCircle);


   gpsMarker=
   L.circleMarker(
    [lat,lng],
    {
     radius:9,
     color:"#fff",
     weight:3,
     fillColor:"#1677ff",
     fillOpacity:1
    }
   ).addTo(map);


   accCircle=
   L.circle(
    [lat,lng],
    {
     radius:acc,
     color:"#1677ff",
     weight:1,
     fillColor:"#1677ff",
     fillOpacity:.07
    }
   ).addTo(map);


   map.setView(
    [lat,lng],
    16
   );


   document
   .getElementById("status")
   .innerHTML=

   "<b>📍 GPS現在地</b><br>"+
   lat.toFixed(6)+
   ", "+
   lng.toFixed(6)+
   "　精度±"+
   Math.round(acc)+
   "m";

  },

  ()=>{

   document
   .getElementById("status")
   .innerHTML=
   "現在地を取得できませんでした。";

  },

  {
   enableHighAccuracy:true,
   timeout:15000,
   maximumAge:2000
  }

 );

};


/* =====================================================
 WHOLE OKUMA
===================================================== */

document
.getElementById("whole")
.onclick=()=>{

 map.setView(
  [37.4044,140.9834],
  13
 );

};


/* =====================================================
 LEGEND
===================================================== */

const legend=
L.control({
 position:"topright"
});


legend.onAdd=function(){

 const d=
 L.DomUtil.create(
  "div",
  "legend"
 );

 d.innerHTML=
 "<b>v27 作業用</b><br>"+
 "🟢 公式図の緑＝立入規制緩和<br>"+
 "✚ 黒十字＝地理基準点<br>"+
 "🔵 GPS<br>"+
 "<hr style='margin:4px 0'>"+
 "※画像は位置合わせ中";

 return d;

};


legend.addTo(map);


/* =====================================================
 INITIAL
===================================================== */

setTimeout(
 ()=>showZone(1),
 400
);

</script>

</body>
</html>
