}
#officialImage{

  width:100%;
}

  padding:10px;
  font-size:12px;
  line-height:1.5;

<div class="note">

現在の帰還困難区域には解除済み区域があるため、
赤色の中＝現在も帰還困難区域、とは限りません。
最終判断は国・福島県の最新情報を優先してください。
</div>

</div>
</div>

/* ===== point in polygon ===== */

function pointInPolygon(lat,lng,poly){

 let inside=false;

 for(let i=0,j=poly.length-1;i<poly.length;j=i++){

  const yi=poly[i][0];
  const xi=poly[i][1];

  const yj=poly[j][0];
  const xj=poly[j][1];

  const intersect=
   ((yi>lat)!==(yj>lat)) &&
   (
    lng <
    (xj-xi)*(lat-yi)/(yj-yi)+xi
   );

  if(intersect) inside=!inside;
 }

 return inside;
}

const municipalities={
 "07212":"南相馬市",
 "07543":"富岡町",
 "07545":"大熊町",
 "07546":"双葉町",
 "07547":"浪江町",
 "07548":"葛尾村",
 "07564":"飯舘村"
};


/* ===== GPS ===== */

let userMarker=null;
let accuracyCircle=null;

const status=document.getElementById("status");
const addressBox=document.getElementById("address");

async function getAddress(lat,lng){

 try{

  const url=
   "https://mreversegeocoder.gsi.go.jp/reverse-geocoder/"+
   "LonLatToAddress?lat="+
   encodeURIComponent(lat)+
   "&lon="+
   encodeURIComponent(lng);

  const r=await fetch(url);

  if(!r.ok) throw new Error();

  const d=await r.json();

  if(!d.results) return null;

  const code=d.results.muniCd || "";
  const town=d.results.lv01Nm || "";

  return {
   code:code,
   municipality:municipalities[code] || "",
   town:town
  };

 }catch(e){

  return null;

 }

}


document.getElementById("gps")
.addEventListener("click",()=>{

 status.innerHTML=
  "現在地を取得しています…"+
  '<div id="address"></div>';

 navigator.geolocation.getCurrentPosition(

 async pos=>{

  const lat=pos.coords.latitude;
  const lng=pos.coords.longitude;
  const acc=pos.coords.accuracy;

  if(userMarker) map.removeLayer(userMarker);
  if(accuracyCircle) map.removeLayer(accuracyCircle);

  userMarker=L.circleMarker(
   [lat,lng],
   {
    radius:9,
    color:"white",
    weight:3,
    fillColor:"#1769e0",
    fillOpacity:1
   }
  ).addTo(map);

  accuracyCircle=L.circle(
   [lat,lng],
   {
    radius:acc,
    color:"#1769e0",
    weight:1,
    fillOpacity:.07
   }
  ).addTo(map);


  const oldInside=
   pointInPolygon(lat,lng,zonePoints);

  const ad=await getAddress(lat,lng);

  let addressText="";

  if(ad){

   addressText=
    (ad.municipality ? ad.municipality+" " : "")+
    (ad.town || "");

  }


  if(oldInside){

   status.innerHTML=
    "⚠️ <b>旧DTRZ参考境界の内側です。</b><br>"+
    "ただし、解除済み区域が含まれるため、"+
    "現在も帰還困難区域とは限りません。"+
    "<div id='address'>"+
    (addressText ?
      "現在地：福島県 "+addressText :
      "地名を取得できませんでした。")+
    "</div>";

  }else{

   status.innerHTML=
    "✅ <b>旧DTRZ参考境界の外側です。</b><br>"+
    "現在残っている帰還困難区域は旧区域より縮小しているため、"+
    "参考上は帰還困難区域外と考えられます。"+
    "<div id='address'>"+
    (addressText ?
      "現在地：福島県 "+addressText :
      "地名を取得できませんでした。")+
    "</div>";

  }


  map.setView([lat,lng],16);

  userMarker.bindPopup(
   "<b>現在地</b><br>"+
   (addressText || "")+
   "<br>"+
   lat.toFixed(6)+", "+lng.toFixed(6)+
   "<br>GPS精度 約"+Math.round(acc)+"m"
  ).openPopup();

 },

 err=>{

  status.innerHTML=
   "現在地を取得できませんでした。"+
   "<br>Safariの位置情報利用を確認してください。";

 },

 {
  enableHighAccuracy:true,
  timeout:15000,
  maximumAge:3000
 }

 );

});

};
