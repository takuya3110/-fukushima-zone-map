<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>福島・規制区域マップ</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html,body{
 margin:0;height:100%;
 font-family:-apple-system,BlinkMacSystemFont,
 "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
#app{height:100%;display:flex;flex-direction:column}
header{
 padding:8px 10px;background:#fff;
 border-bottom:1px solid #ddd;
}
h1{margin:0;font-size:19px}
.sub{font-size:10px;color:#666;margin-top:2px}

#status{
 margin-top:6px;padding:7px 8px;
 border-radius:9px;background:#eef3f8;
 font-size:10px;line-height:1.4;
}

.row{
 margin-top:4px;padding:5px 7px;
 background:#fff;border-radius:6px;
}
.r{border-left:5px solid #d92323}
.p{border-left:5px solid #9d28c2}
.g{border-left:5px solid #18a83c}
.x{border-left:5px solid #777}

#mapWrap{position:relative;flex:1;min-height:300px}
#map{height:100%;width:100%}

#panel{
 position:absolute;
 left:6px;right:6px;bottom:7px;
 z-index:1000;
 padding:7px;
 background:rgba(255,255,255,.96);
 border-radius:10px;
 box-shadow:0 2px 10px rgba(0,0,0,.3);
}

.ptitle{font-size:9px;font-weight:bold;margin-bottom:4px}

.layers{
 display:grid;
 grid-template-columns:1fr 1fr 1fr;
 gap:4px;
}

.details{
 display:grid;
 grid-template-columns:1fr 1fr 1fr;
 gap:4px;margin-top:4px;
}

.tools{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:4px;margin-top:4px;
}

button{
 border:0;border-radius:7px;
 padding:8px 2px;color:white;
 font-size:9px;font-weight:bold;
}

#redLayer{background:#c82323}
#purpleLayer{background:#8526a7}
#greenLayer{background:#148d35}

.detail{background:#665174}
.tool{background:#586b76}

.active{
 outline:3px solid #111;
 outline-offset:-2px;
}

.bottom{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:5px;padding:6px;
 border-top:1px solid #ddd;
 background:#fff;
}

#gps{background:#1769e0}
#track{background:#08752e}
#official{background:#705500}
#reset{background:#555}

.note{
 grid-column:1/3;
 font-size:8px;color:#666;
 line-height:1.4;
}

.legend{
 background:rgba(255,255,255,.95);
 padding:6px;border-radius:7px;
 box-shadow:0 1px 5px rgba(0,0,0,.3);
 font-size:9px;line-height:1.5;
}
</style>
</head>

<body>

<div id="app">

<header>

<h1>福島・規制区域マップ</h1>

<div class="sub">
v30｜規制レイヤー分離版
</div>

<div id="status">

<b>大熊町・制度状態</b>

<div class="row r">
🔴 <b>避難指示</b>：
帰還困難区域が町内に残っています
</div>

<div class="row p">
🟣 <b>特定帰還居住区域</b>：
帰還困難区域内に設定
</div>

<div class="row g">
🟩 <b>立入規制緩和</b>：
2026年6月22日から一部で実施
</div>

</div>

</header>


<div id="mapWrap">

<div id="map"></div>

<div id="panel">

<div class="ptitle">
表示する制度レイヤー
</div>

<div class="layers">

<button id="redLayer"
 onclick="showRed()">
🔴 帰還困難
</button>

<button id="purpleLayer"
 onclick="showPurple()">
🟣 帰還居住
</button>

<button id="greenLayer"
 onclick="showGreen()">
🟩 立入緩和
</button>

</div>


<div class="ptitle" style="margin-top:6px">
立入規制緩和・詳細図
</div>

<div class="details">

<button class="detail"
 onclick="showGreenDetail(1)">
① 野上
</button>

<button class="detail"
 onclick="showGreenDetail(2)">
② 熊2・3
</button>

<button class="detail"
 onclick="showGreenDetail(3)">
③ 町区
</button>

</div>


<div class="tools">

<button class="tool"
 onclick="changeOpacity()">
👁 透明度
</button>

<button class="tool"
 onclick="hideOverlay()">
画像OFF
</button>

</div>

</div>

</div>


<div class="bottom">

<button id="gps">
📍 現在地判定
</button>

<button id="track">
▶ 移動追跡
</button>

<button id="official">
🏛 公式情報
</button>

<button id="reset">
🗾 大熊町
</button>

<div class="note">
赤・紫・緑は別の制度です。
🟣や🟩でも避難指示が解除されたとは限りません。
公式図は参考表示で、地番境界の法的判定には使用しません。
</div>

</div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* ==============================
 MAP
============================== */

const map=L.map("map").setView(
 [37.400,140.985],13
);

L.tileLayer(
 "https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",
 {
  attribution:"地理院タイル",
  maxZoom:18
 }
).addTo(map);


/* Daiichi */

L.circleMarker(
 [37.4211,141.0328],
 {
  radius:5,
  color:"#fff",
  weight:2,
  fillColor:"#111",
  fillOpacity:1
 }
)
.addTo(map)
.bindPopup("福島第一原子力発電所");


/* ==============================
 OFFICIAL MAPS
============================== */

/*
 red/purple:
 current official whole-town map.

 This is reference imagery,
 NOT vector GIS.
*/

const wholeOfficial=
"https://www.town.okuma.fukushima.jp/uploaded/image/18390.jpg";


const wholeBounds=[
 [37.3600,140.8300],
 [37.4470,141.0600]
];


/*
 green detailed maps
*/

const greenMaps={

1:{
 name:"野上2区・下野上1区",
 image:
 "https://www.town.okuma.fukushima.jp/uploaded/image/18395.jpg",
 bounds:[
  [37.3990,140.9400],
  [37.4235,140.9850]
 ],
 view:[37.4115,140.9635],
 zoom:15
},

2:{
 name:"熊2区・熊3区の一部",
 image:
 "https://www.town.okuma.fukushima.jp/uploaded/image/18400.jpg",
 bounds:[
  [37.3690,140.9850],
  [37.4000,141.0250]
 ],
 view:[37.3845,141.0060],
 zoom:15
},

3:{
 name:"熊2区・町区の一部",
 image:
 "https://www.town.okuma.fukushima.jp/uploaded/image/18397.jpg",
 bounds:[
  [37.3680,140.9950],
  [37.3980,141.0320]
 ],
 view:[37.3830,141.0130],
 zoom:15
}

};


let overlay=null;

const opacities=[
 .25,.45,.65,.80
];

let opacityIndex=1;


/* ==============================
 STATUS HELPERS
============================== */

function status(
 title,
 body
){

 document
 .getElementById("status")
 .innerHTML=
 "<b>"+title+"</b><br>"+body;

}


function clearButtons(){

 document
 .querySelectorAll(
  "#redLayer,#purpleLayer,#greenLayer"
 )
 .forEach(
  b=>b.classList.remove("active")
 );

}


/* ==============================
 RED
============================== */

function showRed(){

 hideOverlay();

 clearButtons();

 document
 .getElementById("redLayer")
 .classList.add("active");


 overlay=
 L.imageOverlay(
  wholeOfficial,
  wholeBounds,
  {
   opacity:
   opacities[opacityIndex],
   zIndex:400
  }
 )
 .addTo(map);


 map.setView(
  [37.400,140.985],
  13
 );


 status(
  "🔴 帰還困難区域",
  "大熊町公式区域図を表示しています。"+
  "<br>赤系統の区域は避難指示が継続している区域です。"+
  "<br>※画像位置は参考表示。"
 );

}


/* ==============================
 PURPLE
============================== */

function showPurple(){

 hideOverlay();

 clearButtons();

 document
 .getElementById("purpleLayer")
 .classList.add("active");


 overlay=
 L.imageOverlay(
  wholeOfficial,
  wholeBounds,
  {
   opacity:
   opacities[opacityIndex],
   zIndex:400
  }
 )
 .addTo(map);


 map.setView(
  [37.400,140.985],
  13
 );


 status(
  "🟣 特定帰還居住区域",
  "2026年3月24日の変更認定で"+
  "10行政区・約570ha。"+
  "<br>避難指示解除を目指して"+
  "除染・インフラ復旧を進める区域です。"+
  "<br>※まだ避難指示解除済みという意味ではありません。"
 );

}


/* ==============================
 GREEN
============================== */

function showGreen(){

 clearButtons();

 document
 .getElementById("greenLayer")
 .classList.add("active");

 showGreenDetail(1);

}


function showGreenDetail(n){

 hideOverlay();

 const z=
 greenMaps[n];


 overlay=
 L.imageOverlay(
  z.image,
  z.bounds,
  {
   opacity:
   opacities[opacityIndex],
   zIndex:450
  }
 )
 .addTo(map);


 map.setView(
  z.view,
  z.zoom,
  {animate:false}
 );


 status(
  "🟩 立入規制緩和区域",
  z.name+
  "<br>2026年6月22日から緩和。"+
  "<br>公式図の緑色部分は"+
  "バリケードがなくなり、"+
  "自由に立入り可能とされています。"
 );

}


/* ==============================
 IMAGE CONTROL
============================== */

function hideOverlay(){

 if(overlay){

  map.removeLayer(overlay);
  overlay=null;

 }

}


function changeOpacity(){

 opacityIndex=
 (opacityIndex+1)%
 opacities.length;


 if(overlay){

  overlay.setOpacity(
   opacities[opacityIndex]
  );

 }


 status(
  "👁 表示透明度",
  Math.round(
   opacities[opacityIndex]*100
  )+
  "%"
 );

}


/* ==============================
 GSI ADDRESS
============================== */

async function reverseAddress(
 lat,lng
){

 try{

  const r=
  await fetch(
   "https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress"+
   "?lat="+lat+
   "&lon="+lng
  );


  const j=
  await r.json();


  if(!j.results)
   return null;


  return{

   muni:
   String(
    j.results.muniCd||""
   ),

   town:
   j.results.lv01Nm||""

  };


 }catch(e){

  return null;

 }

}


/* ==============================
 GPS STATUS

 Conservative:
 do not claim polygon membership
 without verified vector boundary.
============================== */

async function evaluate(
 lat,lng,accuracy
){

 const ad=
 await reverseAddress(
  lat,lng
 );


 let place=
 lat.toFixed(6)+
 ", "+
 lng.toFixed(6);


 if(ad){

  if(ad.muni==="07545"){

   place=
   "大熊町 "+
   ad.town+
   "<br>"+
   place;

  }else{

   place=
   ad.town+
   "<br>"+
   place;

  }

 }


 if(!ad || ad.muni!=="07545"){

  document
  .getElementById("status")
  .innerHTML=

  "<b>📍 "+place+"</b>"+

  '<div class="row x">'+
  'v30の自動判定対象は大熊町です。'+
  '</div>';

  return;

 }


 /*
 only fully released-side
 address names are conservatively
 recognized.
 */

 const clearlyReleased=
 (
  ad.town.includes("大川原")||
  ad.town.includes("中屋敷")
 );


 let html=
 "<b>📍 "+place+"</b>";


 if(clearlyReleased){

  html+=

  '<div class="row g">'+
  '<b>避難指示</b><br>'+
  '🟢 解除側として判定'+
  '</div>'+

  '<div class="row x">'+
  '<b>特定帰還居住区域</b><br>'+
  '― 該当しないと考えられる'+
  '</div>'+

  '<div class="row g">'+
  '<b>立入規制</b><br>'+
  '🟢 通常の解除区域'+
  '</div>';

 }else{

  html+=

  '<div class="row x">'+
  '<b>避難指示</b><br>'+
  '⚠️ 境界データ未確定のため未判定'+
  '</div>'+

  '<div class="row x">'+
  '<b>特定帰還居住区域</b><br>'+
  '⚠️ 境界データ未確定のため未判定'+
  '</div>'+

  '<div class="row x">'+
  '<b>立入規制</b><br>'+
  '⚠️ 公式詳細図で確認してください'+
  '</div>';

 }


 html+=
 '<div style="font-size:8px;color:#666;margin-top:4px">'+
 'GPS精度 約±'+
 Math.round(accuracy)+
 'm'+
 '</div>';


 document
 .getElementById("status")
 .innerHTML=html;

}


/* ==============================
 GPS
============================== */

let gpsMarker=null;
let accCircle=null;


function drawGPS(
 pos,follow
){

 const lat=
 pos.coords.latitude;

 const lng=
 pos.coords.longitude;

 const acc=
 pos.coords.accuracy;


 if(gpsMarker)
  map.removeLayer(gpsMarker);

 if(accCircle)
  map.removeLayer(accCircle);


 gpsMarker=
 L.circleMarker(
  [lat,lng],
  {
   radius:9,
   color:"#fff",
   weight:3,
   fillColor:"#1677ff",
   fillOpacity:1
  }
 )
 .addTo(map);


 accCircle=
 L.circle(
  [lat,lng],
  {
   radius:acc,
   color:"#1677ff",
   weight:1,
   fillColor:"#1677ff",
   fillOpacity:.08
  }
 )
 .addTo(map);


 if(follow){

  map.setView(
   [lat,lng],
   16
  );

 }


 evaluate(
  lat,lng,acc
 );

}


/* GPS button */

document
.getElementById("gps")
.onclick=()=>{

 status(
  "📍 現在地",
  "取得しています…"
 );


 navigator.geolocation
 .getCurrentPosition(

  p=>drawGPS(p,true),

  ()=>status(
   "GPS",
   "現在地を取得できませんでした。"
  ),

  {
   enableHighAccuracy:true,
   timeout:15000,
   maximumAge:1000
  }

 );

};


/* ==============================
 TRACKING
============================== */

let tracking=false;
let watchId=null;


document
.getElementById("track")
.onclick=()=>{

 const b=
 document.getElementById("track");


 if(!tracking){

  tracking=true;

  b.innerHTML=
  "■ 追跡停止";

  b.style.background=
  "#a26b00";


  watchId=
  navigator.geolocation
  .watchPosition(

   p=>drawGPS(p,true),

   ()=>{},

   {
    enableHighAccuracy:true,
    timeout:20000,
    maximumAge:2000
   }

  );


 }else{

  tracking=false;


  if(watchId!==null){

   navigator.geolocation
   .clearWatch(watchId);

  }


  watchId=null;

  b.innerHTML=
  "▶ 移動追跡";

  b.style.background=
  "#08752e";

 }

};


/* ==============================
 MAP TAP
============================== */

let tapMarker=null;


map.on(
 "click",
 e=>{

  if(tapMarker)
   map.removeLayer(tapMarker);


  tapMarker=
  L.circleMarker(
   e.latlng,
   {
    radius:7,
    color:"#fff",
    weight:2,
    fillColor:"#e58a00",
    fillOpacity:1
   }
  )
  .addTo(map);


  evaluate(
   e.latlng.lat,
   e.latlng.lng,
   0
  );

 }
);


/* ==============================
 BUTTONS
============================== */

document
.getElementById("official")
.onclick=()=>{

 window.open(
  "https://www.town.okuma.fukushima.jp/soshiki/kankyoutaisaku/34555.html",
  "_blank"
 );

};


document
.getElementById("reset")
.onclick=()=>{

 map.setView(
  [37.400,140.985],
  13
 );

};


/* ==============================
 LEGEND
============================== */

const legend=
L.control({
 position:"topright"
});


legend.onAdd=function(){

 const d=
 L.DomUtil.create(
  "div",
  "legend"
 );


 d.innerHTML=

 "<b>v30</b><br>"+
 "🔴 帰還困難区域<br>"+
 "🟣 特定帰還居住区域<br>"+
 "🟩 立入規制緩和<br>"+
 "🟢 避難指示解除<br>"+
 "🔵 GPS現在地";


 return d;

};


legend.addTo(map);


/* ==============================
 START
============================== */

setTimeout(
 ()=>showGreen(),
 350
);

</script>

</body>
</html>
