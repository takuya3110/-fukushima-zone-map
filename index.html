<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>福島・規制区域マップ</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html,body{
 margin:0;height:100%;
 font-family:-apple-system,BlinkMacSystemFont,
 "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}

#app{
 height:100%;
 display:flex;
 flex-direction:column;
}

header{
 padding:7px 8px;
 background:white;
 border-bottom:1px solid #ddd;
}

h1{
 margin:0;
 font-size:18px;
}

.sub{
 font-size:10px;
 color:#666;
}

#status{
 margin-top:5px;
 padding:6px;
 background:#eef3f8;
 border-radius:8px;
 font-size:10px;
 line-height:1.45;
 max-height:145px;
 overflow:auto;
}

.row{
 margin-top:4px;
 padding:5px 7px;
 background:white;
 border-radius:6px;
}

.blue{border-left:5px solid #1677ff}
.red{border-left:5px solid #d92323}
.purple{border-left:5px solid #9d28c2}
.green{border-left:5px solid #18a83c}
.orange{border-left:5px solid #e58a00}
.grey{border-left:5px solid #777}

#mapWrap{
 position:relative;
 flex:1;
 min-height:260px;
}

#map{
 height:100%;
 width:100%;
}

#panel{
 position:absolute;
 left:5px;
 right:5px;
 bottom:6px;
 z-index:1000;
 background:rgba(255,255,255,.96);
 padding:6px;
 border-radius:10px;
 box-shadow:0 2px 10px rgba(0,0,0,.3);
}

.title{
 font-size:9px;
 font-weight:bold;
 margin:3px 0;
}

.towns{
 display:grid;
 grid-template-columns:
 repeat(4,1fr);
 gap:3px;
}

.roads{
 display:grid;
 grid-template-columns:
 repeat(4,1fr);
 gap:3px;
 margin-top:3px;
}

button{
 border:0;
 border-radius:6px;
 padding:7px 1px;
 color:white;
 font-size:8px;
 font-weight:bold;
}

.town{
 background:#1769e0;
}

.road{
 background:#df7900;
}

#all{
 background:#7030a0;
}

#gps{
 background:#1769e0;
}

#track{
 background:#08752e;
}

#wide{
 background:#555;
}

.bottom{
 display:grid;
 grid-template-columns:
 1fr 1fr 1fr;
 gap:4px;
 padding:5px;
 background:white;
 border-top:1px solid #ddd;
}

.note{
 grid-column:1/4;
 font-size:8px;
 color:#666;
 line-height:1.35;
}
</style>
</head>


<body>

<div id="app">

<header>

<h1>福島・規制区域マップ</h1>

<div class="sub">
v37｜浜通り7市町村・広域版
</div>

<div id="status">

<b>📍 現在地または市町村を選択</b>

<div class="row blue">
帰還困難区域が残る7市町村を対象にしています。
</div>

</div>

</header>


<div id="mapWrap">

<div id="map"></div>


<div id="panel">

<div class="title">
🔴 帰還困難区域が残る7市町村
</div>

<div class="towns">

<button class="town"
onclick="goTown('minamisoma')">
南相馬
</button>

<button class="town"
onclick="goTown('iitate')">
飯舘
</button>

<button class="town"
onclick="goTown('namie')">
浪江
</button>

<button class="town"
onclick="goTown('katsurao')">
葛尾
</button>

<button class="town"
onclick="goTown('futaba')">
双葉
</button>

<button class="town"
onclick="goTown('okuma')">
大熊
</button>

<button class="town"
onclick="goTown('tomioka')">
富岡
</button>

<button id="all"
onclick="showAllTowns()">
7市町村
</button>

</div>


<div class="title">
🟠 特別通過交通
</div>

<div class="roads">

<button class="road"
onclick="road114()">
114号
</button>

<button class="road"
onclick="road49()">
県49
</button>

<button class="road"
onclick="road35()">
県35
</button>

<button class="road"
onclick="road288()">
288号
</button>

<button class="road"
onclick="road252()">
252
</button>

<button class="road"
onclick="road101()">
双葉101
</button>

<button class="road"
onclick="road67()">
東67
</button>

<button class="road"
onclick="trafficList()">
全8区分
</button>

</div>

</div>

</div>


<div class="bottom">

<button id="gps">
📍 現在地
</button>

<button id="track">
▶ 移動追跡
</button>

<button id="wide">
🗾 広域
</button>

<div class="note">
市町村ボタンは区域そのものを示すものではありません。
帰還困難区域は各市町村の一部です。
</div>

</div>

</div>


<script src=
"https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script>

/* ================= MAP ================= */

const map=L.map("map").setView(
 [37.48,140.95],
 10
);

L.tileLayer(
 "https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",
 {
  attribution:"地理院タイル",
  maxZoom:18
 }
).addTo(map);


/* Fukushima Daiichi */

L.circleMarker(
 [37.4211,141.0328],
 {
  radius:5,
  color:"#fff",
  weight:2,
  fillColor:"#111",
  fillOpacity:1
 }
)
.addTo(map)
.bindPopup(
 "福島第一原子力発電所"
);


/* ================= TOWNS ================= */

const towns={

 minamisoma:{
  name:"南相馬市",
  xy:[37.638,140.957],
  zoom:11,
  info:
  "小高区金谷等の一部に帰還困難区域があります。"
 },

 iitate:{
  name:"飯舘村",
  xy:[37.616,140.744],
  zoom:11,
  info:
  "長泥地区の一部に帰還困難区域があります。"
 },

 namie:{
  name:"浪江町",
  xy:[37.494,140.993],
  zoom:11,
  info:
  "町西部を中心に帰還困難区域が残っています。"
 },

 katsurao:{
  name:"葛尾村",
  xy:[37.503,140.765],
  zoom:12,
  info:
  "村内の一部に帰還困難区域があります。"
 },

 futaba:{
  name:"双葉町",
  xy:[37.449,141.010],
  zoom:13,
  info:
  "町内の一部に帰還困難区域があります。"
 },

 okuma:{
  name:"大熊町",
  xy:[37.400,140.985],
  zoom:13,
  info:
  "町内の一部に帰還困難区域があります。立入規制緩和区域も設定されています。"
 },

 tomioka:{
  name:"富岡町",
  xy:[37.345,141.008],
  zoom:13,
  info:
  "小良ヶ浜・深谷地区を中心に帰還困難区域が残っています。"
 }

};


function goTown(id){

 const t=towns[id];

 map.setView(
  t.xy,
  t.zoom
 );

 setStatus(

  "<b>🔵 "+
  t.name+
  "</b>"+

  '<div class="row red">'+
  "<b>帰還困難区域</b><br>"+
  t.info+
  "</div>"+

  '<div class="row purple">'+
  "🟣 特定帰還居住区域が設定されている場合も、"+
  "避難指示が実際に解除されるまでは帰還困難区域です。"+
  "</div>"

 );

}


function showAllTowns(){

 map.setView(
  [37.50,140.92],
  10
 );

 setStatus(

  "<b>🔴 現在、帰還困難区域が残る7市町村</b>"+

  '<div class="row red">'+
  "南相馬市<br>"+
  "飯舘村<br>"+
  "浪江町<br>"+
  "葛尾村<br>"+
  "双葉町<br>"+
  "大熊町<br>"+
  "富岡町"+
  "</div>"

 );

}


/* ================= ROADS ================= */

function roadStatus(
 title,
 text,
 condition
){

 setStatus(

 "<b>🟠 "+
 title+
 "</b>"+

 '<div class="row orange">'+
 text+
 '</div>'+

 '<div class="row green">'+
 condition+
 '</div>'+

 '<div class="row red">'+
 "⚠️ 特別通過交通は対象道路の通過制度です。"+
 "道路から帰還困難区域内の脇道等へ自由に入れることを意味しません。"+
 '</div>'

 );

}


function road114(){

 map.setView(
  [37.62,140.86],
  12
 );

 roadStatus(
  "国道114号",
  "南相馬市の帰還困難区域内の対象区間",
  "時間制限なし／対象者制限なし／通行証不要"
 );

}


function road49(){

 map.setView(
  [37.60,140.89],
  12
 );

 roadStatus(
  "県道49号",
  "南相馬市区間",
  "時間制限なし／対象者制限なし／通行証不要"
 );

}


function road35(){

 map.setView(
  [37.46,140.90],
  11
 );

 roadStatus(
  "県道35号～国道288号",
  "双葉町・浪江町境～双葉町・大熊町境",
  "通行証不要。軽車両・歩行者を除く。"
 );

}


function road288(){

 map.setView(
  [37.42,140.91],
  12
 );

 roadStatus(
  "国道288号",
  "県道35号～双葉町側の対象区域境",
  "自動二輪・原付を含む自動車は対象。軽車両・歩行者は不可。通行証不要。"
 );

}


function road252(){

 map.setView(
  [37.405,140.993],
  14
 );

 roadStatus(
  "県道252号等",
  "大熊町内の国道6号と避難指示解除区域側を接続",
  "軽車両・歩行者を除き通行証不要。"
 );

}


function road101(){

 map.setView(
  [37.465,141.000],
  13
 );

 roadStatus(
  "双葉町道101号・109号",
  "双葉町内の特別通過交通対象区間",
  "8:00～18:00。自動二輪・原付・軽車両・歩行者を除く。通行証不要。"
 );

}


function road67(){

 map.setView(
  [37.386,141.000],
  14
 );

 roadStatus(
  "大熊町道東67号",
  "避難指示解除区域境～国道6号",
  "時間・対象者の制限なし。通行証不要。"
 );

}


/* ================= CURRENT LIST ================= */

function trafficList(){

 setStatus(

 '<b>
