<script>

/* =====================================================

const municipalities={

/* =====================================================

/* =====================================================
   DEFINITELY DIFFICULT
===================================================== */

const definiteDifficult={

/* =====================================================
   MIXED / DIFFICULT AREAS
===================================================== */

const mixedDifficult={

 },

  ],

 },


 "07547":{

 },


 "07548":{

   "柏原"
  ],

  text:
  "帰還困難区域・解除済み区域等が混在します。"

/* =====================================================

const relaxedRules={

  ],

  text:

  ],

  text:
  "一部に立入規制緩和区域があります。"

 },


 "07547":{

  words:[
   "津島",
   "南津島"
  ],

  text:
  "一部に立入規制緩和区域があります。"

 },


 "07564":{

  words:[
   "長泥"
  ],

  text:
  "一部に立入規制緩和区域があります。"

 }

};


/* =====================================================
   TRAFFIC INFO
===================================================== */

const trafficInfo={

 "07212":
 "南相馬市周辺には帰還困難区域に関係する通行ルートがあります。実際の対象道路をMETI最新情報で確認してください。",

 "07545":
 "大熊町には特別通過交通が適用される道路があります。対象道路・車種・条件をMETI最新情報で確認してください。",


 "07546":
 "双葉町には特別通過交通が適用される道路があります。対象道路・時間・車種等をMETI最新情報で確認してください。",


 "07547":
 "浪江町周辺には特別通過交通に関係するルートがあります。実際に走行する道路をMETI最新情報で確認してください。",


 "07548":

 "07564":
 "飯舘村では道路ごとの通行規制を村・METIの最新情報で確認してください。"

};


/* =====================================================
   REVERSE GEOCODER
===================================================== */

async function reverseGeocode(lat,lng){

 try{

  const url=
   "https://mreversegeocoder.gsi.go.jp/reverse-geocoder/"+
   "LonLatToAddress?lat="+
   encodeURIComponent(lat)+
   "&lon="+
   encodeURIComponent(lng);


  const response=
   await fetch(url);


  if(!response.ok)
   throw new Error();


  const data=
   await response.json();


  if(!data.results)
   return null;


  return{

   code:
   String(
    data.results.muniCd || ""
   ),

   town:
   data.results.lv01Nm || ""

  };


 }catch(e){

  return null;

 }

}


/* =====================================================
   WORD MATCH
===================================================== */

function includesAny(town,words){

 if(!town || !words)
  return null;


 return(
  words.find(
   word=>
   town.indexOf(word)!==-1
  ) || null
 );

}


/* =====================================================
   EVACUATION RESULT
===================================================== */

function evacuationResult(code,town){

 const muni=
  municipalities[code];


 /* ---------- 7市町村外 ---------- */

 if(!muni){

  return{

   type:"released",

   icon:"🟢",

   title:
   "帰還困難区域対象7市町村の外",

   text:
   "現在帰還困難区域が残る7市町村には該当しません。"

  };

 }


 /* ---------- 全域解除 ---------- */

 const released=
  includesAny(
   town,
   definiteReleased[code]
  );


 if(released){

  return{

   type:"released",

   icon:"🟢",

   title:
   "避難指示解除を確認",

   text:
   "「"+released+
   "」は自治体公式資料で"+
   "大字全域の避難指示解除を確認できます。"

  };

 }


 /* ---------- 全域帰還困難 ---------- */

 const difficult=
  includesAny(
   town,
   definiteDifficult[code]
  );


 if(difficult){

  return{

   type:"difficult",

   icon:"🔴",

   title:
   "帰還困難区域を確認",

   text:
   "「"+difficult+
   "」は国の公示で大字全域が"+
   "帰還困難区域として扱われています。"

  };

 }


 /* ---------- 混在地区 ---------- */

 const rule=
  mixedDifficult[code];


 if(rule){

  const hit=
   includesAny(
    town,
    rule.words
   );


  if(hit){

   return{

    type:"mixed",

    icon:"🔴",

    title:
    "帰還困難区域を含む地区",

    text:
    "「"+hit+"」に一致。"+
    rule.text+
    " 選択地点そのものの法的区域は境界確認が必要です。"

   };

  }

 }


 /* ---------- 未確定 ---------- */

 return{

  type:"unknown",

  icon:"🟠",

  title:
  "区域境界の確認が必要",

  text:
  "この市町村には帰還困難区域が残っていますが、"+
  "取得できる住所情報だけではこの地点を確定できません。"

 };

}


/* =====================================================
   ENTRY RESULT
===================================================== */

function entryResult(code,town){

 if(!municipalities[code]){

  return{

   icon:"🟢",

   title:
   "帰還困難区域に伴う立入規制対象外",

   text:
   "対象7市町村外です。"

  };

 }


 const rule=
  relaxedRules[code];


 if(rule){

  const hit=
   includesAny(
    town,
    rule.words
   );


  if(hit){

   return{

    icon:"🟣",

    title:
    "立入規制緩和区域が存在する地区",

    text:
    "「"+hit+"」の"+
    rule.text+
    " 地区全体が緩和区域という意味ではなく、"+
    "避難指示解除とも異なります。"

   };

  }

 }


 return{

  icon:"🚧",

  title:
  "立入条件は公式情報で確認",

  text:
  "地名だけでは立入規制・緩和区域を確定できません。"

 };

}


/* =====================================================
   MARKER COLOR
===================================================== */

function markerColor(type){

 if(type==="released")
  return "#1b8f3a";


 if(type==="difficult")
  return "#d00020";


 if(type==="mixed")
  return "#d00020";


 return "#e28a00";

}


/* =====================================================
   STATE
===================================================== */

let gpsMarker=null;

let selectedMarker=null;

let accuracyCircle=null;

let tracking=false;

let watchId=null;

let currentCode="";


let currentOfficial=
 "https://www.pref.fukushima.lg.jp/sec/11050a/";


let currentEntry=
 "https://www.meti.go.jp/earthquake/nuclear/kinkyu.html";


const status=
 document.getElementById("status");


const trackButton=
 document.getElementById("track");


/* =====================================================
   EVALUATE
===================================================== */

async function evaluatePoint(
 lat,
 lng,
 source,
 accuracy=null
){

 status.innerHTML=
  "<b>住所と区域情報を確認しています…</b>";


 const ad=
  await reverseGeocode(lat,lng);


 if(!ad){

  status.innerHTML=
   "<b>住所情報を取得できませんでした。</b><br>"+
   "通信状態を確認して再度お試しください。";

  return null;

 }


 const code=
  ad.code;


 const town=
  ad.town;


 const muni=
  municipalities[code];


 currentCode=
  code;


 if(muni){

  currentOfficial=
   muni.official;

  currentEntry=
   muni.entry;

 }else{

  currentOfficial=
   "https://www.pref.fukushima.lg.jp/sec/11050a/";

  currentEntry=
   "https://www.meti.go.jp/earthquake/nuclear/kinkyu.html";

 }


 const ev=
  evacuationResult(
   code,
   town
  );


 const en=
  entryResult(
   code,
   town
  );


 let bg=
  "#fff7df";


 if(ev.type==="released")
  bg="#e9f6ec";


 if(ev.type==="difficult")
  bg="#ffe5e7";


 if(ev.type==="mixed")
  bg="#fff0f1";


 status.style.background=
  bg;


 const place=
  (muni ? muni.name : "対象7市町村外")+
  (town ? " "+town : "");


 const sourceLabel=
  source==="gps"
  ? "📍現在地"
  : "👆地図選択";


 const accuracyText=
  accuracy!==null
  ? "・GPS精度 約"+
    Math.round(accuracy)+
    "m"
  : "";


 status.innerHTML=

  '<div class="place">'+
   sourceLabel+
   "： "+
   place+
  '</div>'+


  '<div class="row">'+
   '<b>'+
    ev.icon+
    " 避難指示｜"+
    ev.title+
   '</b>'+
   '<span class="detail">'+
    ev.text+
   '</span>'+
  '</div>'+


  '<div class="row">'+
   '<b>'+
    en.icon+
    " 立入規制｜"+
    en.title+
   '</b>'+
   '<span class="detail">'+
    en.text+
   '</span>'+
  '</div>'+


  '<div class="coords">'+
   lat.toFixed(6)+
   ", "+
   lng.toFixed(6)+
   accuracyText+
  '</div>';


 return{

  ev:ev,

  en:en,

  town:town,

  place:place

 };

}


/* =====================================================
   GPS
===================================================== */

async function showGPS(pos,follow){

 const lat=
  pos.coords.latitude;


 const lng=
  pos.coords.longitude;


 const acc=
  pos.coords.accuracy;


 if(gpsMarker)
  map.removeLayer(gpsMarker);


 if(accuracyCircle)
  map.removeLayer(accuracyCircle);


 const result=
  await evaluatePoint(
   lat,
   lng,
   "gps",
   acc
  );


 if(!result)
  return;


 const color=
  markerColor(
   result.ev.type
  );


 gpsMarker=
  L.circleMarker(
   [lat,lng],
   {
    radius:10,
    color:"white",
    weight:3,
    fillColor:color,
    fillOpacity:1
   }
  )
  .addTo(map)
  .bindPopup(
   "<b>"+result.place+"</b><br>"+
   result.ev.icon+
   " "+
   result.ev.title
  );


 accuracyCircle=
  L.circle(
   [lat,lng],
   {
    radius:acc,
    color:color,
    weight:1,
    fillOpacity:.06
   }
  )
  .addTo(map);


 if(follow){

  map.setView(
   [lat,lng],
   16
  );

 }

}


/* =====================================================
   GPS BUTTON
===================================================== */

document
.getElementById("gps")
.onclick=()=>{

 status.innerHTML=
  "<b>現在地を取得しています…</b>";


 navigator.geolocation.getCurrentPosition(

  p=>showGPS(p,true),

  ()=>{

   status.innerHTML=
    "<b>現在地を取得できませんでした。</b>";

  },

  {
   enableHighAccuracy:true,
   timeout:15000,
   maximumAge:2000
  }

 );

};


/* =====================================================
   TRACKING
===================================================== */

trackButton.onclick=()=>{

 if(!tracking){

  tracking=true;


  trackButton.innerHTML=
   "■ 追跡停止";


  trackButton.style.background=
   "#a06400";


  watchId=
   navigator.geolocation.watchPosition(

    p=>showGPS(p,true),

    ()=>{},

    {
     enableHighAccuracy:true,
     maximumAge:3000,
     timeout:20000
    }

   );


 }else{

  tracking=false;


  if(watchId!==null){

   navigator.geolocation.clearWatch(
    watchId
   );

  }


  watchId=null;


  trackButton.innerHTML=
   "▶ 移動追跡";


  trackButton.style.background=
   "#08752e";

 }

};


/* =====================================================
   MAP TAP
===================================================== */

map.on(
 "click",
 async e=>{

  const lat=
   e.latlng.lat;


  const lng=
   e.latlng.lng;


  if(selectedMarker)
   map.removeLayer(selectedMarker);


  const result=
   await evaluatePoint(
    lat,
    lng,
    "tap"
   );


  if(!result)
   return;


  const color=
   markerColor(
    result.ev.type
   );


  selectedMarker=
   L.circleMarker(
    [lat,lng],
    {
     radius:9,
     color:"white",
     weight:3,
     fillColor:color,
     fillOpacity:1
    }
   )
   .addTo(map)
   .bindPopup(
    "<b>"+result.place+"</b><br>"+
    result.ev.icon+
    " "+
    result.ev.title
   )
   .openPopup();

 }
);
