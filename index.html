<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>福島・帰還困難区域マップ</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html,body,#map{
 height:100%;
 width:100%;
 margin:0;
 font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
}
#title{
 position:absolute;
 top:10px;
 left:50%;
 transform:translateX(-50%);
 z-index:1000;
 background:white;
 padding:8px 12px;
 border-radius:8px;
 box-shadow:0 1px 6px #888;
 font-size:14px;
 font-weight:bold;
}
#panel{
 position:absolute;
 left:12px;
 right:12px;
 bottom:20px;
 z-index:1000;
 background:rgba(255,255,255,.96);
 padding:10px;
 border-radius:10px;
 box-shadow:0 1px 6px #888;
}
button{
 padding:10px 13px;
 border:1px solid #ccc;
 border-radius:8px;
 background:white;
 font-weight:bold;
 font-size:14px;
}
#status{
 margin-top:7px;
 font-size:14px;
 line-height:1.45;
}
</style>
</head>

<body>

<div id="title">福島・帰還困難区域マップ</div>

<div id="panel">
<button id="locate">◎ 現在地を判定</button>
<div id="status">
赤色：帰還困難区域の参考境界
</div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map=L.map("map").setView([37.47,141.00],10);

L.tileLayer(
 "https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",
 {
  attribution:"地理院地図",
  maxZoom:18
 }
).addTo(map);


/*
まず表示確認用の参考ポリゴン。
外部APIを一切使わずHTML内に直接埋め込み。
*/

const zone = [
 [37.665,140.795],
 [37.690,140.845],
 [37.675,140.900],
 [37.640,140.935],
 [37.610,140.980],
 [37.585,141.010],
 [37.540,141.015],
 [37.505,141.020],
 [37.470,141.025],
 [37.430,141.020],
 [37.390,141.025],
 [37.345,141.035],
 [37.305,141.015],
 [37.295,140.970],
 [37.320,140.930],
 [37.355,140.895],
 [37.400,140.860],
 [37.445,140.825],
 [37.490,140.790],
 [37.535,140.760],
 [37.585,140.750],
 [37.625,140.765]
];

const zoneLayer = L.polygon(
 zone,
 {
  color:"#d00000",
  weight:3,
  fillColor:"#e00000",
  fillOpacity:0.28
 }
).addTo(map);

zoneLayer.bindPopup(
 "<b>帰還困難区域・参考境界</b><br>"+
 "表示確認用の暫定レイヤー"
);


/* 福島第一原発 */

L.circleMarker(
 [37.4211,141.0328],
 {
  radius:6,
  color:"#000",
  fillColor:"#fff",
  fillOpacity:1
 }
)
.addTo(map)
.bindPopup("福島第一原子力発電所");


function pointInPolygon(lat,lng,poly){

 let inside=false;

 for(
  let i=0,j=poly.length-1;
  i<poly.length;
  j=i++
 ){

  const yi=poly[i][0];
  const xi=poly[i][1];

  const yj=poly[j][0];
  const xj=poly[j][1];

  const intersect=
   ((yi>lat)!=(yj>lat)) &&
   (lng<
    (xj-xi)*(lat-yi)/(yj-yi)+xi
   );

  if(intersect){
   inside=!inside;
  }

 }

 return inside;
}


let currentMarker=null;

document.getElementById("locate").onclick=function(){

 const status=document.getElementById("status");

 status.innerHTML="現在地を取得中…";

 navigator.geolocation.getCurrentPosition(

  function(pos){

   const lat=pos.coords.latitude;
   const lng=pos.coords.longitude;

   if(currentMarker){
    map.removeLayer(currentMarker);
   }

   currentMarker=L.circleMarker(
    [lat,lng],
    {
     radius:9,
     color:"white",
     weight:3,
     fillColor:"#007aff",
     fillOpacity:1
    }
   )
   .addTo(map);

   map.setView([lat,lng],15);

   const inside=
    pointInPolygon(lat,lng,zone);

   if(inside){

    status.innerHTML=
     "<b style='color:#c00000;font-size:17px'>"+
     "帰還困難区域内です"+
     "</b>";

   }else{

    status.innerHTML=
     "<b style='color:#087830;font-size:17px'>"+
     "帰還困難区域の外です"+
     "</b>";

   }

  },

  function(){

   status.innerHTML=
    "現在地を取得できません";

  },

  {
   enableHighAccuracy:true,
   timeout:15000
  }

 );

};

</script>

</body>
</html>
