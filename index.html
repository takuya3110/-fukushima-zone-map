<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>福島・規制区域マップ</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html,body{
 margin:0;height:100%;
 font-family:-apple-system,BlinkMacSystemFont,
 "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
#app{height:100%;display:flex;flex-direction:column}

header{
 padding:8px 10px;background:#fff;
 border-bottom:1px solid #ddd;
}
h1{margin:0;font-size:19px}
.sub{font-size:10px;color:#666}

#status{
 margin-top:6px;padding:7px;
 background:#eef3f8;border-radius:9px;
 font-size:10px;line-height:1.45;
}

.row{
 margin-top:4px;padding:5px 7px;
 background:white;border-radius:6px;
}
.blue{border-left:5px solid #1677ff}
.red{border-left:5px solid #d92323}
.purple{border-left:5px solid #9d28c2}
.green{border-left:5px solid #18a83c}
.grey{border-left:5px solid #777}

#mapWrap{position:relative;flex:1;min-height:300px}
#map{width:100%;height:100%}

#panel{
 position:absolute;
 left:6px;right:6px;bottom:7px;
 z-index:1000;
 background:rgba(255,255,255,.96);
 padding:7px;border-radius:10px;
 box-shadow:0 2px 10px rgba(0,0,0,.3);
}

.title{font-size:9px;font-weight:bold;margin-bottom:4px}

.grid3{
 display:grid;
 grid-template-columns:1fr 1fr 1fr;
 gap:4px;
}

.grid2{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:4px;margin-top:4px;
}

button{
 border:0;border-radius:7px;
 padding:8px 2px;color:#fff;
 font-size:9px;font-weight:bold;
}

#town{background:#1769e0}
#aza{background:#19758c}
#official{background:#8526a7}
.greenBtn{background:#148d35}
.tool{background:#596a74}

.bottom{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:5px;padding:6px;
 background:#fff;border-top:1px solid #ddd;
}

#gps{background:#1769e0}
#track{background:#08752e}
#source{background:#705500}
#reset{background:#555}

.note{
 grid-column:1/3;
 font-size:8px;color:#666;line-height:1.4;
}

.azalabel{
 background:rgba(255,255,255,.85);
 border:0;
 box-shadow:none;
 font-size:8px;
 padding:1px 3px;
}

.legend{
 background:rgba(255,255,255,.95);
 padding:6px;border-radius:7px;
 font-size:9px;line-height:1.5;
}
</style>
</head>

<body>

<div id="app">

<header>

<h1>福島・規制区域マップ</h1>

<div class="sub">
v34｜町字・実座標検証版
</div>

<div id="status">
<b>📍 大熊町</b>
<div class="row blue">
町字代表点と公式区域図を比較できます。
</div>
</div>

</header>


<div id="mapWrap">

<div id="map"></div>

<div id="panel">

<div class="title">基礎データ</div>

<div class="grid3">

<button id="town"
onclick="toggleTown()">
🔵 町境界
</button>

<button id="aza"
onclick="toggleAza()">
🏠 町字点
</button>

<button id="official"
onclick="showOfficial()">
🟣 公式図
</button>

</div>

<div class="title" style="margin-top:6px">
立入規制緩和図
</div>

<div class="grid3">

<button class="greenBtn"
onclick="showGreen(1)">
① 野上
</button>

<button class="greenBtn"
onclick="showGreen(2)">
② 熊2・3
</button>

<button class="greenBtn"
onclick="showGreen(3)">
③ 町区
</button>

</div>

<div class="grid2">

<button class="tool"
onclick="changeOpacity()">
👁 透明度
</button>

<button class="tool"
onclick="hideOverlay()">
画像OFF
</button>

</div>

</div>

</div>


<div class="bottom">

<button id="gps">📍 現在地</button>
<button id="track">▶ 移動追跡</button>

<button id="source">🏛 データ出典</button>
<button id="reset">🗾 大熊町全体</button>

<div class="note">
🏠は町字の代表点です。規制区域の中心点ではありません。
統計町字境界と避難指示区域は別データです。
</div>

</div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* MAP */

const map=L.map("map").setView(
 [37.400,140.985],13
);

L.tileLayer(
 "https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",
 {
  attribution:"地理院タイル",
  maxZoom:18
 }
).addTo(map);


/* Daiichi */

L.circleMarker(
 [37.4211,141.0328],
 {
  radius:5,
  color:"#fff",
  weight:2,
  fillColor:"#111",
  fillOpacity:1
 }
)
.addTo(map)
.bindPopup("福島第一原子力発電所");


/* OKUMA */

const okuma=[
[37.433334,140.894699],
[37.426800,140.898499],
[37.424068,140.907196],
[37.424400,140.915100],
[37.424068,140.923096],
[37.422134,140.938095],
[37.419132,140.947495],
[37.416664,140.959000],
[37.419399,140.981995],
[37.418266,140.988602],
[37.422798,140.993607],
[37.433601,141.004593],
[37.427067,141.018707],
[37.427067,141.034897],
[37.419998,141.036804],
[37.421799,141.040405],
[37.419399,141.035095],
[37.385799,141.034607],
[37.382267,141.037292],
[37.373199,141.035599],
[37.375935,141.024002],
[37.376534,141.017899],
[37.373669,141.015701],
[37.375534,141.007996],
[37.374466,141.003296],
[37.375267,140.997894],
[37.374535,140.991608],
[37.379002,140.986206],
[37.380600,140.975708],
[37.380333,140.958206],
[37.383732,140.948792],
[37.378532,140.933197],
[37.379333,140.927597],
[37.373798,140.922394],
[37.374802,140.914505],
[37.373734,140.910095],
[37.375999,140.904694],
[37.377666,140.888000],
[37.383934,140.877396],
[37.381466,140.871994],
[37.384602,140.864105],
[37.387333,140.859894],
[37.396667,140.858795],
[37.404865,140.859894],
[37.411533,140.862106],
[37.414932,140.858002],
[37.421600,140.853806],
[37.421001,140.856995],
[37.422066,140.860107],
[37.419868,140.868500],
[37.426933,140.876999],
[37.430065,140.880493],
[37.433334,140.894699]
];


const townPolygon=L.polygon(
 okuma,
 {
  color:"#1769e0",
  weight:3,
  dashArray:"8,5",
  fillOpacity:.02
 }
).addTo(map);

let townVisible=true;


/* ==================================
 REPRESENTATIVE POINTS

 Verified / known reference points.
 These are NOT polygon boundaries.
================================== */

const azaPoints=[

{
 id:"07545001001",
 name:"野上・旭ケ丘",
 lat:37.400772,
 lng:140.901625
},

{
 id:"07545001005",
 name:"野上・秋葉台",
 lat:37.410542,
 lng:140.957923
},

{
 id:"07545002003",
 name:"下野上・清水",
 lat:37.405048,
 lng:140.973578
},

{
 id:"07545003001",
 name:"大川原・南平",
 lat:37.383730,
 lng:140.959200
},

{
 id:"07545004004",
 name:"熊・熊町",
 lat:37.381742,
 lng:141.007522
},

{
 id:"07545006003",
 name:"小入野・西大和久",
 lat:37.405127,
 lng:141.000187
}

];


const azaLayer=L.layerGroup();

azaPoints.forEach(a=>{

 const m=L.circleMarker(
  [a.lat,a.lng],
  {
   radius:6,
   color:"#fff",
   weight:2,
   fillColor:"#008ba3",
   fillOpacity:1
  }
 );

 m.bindPopup(
  "<b>"+a.name+"</b><br>"+
  "町字ID："+a.id+
  "<br><small>町字位置確認用</small>"
 );

 m.bindTooltip(
  a.name,
  {
   permanent:true,
   direction:"top",
   className:"azalabel"
  }
 );

 m.addTo(azaLayer);

});

azaLayer.addTo(map);

let azaVisible=true;


/* OFFICIAL IMAGES */

const wholeOfficial=
"https://www.town.okuma.fukushima.jp/uploaded/image/18390.jpg";

const wholeBounds=[
 [37.3600,140.8300],
 [37.4470,141.0600]
];


const greenMaps={

1:{
 name:"野上2区・下野上1区",
 image:
 "https://www.town.okuma.fukushima.jp/uploaded/image/18395.jpg",
 bounds:[
  [37.3990,140.9400],
  [37.4235,140.9850]
 ],
 view:[37.4115,140.9635],
 zoom:15
},

2:{
 name:"熊2区・熊3区の一部",
 image:
 "https://www.town.okuma.fukushima.jp/uploaded/image/18400.jpg",
 bounds:[
  [37.3690,140.9850],
  [37.4000,141.0250]
 ],
 view:[37.3845,141.0060],
 zoom:15
},

3:{
 name:"熊2区・町区の一部",
 image:
 "https://www.town.okuma.fukushima.jp/uploaded/image/18397.jpg",
 bounds:[
  [37.3680,140.9950],
  [37.3980,141.0320]
 ],
 view:[37.3830,141.0130],
 zoom:15
}

};


let overlay=null;

const opacities=[.25,.45,.65,.80];
let opacityIndex=1;


/* STATUS */

function status(t){

 document.getElementById("status")
 .innerHTML=t;

}


/* TOGGLES */

function toggleTown(){

 if(townVisible){

  map.removeLayer(townPolygon);
  townVisible=false;

 }else{

  townPolygon.addTo(map);
  townVisible=true;

 }

}


function toggleAza(){

 if(azaVisible){

  map.removeLayer(azaLayer);
  azaVisible=false;

 }else{

  azaLayer.addTo(map);
  azaVisible=true;

 }

}


/* OFFICIAL */

function hideOverlay(){

 if(overlay){

  map.removeLayer(overlay);
  overlay=null;

 }

}


function showOfficial(){

 hideOverlay();

 overlay=L.imageOverlay(
  wholeOfficial,
  wholeBounds,
  {
   opacity:opacities[opacityIndex],
   zIndex:400
  }
 ).addTo(map);

 map.setView(
  [37.400,140.985],13
 );

 status(
  "<b>🟣 大熊町公式区域図</b><br>"+
  "町字代表点と公式区域図を比較できます。"+
  "<br>画像位置は参考表示です。"
 );

}


function showGreen(n){

 hideOverlay();

 const z=greenMaps[n];

 overlay=L.imageOverlay(
  z.image,
  z.bounds,
  {
   opacity:opacities[opacityIndex],
   zIndex:450
  }
 ).addTo(map);

 map.setView(
  z.view,z.zoom,
  {animate:false}
 );

 status(
  "<b>🟩 立入規制緩和区域</b><br>"+
  z.name+
  "<br>公式詳細図との位置比較モード"
 );

}


function changeOpacity(){

 opacityIndex=
 (opacityIndex+1)%opacities.length;

 if(overlay)
  overlay.setOpacity(
   opacities[opacityIndex]
  );

 status(
  "<b>👁 透明度 "+
  Math.round(
   opacities[opacityIndex]*100
  )+
  "%</b>"
 );

}


/* REVERSE GEOCODER */

async function reverseAddress(lat,lng){

 try{

  const r=await fetch(
   "https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress"+
   "?lat="+lat+
   "&lon="+lng
  );

  const j=await r.json();

  if(!j.results)return null;

  return{
   muni:String(j.results.muniCd||""),
   town:j.results.lv01Nm||""
  };

 }catch(e){

  return null;

 }

}


/* EVALUATE */

async function evaluate(lat,lng,accuracy){

 status(
  "<b>📍 地点を照合しています…</b>"
 );

 const ad=await reverseAddress(lat,lng);

 let html=
 "<b>📍 "+
 lat.toFixed(6)+
 ", "+
 lng.toFixed(6)+
 "</b>";


 if(ad){

  html+=
  '<div class="row blue">'+
  '<b>地理院住所</b><br>'+
  (ad.town||"町字名なし")+
  '</div>';

 }


 if(ad && ad.muni==="07545"){

  html+=
  '<div class="row blue">'+
  '<b>市町村</b><br>'+
  '🔵 大熊町'+
  '</div>';


  const n=ad.town||"";


  if(n.includes("大川原")){

   html+=
   '<div class="row green">'+
   '<b>避難指示</b><br>'+
   '🟢 解除側として判定'+
   '</div>';

  }else{

   html+=
   '<div class="row grey">'+
   '<b>避難指示</b><br>'+
   '⚠️ 規制区域ベクトル未確定'+
   '</div>';

  }


  html+=
  '<div class="row grey">'+
  '<b>特定帰還居住区域</b><br>'+
  '⚠️ 公式図で確認'+
  '</div>'+

  '<div class="row grey">'+
  '<b>立入規制</b><br>'+
  '⚠️ 公式詳細図で確認'+
  '</div>';


 }else{

  html+=
  '<div class="row grey">'+
  '大熊町外／v34詳細判定対象外'+
  '</div>';

 }


 if(accuracy>0){

  html+=
  '<div style="font-size:8px;color:#666">'+
  'GPS精度 約±'+
  Math.round(accuracy)+
  'm</div>';

 }


 status(html);

}


/* GPS */

let gpsMarker=null;
let accCircle=null;


function drawGPS(pos,follow){

 const lat=pos.coords.latitude;
 const lng=pos.coords.longitude;
 const acc=pos.coords.accuracy;


 if(gpsMarker)
  map.removeLayer(gpsMarker);

 if(accCircle)
  map.removeLayer(accCircle);


 gpsMarker=L.circleMarker(
  [lat,lng],
  {
   radius:9,
   color:"#fff",
   weight:3,
   fillColor:"#1677ff",
   fillOpacity:1
  }
 ).addTo(map);


 accCircle=L.circle(
  [lat,lng],
  {
   radius:acc,
   color:"#1677ff",
   weight:1,
   fillOpacity:.08
  }
 ).addTo(map);


 if(follow)
  map.setView([lat,lng],16);


 evaluate(lat,lng,acc);

}


document.getElementById("gps").onclick=()=>{

 navigator.geolocation.getCurrentPosition(

  p=>drawGPS(p,true),

  ()=>status(
   "<b>現在地を取得できませんでした。</b>"
  ),

  {
   enableHighAccuracy:true,
   timeout:15000,
   maximumAge:1000
  }

 );

};


/* TRACK */

let tracking=false;
let watchId=null;


document.getElementById("track").onclick=()=>{

 const b=document.getElementById("track");

 if(!tracking){

  tracking=true;
  b.innerHTML="■ 追跡停止";
  b.style.background="#a26b00";

  watchId=
  navigator.geolocation.watchPosition(
   p=>drawGPS(p,true),
   ()=>{},
   {
    enableHighAccuracy:true,
    maximumAge:2000
   }
  );

 }else{

  tracking=false;

  if(watchId!==null)
   navigator.geolocation.clearWatch(watchId);

  watchId=null;

  b.innerHTML="▶ 移動追跡";
  b.style.background="#08752e";

 }

};


/* MAP TAP */

let tapMarker=null;

map.on("click",e=>{

 if(tapMarker)
  map.removeLayer(tapMarker);

 tapMarker=L.circleMarker(
  e.latlng,
  {
   radius:7,
   color:"#fff",
   weight:2,
   fillColor:"#e58a00",
   fillOpacity:1
  }
 ).addTo(map);

 evaluate(
  e.latlng.lat,
  e.latlng.lng,
  0
 );

});


/* BUTTONS */

document.getElementById("source").onclick=()=>{

 window.open(
  "https://geoshape.ex.nii.ac.jp/ka/resource/07545.html",
  "_blank"
 );

};


document.getElementById("reset").onclick=()=>{

 map.fitBounds(
  townPolygon.getBounds(),
  {padding:[15,15]}
 );

};


/* LEGEND */

const legend=L.control({
 position:"topright"
});

legend.onAdd=function(){

 const d=L.DomUtil.create(
  "div","legend"
 );

 d.innerHTML=
 "<b>v34</b><br>"+
 "🔵 大熊町境界<br>"+
 "🏠 町字代表点<br>"+
 "🔴 帰還困難<br>"+
 "🟣 特定帰還居住<br>"+
 "🟩 立入規制緩和<br>"+
 "🔵 GPS";

 return d;

};

legend.addTo(map);


/* START */

setTimeout(()=>{

 map.fitBounds(
  townPolygon.getBounds(),
  {padding:[12,12]}
 );

},350);

</script>

</body>
</html>
