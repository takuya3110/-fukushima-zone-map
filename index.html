<!DOCTYPE html>
<html lang="ja">
<head>

<title>福島・帰還困難区域チェッカー</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html,body{
 margin:0;height:100%;
 font-family:-apple-system,BlinkMacSystemFont,
 "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
#app{height:100%;display:flex;flex-direction:column}

header{
 background:#fff;padding:7px 9px;
 border-bottom:1px solid #ddd;z-index:1000
}
h1{margin:0;font-size:18px}
.sub{font-size:10px;color:#666;margin-top:2px}

#status{
 margin-top:6px;padding:7px;border-radius:9px;
 background:#eef3f8;font-size:11px;line-height:1.35
}
.place{font-weight:700;font-size:13px;margin-bottom:4px}

.row{
 background:#fff;border-radius:7px;
 padding:5px 7px;margin-top:4px

.row b{font-size:12px}

.detail{
 display:block;color:#555;

}

.badge{

 font-weight:700

.green{background:#def3e3;color:#176b2d}
.red{background:#ffe0e4;color:#a00018}
.orange{background:#fff0c7;color:#795000}

.coords{
 font-size:9px;color:#777;margin-top:5px
}

#map{
 flex:1;
 min-height:250px
}

.controls{

 gap:5px;

}

button{

 padding:9px 3px;

#purpleTest{background:#8435a8}

#entry{background:#b24600}

#official{background:#444}
#meti{background:#62509b}

.note{
 grid-column:1/3;
 font-size:8px;color:#666;

}

.legend{

 line-height:1.5;

}

#trafficBox{
 display:none;
 position:absolute;
 left:10px;right:10px;

 background:#fff;
 padding:12px;
 border-radius:10px;
 box-shadow:0 3px 14px rgba(0,0,0,.35);
 max-height:45%;
 overflow:auto;
 font-size:12px;
 line-height:1.5
}

#trafficClose{
 width:100%;
 margin-top:8px;
 background:#555
}

</head>

<body>

<div id="app">

<header>

<h1>福島・帰還困難区域チェッカー</h1>

<div class="sub">
v22｜紫表示確認機能＋公式区域図
</div>

<div id="status">
<b>📍現在地を押すか、地図上をタップしてください。</b>
</div>

</header>

<div id="map"></div>

<div id="trafficBox">
<div id="trafficText"></div>
<button id="trafficClose">閉じる</button>
</div>

<div class="controls">

<button id="gps">📍 現在地</button>
<button id="track">▶ 移動追跡</button>

<button id="purpleTest">🟣 紫確認</button>
<button id="okumaMap">🗺 大熊公式区域図</button>

<button id="municipal">🏛 自治体公式</button>
<button id="entry">🚧 立入規制</button>

<button id="traffic">🚗 通過交通</button>
<button id="official">🗾 福島県公式</button>

<button id="meti">📋 METI最新</button>
<button id="returnArea">🟣 帰還居住区域</button>

<div class="note">
🟢＝解除確認　
🔴＝帰還困難区域または混在地区　
🟠＝地点を確定できない　
🟣＝その地区の一部に特定帰還居住区域等が存在。<br>
<strong>紫は「選択地点そのものが区域内」という意味ではありません。</strong>
</div>

</div>
</div>

<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script>

/* ===================== MAP ===================== */

const map=
L.map("map").setView([37.47,140.93],10);

L.tileLayer(
"https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",
{
 attribution:"地理院タイル",
 maxZoom:18
}
).addTo(map);

L.circleMarker(
[37.4211,141.0328],
{
 radius:7,
 color:"white",
 weight:2,
 fillColor:"#111",
 fillOpacity:1
}
)
.addTo(map)
.bindPopup("<b>福島第一原子力発電所</b>");


/* ================= MUNICIPALITIES ================= */

const municipalities={

"07212":{
 name:"南相馬市",
 official:
 "https://www.city.minamisoma.lg.jp/portal/sections/12/1240/12401/genshiryokusaigaikuiki/1424.html",
 entry:
 "https://www.meti.go.jp/earthquake/nuclear/kinkyu.html"
},

"07543":{
 name:"富岡町",
 official:
 "https://www.tomioka-town.jp/",
 entry:
 "https://www.tomioka-town.jp/"
},

"07545":{
 name:"大熊町",
 official:
 "https://www.town.okuma.fukushima.jp/soshiki/somu/1534.html",
 entry:
 "https://www.town.okuma.fukushima.jp/soshiki/kankyoutaisaku/34555.html"
},

"07546":{
 name:"双葉町",
 official:
 "https://www.town.fukushima-futaba.lg.jp/",
 entry:
 "https://www.meti.go.jp/earthquake/nuclear/kinkyu.html"
},

"07547":{
 name:"浪江町",
 official:
 "https://www.town.namie.fukushima.jp/soshiki/2/34026.html",
 entry:
 "https://www.town.namie.fukushima.jp/soshiki/1/19635.html"
},

"07548":{
 name:"葛尾村",
 official:
 "https://www.katsurao.org/",
 entry:
 "https://www.katsurao.org/"
},

"07564":{
 name:"飯舘村",
 official:
 "https://www.vill.iitate.fukushima.jp/",
 entry:
 "https://www.meti.go.jp/earthquake/nuclear/kinkyu.html"
}

};


/* ===================== RELEASE ===================== */

const releasedWords={

"07545":[
 "中屋敷",
 "大川原"
],

"07546":[
 "両竹",
 "中野",
 "中浜"
],

"07547":[
 "立野","藤橋","西台","酒田","苅宿",
 "棚塩","北幾世橋","幾世橋","権現堂","請戸",
 "中浜","両竹","高瀬","牛渡","川添",
 "樋渡","谷津田","加倉","田尻","小野田"
],

"07548":[
 "大字落合"
]

};


/* ================= DEFINITE DIFFICULT ================= */

const definiteDifficult={
 "07547":["酒井"]
};


/* ================= MIXED ================= */

const difficultRules={

"07212":{
 words:["小高区金谷"],
 text:
 "小高区金谷の一部に現在も帰還困難区域があります。"
},

"07543":{
 words:["小良ヶ浜","深谷"],
 text:
 "小良ヶ浜・深谷地区に現在も帰還困難区域があります。"
},

"07545":{
 words:[
  "野上",
  "下野上",
  "熊",
  "熊川",
  "夫沢",
  "小入野"
 ],
 text:
 "帰還困難区域、解除済み区域、特定帰還居住区域等が混在します。"
},

"07546":{
 words:[
  "下長塚","三字","羽鳥","石熊",
  "山田","細谷","寺松","渋川","鴻草"
 ],
 text:
 "帰還困難区域と解除済み区域等が混在します。"
},

"07547":{
 words:[
  "井手","小丸","大堀","室原","末森",
  "津島","南津島","下津島","赤宇木",
  "川房","昼曽根","羽附"
 ],
 text:
 "帰還困難区域と解除済み区域等が混在します。"
},

"07548":{
 words:["野行","柏原","大字葛尾"],
 text:
 "帰還困難区域と解除済み区域等が混在します。"
},

"07564":{
 words:["長泥"],
 text:
 "長泥地区には帰還困難区域と解除済み区域が混在します。"
}

};


/* ================= RESIDENCE AREA ================= */

const residenceRules={

"07545":{
 words:[
  "下野上",
  "野上",
  "大字熊",
  "熊川",
  "夫沢"
 ],
 text:
 "大熊町では、この地区の一部に特定帰還居住区域があります。"
},

"07546":{
 words:[
  "下長塚",
  "羽鳥",
  "三字",
  "石熊",
  "山田"
 ],
 text:
 "双葉町では、この地区の一部に特定帰還居住区域があります。"
},

"07547":{
 words:[
  "井手",
  "小丸",
  "大堀",
  "酒井",
  "室原",
  "羽附",
  "津島",
  "下津島",
  "南津島",
  "赤宇木",
  "川房",
  "昼曽根"
 ],
 text:
 "浪江町では、この地区の一部に特定帰還居住区域があります。"
},

"07543":{
 words:[
  "小良ヶ浜",
  "深谷"
 ],
 text:
 "富岡町では、この地区の一部に特定帰還居住区域があります。"
},

"07548":{
 words:[
  "野行",
  "柏原",
  "小出谷"
 ],
 text:
 "葛尾村では、この地区の一部に特定帰還居住区域があります。"
}

};


/* ================= ENTRY RELAXATION ================= */

const relaxedRules={

"07545":{
 words:[
  "下野上",
  "野上",
  "大字熊"
 ],
 text:
 "下野上1区、野上2区、熊2・3区、町区の各一部で立入規制緩和区域があります。"
},

"07546":{
 words:[
  "下長塚",
  "羽鳥",
  "三字"
 ],
 text:
 "この地区の一部に立入規制緩和区域があります。"
},

"07547":{
 words:[
  "津島",
  "南津島"
 ],
 text:
 "この地区の一部に立入規制緩和区域があります。"
},

"07564":{
 words:[
  "長泥"
 ],
 text:
 "長泥地区の一部に立入規制緩和区域があります。"
}

};


/* ===================== GEOCODER ===================== */

async function reverseGeocode(lat,lng){

try{

 const url=
 "https://mreversegeocoder.gsi.go.jp/reverse-geocoder/"+
 "LonLatToAddress?lat="+encodeURIComponent(lat)+
 "&lon="+encodeURIComponent(lng);

 const r=await fetch(url);

 if(!r.ok)
  throw new Error();

 const j=await r.json();

 if(!j.results)
  return null;

 return{
  code:String(j.results.muniCd||""),
  town:j.results.lv01Nm||""
 };

}catch(e){

 return null;

}

}


function match(town,words){

if(!town || !words)
 return null;

return(
 words.find(
  w=>town.indexOf(w)!==-1
 ) || null
);

}


/* ================= EVACUATION ================= */

function evacuationResult(code,town){

if(!municipalities[code]){

 return{
  type:"released",
  icon:"🟢",
  title:"帰還困難区域が残る7市町村の外",
  text:"市町村レベルでは対象外です。"
 };

}


/* 南相馬 */

if(
 code==="07212" &&
 town &&
 town.indexOf("小高区金谷")===-1
){

 return{
  type:"released",
  icon:"🟢",
  title:"公表されている残存地区外",
  text:
  "小高区金谷の公表された帰還困難区域住所には一致しません。"
 };

}


/* 飯舘 */

if(
 code==="07564" &&
 town &&
 town.indexOf("長泥")===-1
){

 return{
  type:"released",
  icon:"🟢",
  title:"避難指示解除側",
  text:
  "現在帰還困難区域が残る長泥地区には一致しません。"
 };

}


const release=
match(town,releasedWords[code]);

if(release){

 return{
  type:"released",
  icon:"🟢",
  title:"避難指示解除を確認",
  text:
  "「"+release+
  "」は公式情報から解除側であることを確認できます。"
 };

}


const definite=
match(town,definiteDifficult[code]);

if(definite){

 return{
  type:"difficult",
  icon:"🔴",
  title:"帰還困難区域を確認",
  text:
  "「"+definite+
  "」は大字全域が帰還困難区域として扱われます。"
 };

}


const rule=
difficultRules[code];

if(rule){

 const hit=
 match(town,rule.words);

 if(hit){

  return{
   type:"mixed",
   icon:"🔴",
   title:"帰還困難区域を含む地区",
   text:
   "「"+hit+"」に一致。"+
   rule.text+
   " 選択地点そのものは境界確認が必要です。"
  };

 }

}


return{
 type:"unknown",
 icon:"🟠",
 title:"区域境界の確認が必要",
 text:
 "住所情報だけでは、この地点が帰還困難区域か確定できません。"
};

}


/* ================= RESIDENCE ================= */

function residenceResult(code,town){

const rule=
residenceRules[code];

if(!rule){

 return{
  active:false,
  text:""
 };

}


const hit=
match(town,rule.words);

if(hit){

 return{
  active:true,
  hit:hit,
  text:
  rule.text+
  " この表示は地区レベルであり、選択地点そのものが"+
  "特定帰還居住区域内であることを意味しません。"
 };

}


return{
 active:false,
 text:""
};

}


/* ================= ENTRY ================= */

function entryResult(code,town){

const rule=
relaxedRules[code];

if(rule){

 const hit=
 match(town,rule.words);

 if(hit){

  return{
   active:true,
   text:
   rule.text+
   " 地区全体が緩和されたという意味ではありません。"
  };

 }

}


return{
 active:false,
 text:
 "住所情報だけでは、この地点の立入条件を確定できません。"
};

}


/* ================= COLOR ================= */

function markerColor(type){

if(type==="released")
 return "#1b8f3a";

if(
 type==="difficult" ||
 type==="mixed"
)
 return "#d00020";

return "#e28a00";

}


/* ================= STATE ================= */

let gpsMarker=null;
let selectedMarker=null;
let accuracyCircle=null;

let tracking=false;
let watchId=null;

let currentCode="";

let currentOfficial=
"https://www.pref.fukushima.lg.jp/sec/11050a/";

let currentEntry=
"https://www.meti.go.jp/earthquake/nuclear/kinkyu.html";

const status=
document.getElementById("status");

const trackButton=
document.getElementById("track");


/* ================= EVALUATE ================= */

async function evaluatePoint(
lat,
lng,
source,
accuracy=null
){

status.innerHTML=
"<b>住所と区域情報を確認しています…</b>";

const ad=
await reverseGeocode(lat,lng);

if(!ad){

 status.innerHTML=
 "<b>住所情報を取得できませんでした。</b>";

 return null;

}


const code=ad.code;
const town=ad.town;
const muni=municipalities[code];

currentCode=code;

if(muni){

 currentOfficial=muni.official;
 currentEntry=muni.entry;

}else{

 currentOfficial=
 "https://www.pref.fukushima.lg.jp/sec/11050a/";

 currentEntry=
 "https://www.meti.go.jp/earthquake/nuclear/kinkyu.html";

}


const ev=
evacuationResult(code,town);

const residence=
residenceResult(code,town);

const entry=
entryResult(code,town);


let bg="#fff7df";

if(ev.type==="released")
 bg="#e9f6ec";

if(
 ev.type==="difficult" ||
 ev.type==="mixed"
)
 bg="#fff0f1";

status.style.background=bg;


const place=
(muni ? muni.name : "対象7市町村外")+
(town ? " "+town : "");


const sourceLabel=
source==="gps"
?"📍現在地"
:source==="test"
?"🟣紫確認"
:"👆地図選択";


const accuracyText=
accuracy!==null
?"・GPS精度 約"+
 Math.round(accuracy)+"m"
:"";


let badgeClass="orange";

if(ev.type==="released")
 badgeClass="green";

if(
 ev.type==="difficult" ||
 ev.type==="mixed"
)
 badgeClass="red";


let residenceHTML="";

if(residence.active){

 residenceHTML=

 '<div class="row">'+

 '<b>🟣 特定帰還居住区域｜この地区の一部に設定</b>'+

 '<br>'+

 '<span class="badge purple">'+
 '地区レベル表示'+
 '</span>'+

 '<span class="detail">'+
 residence.text+
 '</span>'+

 '</div>';

}


let entryHTML=

'<div class="row">'+

'<b>'+
(entry.active?"🟣":"🚧")+
' 立入規制｜'+
(entry.active
 ?"緩和区域が存在する地区"
 :"公式情報で確認")+
'</b>';

if(entry.active){

 entryHTML+=
 '<br>'+
 '<span class="badge purple">'+
 '一部で規制緩和'+
 '</span>';

}

entryHTML+=
'<span class="detail">'+
entry.text+
'</span>'+
'</div>';


status.innerHTML=

'<div class="place">'+
sourceLabel+
"： "+
place+
'</div>'+

'<div class="row">'+

'<b>'+
ev.icon+
" 避難指示｜"+
ev.title+
'</b>'+

'<br>'+

'<span class="badge '+
badgeClass+
'">'+
(
 ev.type==="released"
 ?"解除側"
 :ev.type==="unknown"
 ?"未確定"
 :"帰還困難区域関係"
)+
'</span>'+

'<span class="detail">'+
ev.text+
'</span>'+

'</div>'+

residenceHTML+

entryHTML+

'<div class="coords">'+
lat.toFixed(6)+
", "+
lng.toFixed(6)+
accuracyText+
'</div>';


return{
 ev:ev,
 place:place
};

}


/* ================= GPS ================= */

async function showGPS(pos,follow){

const lat=
pos.coords.latitude;

const lng=
pos.coords.longitude;

const acc=
pos.coords.accuracy;


if(gpsMarker)
 map.removeLayer(gpsMarker);

if(accuracyCircle)
 map.removeLayer(accuracyCircle);


const result=
await evaluatePoint(
 lat,lng,"gps",acc
);

if(!result)
 return;


const color=
markerColor(result.ev.type);


gpsMarker=
L.circleMarker(
 [lat,lng],
 {
  radius:10,
  color:"white",
  weight:3,
  fillColor:color,
  fillOpacity:1
 }
)
.addTo(map)
.bindPopup(
 "<b>"+result.place+"</b><br>"+
 result.ev.icon+" "+
 result.ev.title
);


accuracyCircle=
L.circle(
 [lat,lng],
 {
  radius:acc,
  color:color,
  weight:1,
  fillOpacity:.06
 }
)
.addTo(map);


if(follow)
 map.setView([lat,lng],16);

}


/* ================= GPS BUTTON ================= */

document
.getElementById("gps")
.onclick=()=>{

status.innerHTML=
"<b>現在地を取得しています…</b>";

navigator.geolocation.getCurrentPosition(

 p=>showGPS(p,true),

 ()=>{
  status.innerHTML=
  "<b>現在地を取得できませんでした。</b>";
 },

 {
  enableHighAccuracy:true,
  timeout:15000,
  maximumAge:2000
 }

);

};


/* ================= TRACK ================= */

trackButton.onclick=()=>{

if(!tracking){

 tracking=true;

 trackButton.innerHTML=
 "■ 追跡停止";

 trackButton.style.background=
 "#a06400";


 watchId=
 navigator.geolocation.watchPosition(

  p=>showGPS(p,true),

  ()=>{},

  {
   enableHighAccuracy:true,
   maximumAge:3000,
   timeout:20000
  }

 );

}else{

 tracking=false;

 if(watchId!==null)
  navigator.geolocation.clearWatch(watchId);

 watchId=null;

 trackButton.innerHTML=
 "▶ 移動追跡";

 trackButton.style.background=
 "#08752e";

}

};


/* ================= MAP TAP ================= */

map.on(
"click",
async e=>{

const lat=e.latlng.lat;
const lng=e.latlng.lng;

if(selectedMarker)
 map.removeLayer(selectedMarker);

const result=
await evaluatePoint(
 lat,lng,"tap"
);

if(!result)
 return;

const color=
markerColor(result.ev.type);

selectedMarker=
L.circleMarker(
 [lat,lng],
 {
  radius:9,
  color:"white",
  weight:3,
  fillColor:color,
  fillOpacity:1
 }
)
.addTo(map)
.bindPopup(
 "<b>"+result.place+"</b><br>"+
 result.ev.icon+
 " "+
 result.ev.title
)
