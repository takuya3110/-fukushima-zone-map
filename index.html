<script>
"use strict";


/* =====================================
 MAP
===================================== */

const map=L.map("map",{
 zoomControl:true,
 zoomAnimation:false
});

map.setView(
 [37.50,140.92],
 10
);


L.tileLayer(
 "https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",
 {
  maxZoom:18,
  attribution:"地理院タイル"
 }
).addTo(map);


/* Fukushima Daiichi */

L.circleMarker(
 [37.4211,141.0328],
 {
  radius:6,
  color:"#fff",
  weight:2,
  fillColor:"#111",
  fillOpacity:1
 }
)
.addTo(map)
.bindPopup(
 "福島第一原子力発電所"
);


/* =====================================
 STATUS
===================================== */

function status(html){

 document
 .getElementById("status")
 .innerHTML=html;

}


/* =====================================
 MUNICIPALITIES
===================================== */

const muniNames={

 "07212":"南相馬市",
 "07543":"富岡町",
 "07545":"大熊町",
 "07546":"双葉町",
 "07547":"浪江町",
 "07548":"葛尾村",
 "07564":"飯舘村"

};


const towns={

 minamisoma:{
  name:"南相馬市",
  lat:37.638,
  lng:140.957,
  zoom:11
 },

 iitate:{
  name:"飯舘村",
  lat:37.616,
  lng:140.744,
  zoom:11
 },

 namie:{
  name:"浪江町",
  lat:37.494,
  lng:140.993,
  zoom:12
 },

 katsurao:{
  name:"葛尾村",
  lat:37.503,
  lng:140.765,
  zoom:12
 },

 futaba:{
  name:"双葉町",
  lat:37.449,
  lng:141.010,
  zoom:13
 },

 okuma:{
  name:"大熊町",
  lat:37.400,
  lng:140.985,
  zoom:13
 },

 tomioka:{
  name:"富岡町",
  lat:37.345,
  lng:141.008,
  zoom:13
 }

};


/* =====================================
 GSI REVERSE GEOCODER
===================================== */

async function reverseAddress(lat,lng){

 try{

  const url=
  "https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress"+
  "?lat="+encodeURIComponent(lat)+
  "&lon="+encodeURIComponent(lng);


  const r=await fetch(url);

  if(!r.ok){
   return null;
  }

  const j=await r.json();

  if(!j.results){
   return null;
  }


  return{

   muni:
   String(j.results.muniCd||""),

   town:
   String(j.results.lv01Nm||"")

  };


 }catch(e){

  return null;

 }

}


/* =====================================
 NORMALIZE
===================================== */

function cleanName(s){

 return String(s||"")
 .replace(/\s/g,"")
 .replace(/^大字/,"");

}


function containsAny(text,list){

 return list.some(function(x){
  return text.includes(x);
 });

}


/* =====================================
 NAMIE

 Official:
 2017 full-oaza release = 20 oaza
 2023 SRRBA release = parcel-based
===================================== */

const namieReleased=[

 "立野",
 "藤橋",
 "西台",
 "酒田",
 "苅宿",
 "棚塩",
 "北幾世橋",
 "幾世橋",
 "権現堂",
 "請戸",
 "中浜",
 "両竹",
 "高瀬",
 "牛渡",
 "川添",
 "樋渡",
 "谷津田",
 "加倉",
 "田尻",
 "小野田"

];


const namieMixed=[

 "大堀",
 "井手",
 "末森",
 "室原",
 "羽附",
 "津島",
 "下津島",
 "南津島",
 "赤宇木",
 "昼曽根"

];


function classifyNamie(n){

 if(n.includes("酒井")){

  return{
   state:"red",
   title:"🔴 帰還困難区域",
   detail:
   "浪江町大字酒井は、公式資料で全域が帰還困難区域として確認できます。"
  };

 }


 if(containsAny(n,namieReleased)){

  return{
   state:"green",
   title:"🟢 避難指示解除区域",
   detail:
   "2017年3月31日に大字全域の避難指示が解除された区域です。"
  };

 }


 if(containsAny(n,namieMixed)){

  return{
   state:"yellow",
   title:"🟡 詳細境界の確認が必要",
   detail:
   "この大字では2023年の解除が地番単位です。町字名だけでは解除・未解除を断定できません。"
  };

 }


 return{
  state:"yellow",
  title:"🟡 詳細確認",
  detail:
  "浪江町内ですが、町字名だけでは現在の区域を確定できません。"
 };

}


/* =====================================
 MINAMISOMA
===================================== */

function classifyMinamisoma(n){

 if(
  n.includes("金谷") &&
  containsAny(
   n,
   ["小畑","ドウケ","出戸間船","野中"]
  )
 ){

  return{
   state:"red",
   title:"🔴 帰還困難区域",
   detail:
   "小高区金谷の小畑・ドウケ・出戸間船・野中は帰還困難区域です。"
  };

 }


 if(n.includes("金谷")){

  return{
   state:"yellow",
   title:"🟡 金谷・詳細確認",
   detail:
   "金谷には帰還困難区域とそれ以外の区域があります。字名まで確認が必要です。"
  };

 }


 return{
  state:"yellow",
  title:"🟡 詳細確認",
  detail:
  "南相馬市では指定国有林にも帰還困難区域があります。住所情報だけでは一律に解除判定しません。"
 };

}


/* =====================================
 OKUMA
===================================== */

function classifyOkuma(n){

 if(
  n.includes("大川原") ||
  n.includes("中屋敷")
 ){

  return{
   state:"green",
   title:"🟢 解除区域側",
   detail:
   "大川原・中屋敷は避難指示解除区域として確認できます。"
  };

 }


 if(
  containsAny(
   n,
   [
    "野上",
    "下野上",
    "熊",
    "熊川",
    "小入野",
    "夫沢"
   ]
  )
 ){

  return{
   state:"yellow",
   title:"🟡 詳細境界の確認が必要",
   detail:
   "この地区には解除区域、帰還困難区域、特定帰還居住区域等が混在するため、町字名だけでは断定しません。"
  };

 }


 return{
  state:"yellow",
  title:"🟡 大熊町・詳細確認",
  detail:
  "大熊町内の詳細境界との照合が必要です。"
 };

}


/* =====================================
 FUTABA
===================================== */

function classifyFutaba(n){

 if(
  containsAny(
   n,
   ["両竹","中野","中浜"]
  )
 ){

  return{
   state:"green",
   title:"🟢 避難指示解除区域",
   detail:
   "両竹・中野・中浜は2020年3月4日に避難指示が解除された区域です。"
  };

 }


 return{
  state:"yellow",
  title:"🟡 詳細境界の確認が必要",
  detail:
  "双葉町では特定復興再生拠点区域の解除も進んでいるため、大字名だけで帰還困難区域とは断定しません。"
 };

}


/* =====================================
 TOMIOKA
===================================== */

function classifyTomioka(n){

 if(
  n.includes("小良ヶ浜") ||
  n.includes("小良浜") ||
  n.includes("深谷")
 ){

  return{
   state:"yellow",
   title:"🟡 帰還困難区域を含む地区",
   detail:
   "小良ヶ浜・深谷地区を中心に現在も避難指示が継続しています。ただし解除済み区域もあるため地点境界の確認が必要です。"
  };

 }


 return{
  state:"yellow",
  title:"🟡 詳細確認",
  detail:
  "富岡町では小良ヶ浜・深谷地区を中心に帰還困難区域が残ります。町字だけで一律判定しません。"
 };

}


/* =====================================
 IITATE
===================================== */

function classifyIitate(n){

 if(n.includes("長泥")){

  return{
   state:"yellow",
   title:"🟡 長泥・詳細境界確認",
   detail:
   "長泥には帰還困難区域が残りますが、特定復興再生拠点区域や曲田地区の一部など解除済み区域もあります。"
  };

 }


 return{
  state:"green",
  title:"🟢 避難指示解除側",
  detail:
  "現在、飯舘村で帰還困難区域が残るのは長泥地区です。"
 };

}


/* =====================================
 KATSURAO
===================================== */

function classifyKatsurao(n){

 /*
 Exact current SLAR geometry is not
 publicly suitable for address-only
 classification.
 */

 if(n.includes("落合")){

  return{
   state:"green",
   title:"🟢 解除区域側",
   detail:
   "落合地区は帰還困難区域の中心区域ではありません。"
  };

 }


 return{
  state:"yellow",
  title:"🟡 詳細境界の確認が必要",
  detail:
  "葛尾村の帰還困難区域・解除区域は町字名だけでは安全に確定できないため、詳細地図との照合が必要です。"
 };

}


/* =====================================
 MASTER CLASSIFIER
===================================== */

function classify(muni,town){

 const n=cleanName(town);


 switch(muni){

  case "07547":
   return classifyNamie(n);

  case "07212":
   return classifyMinamisoma(n);

  case "07545":
   return classifyOkuma(n);

  case "07546":
   return classifyFutaba(n);

  case "07543":
   return classifyTomioka(n);

  case "07564":
   return classifyIitate(n);

  case "07548":
   return classifyKatsurao(n);

  default:

   return{
    state:"green",
    title:"🟢 帰還困難区域7市町村の外",
    detail:
    "現在の帰還困難区域が残る7市町村には該当していません。"
   };

 }

}


/* =====================================
 EVALUATE
===================================== */

async function evaluate(
 lat,lng,accuracy
){

 status(
  "<b>📍 住所・区域を照合中…</b>"
 );


 const ad=
 await reverseAddress(
  lat,lng
 );


 if(!ad){

  status(

   "<b>📍 "+
   lat.toFixed(6)+
   ", "+
   lng.toFixed(6)+
   "</b>"+

   '<div class="row grey">'+
   "地理院の住所情報を取得できませんでした。"+
   "</div>"

  );

  return;

 }


 const muniName=
 muniNames[ad.muni]||
 "対象7市町村外";


 const result=
 classify(
  ad.muni,
  ad.town
 );


 let html=

 "<b>📍 地点判定</b>"+

 '<div class="row blue">'+
 "<b>"+muniName+"</b><br>"+
 (ad.town||"町字名なし")+
 "<br>"+
 lat.toFixed(6)+
 ", "+
 lng.toFixed(6)+
 "</div>";


 html+=

 '<div class="row '+
 result.state+
 '">'+
 "<b>"+
 result.title+
 "</b><br>"+
 result.detail+
 "</div>";


 if(
  ["07543","07545","07546",
   "07547","07548","07564","07212"]
  .includes(ad.muni)
 ){

  html+=

  '<div class="row purple">'+
  "<b>🟣 特定帰還居住区域</b><br>"+
  "設定区域であっても、実際の避難指示解除前は帰還困難区域です。"+
  "</div>";

 }


 if(accuracy>0){

  html+=

  '<div class="row grey">'+
  "GPS精度：約±"+
  Math.round(accuracy)+
  "m"+
  "</div>";

 }


 if(result.state==="yellow"){

  html+=

  '<div class="row grey">'+
  "この地点は町字情報だけでは確定しません。"+
  "誤判定防止のため赤・緑を断定していません。"+
  "</div>";

 }


 status(html);

}


/* =====================================
 MARKERS
===================================== */

let pointMarker=null;
let accuracyCircle=null;


function drawPoint(
 lat,lng,color
){

 if(pointMarker){
  map.removeLayer(pointMarker);
 }


 pointMarker=L.circleMarker(
  [lat,lng],
  {
   radius:10,
   color:"#fff",
   weight:3,
   fillColor:color,
   fillOpacity:1
  }
 ).addTo(map);

}


/* =====================================
 GPS
===================================== */

function showGPS(p){

 const lat=
 p.coords.latitude;

 const lng=
 p.coords.longitude;

 const acc=
 p.coords.accuracy;


 drawPoint(
  lat,lng,
  "#1677ff"
 );


 if(accuracyCircle){
  map.removeLayer(accuracyCircle);
 }


 accuracyCircle=L.circle(
  [lat,lng],
  {
   radius:acc,
   color:"#1677ff",
   weight:1,
   fillOpacity:.08
  }
 ).addTo(map);


 map.invalidateSize({
  pan:false
 });


 map.setView(
  [lat,lng],
  16,
  {
   animate:false
  }
 );


 evaluate(
  lat,lng,acc
 );

}


document
.getElementById("gps")
.addEventListener(
 "click",
 function(){

  navigator.geolocation
  .getCurrentPosition(

   showGPS,

   function(){

    status(
     "<b>現在地を取得できませんでした。</b>"
    );

   },

   {
    enableHighAccuracy:true,
    timeout:15000,
    maximumAge:1000
   }

  );

 }
);


/* =====================================
 MAP TAP
===================================== */

map.on(
 "click",
 function(e){

  const lat=
  e.latlng.lat;

  const lng=
  e.latlng.lng;


  drawPoint(
   lat,lng,
   "#df8500"
  );


  evaluate(
   lat,lng,
   0
  );

 }
);


/* =====================================
 TOWN BUTTONS
===================================== */

document
.querySelectorAll("[data-town]")
.forEach(function(btn){

 btn.addEventListener(
  "click",
  function(){

   const t=
   towns[this.dataset.town];


   map.invalidateSize({
    pan:false
   });


   map.setView(
    [t.lat,t.lng],
    t.zoom,
    {
     animate:false
    }
   );


   status(

    "<b>🔵 "+
    t.name+
    "</b>"+

    '<div class="row blue">'+
    "地図上の具体的な地点をタップすると、"+
    "町字情報から区域を判定します。"+
    "</div>"

   );

  }

 );

});

 ROAD BUTTONS
===================================== */

const roads={

 "114":{

  lat:37.62,
  lng:140.86,
  zoom:12
 },

 "49":{
  name:"県道49号",
  lat:37.60,
  lng:140.89,
  zoom:12
 },

 "35":{
  name:"県道35号～国道288号",
  lat:37.46,
  lng:140.90,
  zoom:12
 },

 "288":{
  name:"国道288号",
  lat:37.42,
  lng:140.91,
  zoom:12
 },

 "252":{
  name:"県道252号等",
  lat:37.405,
  lng:140.993,
  zoom:14
 },

 "101":{
  name:"双葉町道101・109号",
  lat:37.465,
  lng:141.000,
  zoom:14
 },

 "67":{
  name:"大熊町道東67号",
  lat:37.386,
  lng:141.000,
  zoom:14
 }

};


document
.querySelectorAll("[data-road]")
.forEach(function(btn){

 btn.addEventListener(
  "click",
  function(){

   const r=
   roads[this.dataset.road];


   map.setView(
    [r.lat,r.lng],
    r.zoom,
    {
     animate:false
    }
   );


   status(

    "<b>🟠 "+
    r.name+
    "</b>"+

    '<div class="row orange">'+
    "特別通過交通の対象道路周辺です。"+
    "</div>"+

    '<div class="row grey">'+
    "道路中心線をまだ自動判定していないため、"+
    "このボタンだけでは「道路上」とは判定しません。"+
    "</div>"

   );

  }

 );

});


/* =====================================
 ALL BUTTONS
===================================== */

document
.getElementById("allTowns")
.addEventListener(
 "click",
 function(){

  map.setView(
   [37.50,140.92],
   10,
   {animate:false}
  );


  status(

/* =====================================
 TRACK
===================================== */

let tracking=false;
let watchId=null;


document
.getElementById("track")
.addEventListener(
 "click",
 function(){

  if(!tracking){

   tracking=true;

   this.textContent=
   "■ 追跡停止";

   this.style.background=
   "#a26b00";


   watchId=
   navigator.geolocation
   .watchPosition(

    showGPS,

    function(){},

    {
     enableHighAccuracy:true,
     maximumAge:2000
    }

   );


  }else{

   tracking=false;


   if(watchId!==null){

    navigator.geolocation
    .clearWatch(watchId);

   }


   watchId=null;

   this.textContent=
   "▶ 移動追跡";

   this.style.background=
   "#287a37";

  }

 }
);

===================================== */

document
.getElementById("wide")
.addEventListener(
 "click",
 function(){

  map.invalidateSize({
   pan:false
  });


  map.setView(
   [37.50,140.92],
   10,
   {
    animate:false
   }
  );


  status(
   "<b>🗾 浜通り広域表示</b>"
  );

 }
);


/* =====================================
 iPHONE FIX
===================================== */

function fixMap(){

 map.invalidateSize({
  pan:false,
  debounceMoveend:true
 });

}


window.addEventListener(
 "load",
 function(){

  setTimeout(fixMap,100);
  setTimeout(fixMap,500);
  setTimeout(fixMap,1500);

 }
);


window.addEventListener(
 "orientationchange",
 function(){

  setTimeout(fixMap,500);

 }
);

</script>
