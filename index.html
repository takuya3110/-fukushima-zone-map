===================================================== */

const relaxationLayer=L.layerGroup().addTo(map);

relaxationPolygons.forEach(poly=>{

 L.polygon(
  poly,
  {
   color:"#00a532",
   weight:3,
   fillColor:"#16c63c",
   fillOpacity:0.35
  }
 )
 .addTo(relaxationLayer)
 .bindPopup(
  "<b>立入規制緩和区域</b><br>"+

  "⚠️ 公式区域図からデジタイズした参考境界"
 );

});


/* =====================================================
 POINT IN POLYGON
===================================================== */

function pointInPolygon(lat,lng,poly){

 let inside=false;

 for(
  let i=0,j=poly.length-1;
  i<poly.length;
  j=i++
 ){

  const yi=poly[i][0];
  const xi=poly[i][1];

  const yj=poly[j][0];
  const xj=poly[j][1];

  const intersect=
   ((yi>lat)!=(yj>lat)) &&
   (
    lng <
    (xj-xi)*(lat-yi)/(yj-yi)+xi
   );

  if(intersect) inside=!inside;

 }

 return inside;
}


function insideRelaxation(lat,lng){

 return relaxationPolygons.some(
  p=>pointInPolygon(lat,lng,p)
 );

}


/* =====================================================
 DISTANCE
===================================================== */

function metersBetween(lat1,lng1,lat2,lng2){

 const R=6371000;

 const p1=lat1*Math.PI/180;
 const p2=lat2*Math.PI/180;

 const dp=(lat2-lat1)*Math.PI/180;
 const dl=(lng2-lng1)*Math.PI/180;

 const a=
 Math.sin(dp/2)**2+
 Math.cos(p1)*Math.cos(p2)*
 Math.sin(dl/2)**2;

 return 2*R*Math.atan2(
  Math.sqrt(a),
  Math.sqrt(1-a)
 );

}


function localXY(
 lat,lng,
 baseLat,baseLng
){

 const y=
 (lat-baseLat)*111320;

 const x=
 (lng-baseLng)*
 111320*
 Math.cos(baseLat*Math.PI/180);

 return [x,y];
}


function distanceToSegment(
 p,a,b
){

 const px=p[0],py=p[1];
 const ax=a[0],ay=a[1];
 const bx=b[0],by=b[1];

 const dx=bx-ax;
 const dy=by-ay;

 if(dx===0 && dy===0){
  return Math.hypot(px-ax,py-ay);
 }

 let t=
 (
  (px-ax)*dx+
  (py-ay)*dy
 )/
 (
  dx*dx+
  dy*dy
 );

 t=Math.max(0,Math.min(1,t));

 const x=ax+t*dx;
 const y=ay+t*dy;

 return Math.hypot(
  px-x,
  py-y
 );

}


function distanceToBoundary(
 lat,lng
){

 let min=Infinity;

 relaxationPolygons.forEach(poly=>{

  for(let i=0;i<poly.length;i++){

   const a=poly[i];
   const b=poly[
    (i+1)%poly.length
   ];

   const pxy=
   localXY(lat,lng,lat,lng);

   const axy=
   localXY(
    a[0],a[1],
    lat,lng
   );

   const bxy=
   localXY(
    b[0],b[1],
    lat,lng
   );

   const d=
   distanceToSegment(
    pxy,
    axy,
    bxy
   );

   if(d<min) min=d;

  }

 });

 return min;
}


/* =====================================================
 REVERSE GEOCODER
===================================================== */

const municipalityNames={
 "07212":"南相馬市",
 "07543":"富岡町",
 "07545":"大熊町",
 "07546":"双葉町",
 "07547":"浪江町",
 "07548":"葛尾村",
 "07564":"飯舘村"
};


async function reverseGeocode(lat,lng){

 try{

  const url=
  "https://mreversegeocoder.gsi.go.jp/reverse-geocoder/"+
  "LonLatToAddress?lat="+
  encodeURIComponent(lat)+
  "&lon="+
  encodeURIComponent(lng);

  const r=await fetch(url);
  const j=await r.json();

  if(!j.results) return null;

  return{
   code:String(j.results.muniCd||""),
   town:j.results.lv01Nm||""
  };

 }catch(e){

  return null;

 }

}


/* =====================================================
 RESULT
===================================================== */

async function evaluatePoint(
 lat,lng,
 accuracy,
 source
){

 const ad=
 await reverseGeocode(
  lat,lng
 );

 let place="住所不明";

 if(ad){

  place=
  (municipalityNames[ad.code]||
  "対象7市町村外")+
  (ad.town?" "+ad.town:"");

 }


 const inside=
 insideRelaxation(
  lat,lng
 );

 const boundaryDistance=
 distanceToBoundary(
  lat,lng
 );


 /*
 GPSの精度を考慮。
 地図タップは30m。
 */

 const warningDistance=
 Math.max(
  30,
  accuracy ?
  accuracy+10 :
  30
 );


 let html=
 '<div class="statusTitle">'+
 source+" "+place+
 '</div>';


 if(boundaryDistance<=warningDistance){

  html+=
  '<div class="result warn">'+
  '<b>⚠️ 立入規制緩和区域の境界付近</b><br>'+
  '参考境界まで約'+
  Math.round(boundaryDistance)+
  'mです。区域内外を断定しません。'+
  '</div>';

 }else if(inside){

  html+=
  '<div class="result ok">'+
  '<b>🟩 立入規制緩和区域</b><br>'+
  '野上2区・下野上1区の参考GIS境界では区域内です。'+
  '</div>';

 }else{

  html+=
  '<div class="result out">'+
  '<b>⬜ この第1区域の外側</b><br>'+
  '野上2区・下野上1区の立入規制緩和区域には該当しない判定です。'+
  '</div>';

 }


 html+=
 '<div class="coords">'+
 lat.toFixed(6)+
 ", "+
 lng.toFixed(6);

 if(accuracy){
  html+=" ｜ GPS精度 約±"+
  Math.round(accuracy)+"m";
 }

 html+=
 '</div>'+
 '<div class="referenceTag">'+
 '参考GIS判定・法的地番判定ではありません'+
 '</div>';


 document
 .getElementById("status")
 .innerHTML=html;

}


/* =====================================================
 GPS
===================================================== */

let gpsMarker=null;
let accuracyCircle=null;

async function showGPS(
 pos,
 follow
){

 const lat=pos.coords.latitude;
 const lng=pos.coords.longitude;
 const acc=pos.coords.accuracy;


 if(gpsMarker)
  map.removeLayer(gpsMarker);

 if(accuracyCircle)
  map.removeLayer(accuracyCircle);


 gpsMarker=
 L.circleMarker(
  [lat,lng],
  {
   radius:9,
   color:"#fff",
   weight:3,
   fillColor:"#1677ff",
   fillOpacity:1
  }
 )
 .addTo(map);


 accuracyCircle=
 L.circle(
  [lat,lng],
  {
   radius:acc,
   color:"#1677ff",
   weight:1,
   fillColor:"#1677ff",
   fillOpacity:.08
  }
 )
 .addTo(map);


 if(follow){
  map.setView([lat,lng],16);
 }


 evaluatePoint(
  lat,lng,
  acc,
  "📍"
 );

}

document
.getElementById("gps")
.onclick=()=>{

 document
 .getElementById("status")
 .innerHTML=
 "<b>📍 現在地を取得しています…</b>";


 navigator.geolocation.getCurrentPosition(

  p=>showGPS(p,true),

  ()=>{
   document
   .getElementById("status")
   .innerHTML=
   "<b>現在地を取得できませんでした。</b>";
  },

  {
   enableHighAccuracy:true,
   timeout:15000,
   maximumAge:2000
  }

 );

};


/* =====================================================
 TRACKING
===================================================== */

let tracking=false;
let watchId=null;


document
.getElementById("track")
.onclick=()=>{

 const btn=
 document.getElementById("track");


 if(!tracking){

  tracking=true;

  btn.innerHTML="■ 追跡停止";
  btn.style.background="#9a6400";


  watchId=
  navigator.geolocation.watchPosition(

   p=>showGPS(p,true),

   ()=>{},

   {
    enableHighAccuracy:true,
    maximumAge:3000,
    timeout:20000
   }

  );


 }else{

  tracking=false;

  if(watchId!==null){

   navigator.geolocation.clearWatch(
    watchId
   );

  }

  watchId=null;

  btn.innerHTML="▶ 移動追跡";
  btn.style.background="#08752e";

 }

};


/* =====================================================

===================================================== */

let tapMarker=null;


map.on(
 "click",
 e=>{

  const lat=e.latlng.lat;
  const lng=e.latlng.lng;


  if(tapMarker)
   map.removeLayer(tapMarker);


  tapMarker=
  L.circleMarker(
   [lat,lng],
   {
    radius:7,
    color:"#fff",
    weight:2,
    fillColor:"#e28a00",
    fillOpacity:1
   }
  )
  .addTo(map);


  evaluatePoint(
   lat,lng,
   null,
   "👆"
  );

 }

legend.onAdd=function(){

 '<span class="dot red"></span>帰還困難<br>'+
 '<span class="dot purple"></span>特定帰還居住';

legend.addTo(map);
