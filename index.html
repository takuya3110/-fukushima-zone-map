/* =====================================================
   REVERSE GEOCODER
===================================================== */

async function reverseGeocode(lat,lng){

 try{

   const url=
    "https://mreversegeocoder.gsi.go.jp/reverse-geocoder/"+
    "LonLatToAddress?lat="+
    encodeURIComponent(lat)+
    "&lon="+
    encodeURIComponent(lng);

   const r=await fetch(url);

   if(!r.ok)
     throw new Error();

   const j=await r.json();

   if(!j.results)
     return null;

   return{
     code:String(j.results.muniCd || ""),
     town:j.results.lv01Nm || ""
   };

 }catch(e){

   return null;

 }

}


/* =====================================================
   ADDRESS CLASSIFICATION
===================================================== */

function classifyAddress(code,town){

 if(!municipalities[code]){

   return{
    level:"low",
    title:"🟢 帰還困難区域が残る7市町村の外",
    text:
     "現在の帰還困難区域が設定されている"+
     "7市町村には該当しません。"
   };

 }


 const rule=rules[code];

 if(rule && town){

   const hit=
    rule.words.find(
      w=>town.indexOf(w)!==-1
    );

   if(hit){

     return{
       level:"high",
       title:"🔴 帰還困難区域に関係する地区名に一致",
       text:
        "一致："+hit+"。"+
        rule.detail+
        " 地番・境界によって解除済みの場合があるため、"+
        "最終確認は公式情報が必要です。"
     };

   }

 }


 return{
   level:"medium",
   title:"🟠 7市町村内・詳細確認が必要",
   text:
    "この市町村には帰還困難区域が残っていますが、"+
    "取得した地名だけでは帰還困難区域とは判定できません。"
 };

}

   "緯度経度："+

   lat.toFixed(6)+
   ", "+
   lng.toFixed(6)+

   "　GPS精度：約"+
   Math.round(acc)+
   "m"+

   "</small>";


 marker
 .bindPopup(

   "<b>現在地</b><br>"+

   (muni ? muni.name : "")+

   (town ? " "+town : "")+

   "<br>"+

   lat.toFixed(6)+
   ", "+
   lng.toFixed(6)

 )
 .openPopup();

}


/* =====================================================
   CURRENT LOCATION
===================================================== */

document
.getElementById("gps")
.onclick=()=>{

 status.style.background=
  "#eef3f8";

 status.innerHTML=
  "<b>現在地を取得しています…</b>";

 navigator.geolocation.getCurrentPosition(

   p=>showPosition(p,true),

   ()=>{

     status.innerHTML=
      "<b>現在地を取得できませんでした。</b>";

   },

   {
    enableHighAccuracy:true,
    timeout:15000,
    maximumAge:2000
   }

 );

};


/* =====================================================
   TRACKING
===================================================== */

trackButton.onclick=()=>{

 if(!tracking){

   tracking=true;

   trackButton.innerHTML=
    "■ 追跡停止";

   trackButton.style.background=
    "#a06400";


   watchId=
    navigator.geolocation.watchPosition(

      p=>showPosition(p,true),

      ()=>{},

      {
       enableHighAccuracy:true,
       maximumAge:3000,
       timeout:20000
      }

    );

 }else{

   tracking=false;

   if(watchId!==null){

     navigator.geolocation.clearWatch(
       watchId
     );

   }

   watchId=null;

   trackButton.innerHTML=
    "▶ 移動追跡";

   trackButton.style.background=
    "#08752e";

 }

};


/* =====================================================
   OLD ZONE
===================================================== */

document
.getElementById("old")
.onclick=()=>{

 if(!oldVisible){

   oldZone.addTo(map);

   oldVisible=true;

   document
   .getElementById("old")
   .innerHTML=
    "⬜ 旧区域を隠す";

   map.fitBounds(
    oldZone.getBounds()
   );

 }else{

   map.removeLayer(oldZone);

   oldVisible=false;

   document
   .getElementById("old")
   .innerHTML=
    "🟥 旧区域を表示";

 }

};
