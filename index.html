<script>

const townPolygon=
L.polygon(
 okuma,
 {
  color:"#1769e0",
  weight:3,
  dashArray:"8,5",
  fillColor:"#1769e0",
  fillOpacity:.025
 }
)
.addTo(map);


let townVisible=true;


/* ===================================
 POINT IN POLYGON
=================================== */

function pointInPolygon(
 lat,lng,poly
){

 let inside=false;


 for(
  let i=0,j=poly.length-1;
  i<poly.length;
  j=i++
 ){

  const yi=poly[i][0];
  const xi=poly[i][1];

  const yj=poly[j][0];
  const xj=poly[j][1];


  const intersect=

  ((yi>lat)!=(yj>lat))

  &&

  (
   lng<
   (xj-xi)*
   (lat-yi)/
   (yj-yi)+xi
  );


  if(intersect)
   inside=!inside;

 }


 return inside;

}


/* ===================================
 OFFICIAL REFERENCE MAPS
=================================== */

const wholeOfficial=

"https://www.town.okuma.fukushima.jp/uploaded/image/18390.jpg";


const wholeBounds=[

 [37.3600,140.8300],
 [37.4470,141.0600]

];


const greenMaps={


1:{

 name:
 "野上2区・下野上1区",

 image:
 "https://www.town.okuma.fukushima.jp/uploaded/image/18395.jpg",

 bounds:[
  [37.3990,140.9400],
  [37.4235,140.9850]
 ],

 view:
 [37.4115,140.9635],

 zoom:15

},


2:{

 name:
 "熊2区・熊3区の一部",

 image:
 "https://www.town.okuma.fukushima.jp/uploaded/image/18400.jpg",

 bounds:[
  [37.3690,140.9850],
  [37.4000,141.0250]
 ],

 view:
 [37.3845,141.0060],

 zoom:15

},


3:{

 name:
 "熊2区・町区の一部",

 image:
 "https://www.town.okuma.fukushima.jp/uploaded/image/18397.jpg",

 bounds:[
  [37.3680,140.9950],
  [37.3980,141.0320]
 ],

 view:
 [37.3830,141.0130],

 zoom:15

}

};


let overlay=null;


const opacities=[
 .25,.45,.65,.80
];

let opacityIndex=1;


/* ===================================
 STATUS
=================================== */

function setStatus(html){

 document
 .getElementById("status")
 .innerHTML=html;

}


/* ===================================
 ADDRESS
=================================== */

let lastAddress=null;


async function reverseAddress(
 lat,lng
){

 try{

  const url=

  "https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress"+
  "?lat="+
  encodeURIComponent(lat)+
  "&lon="+
  encodeURIComponent(lng);


  const r=
  await fetch(url);


  const j=
  await r.json();


  if(!j.results)
   return null;


  return{

   muni:
   String(
    j.results.muniCd||""
   ),

   town:
   j.results.lv01Nm||""

  };


 }catch(e){

  return null;

 }

}


/* ===================================
 CLASSIFICATION ENGINE
=================================== */

function classifyAddress(ad){

 if(!ad){

  return{

   evac:
   "⚠️ 住所を取得できません",

   evacClass:"grey",

   slar:
   "⚠️ 未判定",

   slarClass:"grey",

   entry:
   "⚠️ 未判定",

   entryClass:"grey",

   reason:
   "住所情報なし"

  };

 }


 const name=
 ad.town||"";


 /*
  OFFICIALLY CLEAR RELEASED-SIDE
  ADDRESS GROUPS

  Deliberately conservative.
 */


 if(
  name.includes("大川原") ||
  name.includes("中屋敷")
 ){

  return{

   evac:
   "🟢 避難指示解除側",

   evacClass:"green",

   slar:
   "― 特定帰還居住区域ではない側",

   slarClass:"grey",

   entry:
   "🟢 解除区域",

   entryClass:"green",

   reason:
   "全域解除行政区側の住所情報から判定"

  };

 }


 /*
  IMPORTANT

  These oaza contain mixed
  regulatory states.

  Therefore no automatic red.
 */


 if(
  name.includes("野上") ||
  name.includes("下野上") ||
  name.includes("熊") ||
  name.includes("熊川") ||
  name.includes("夫沢")
 ){

  return{

   evac:
   "⚠️ 帰還困難・解除区域が混在",

   evacClass:"grey",

   slar:
   "⚠️ 特定帰還居住区域を含む可能性",

   slarClass:"purple",

   entry:
   "⚠️ 立入規制緩和区域を含む可能性",

   entryClass:"green",

   reason:
   "行政区内で制度区域が混在するため位置だけでは確定しません"

  };

 }


 /*
  OIRINO

  Public information says
  all of Oirino administrative
  district is DTRZ.

  But oaza and administrative
  district are not automatically
  assumed identical.

  Therefore still conservative.
 */


 if(
  name.includes("小入野")
 ){

  return{

   evac:
   "⚠️ 帰還困難区域側の可能性が高い",

   evacClass:"red",

   slar:
   "⚠️ 詳細境界未判定",

   slarClass:"grey",

   entry:
   "⚠️ 詳細境界未判定",

   entryClass:"grey",

   reason:
   "小入野区は全域帰還困難区域ですが、町字境界と行政区境界の一致を未確認のため確定表示しません"

  };

 }


 return{

  evac:
  "⚠️ 詳細境界未判定",

  evacClass:"grey",

  slar:
  "⚠️ 詳細境界未判定",

  slarClass:"grey",

  entry:
  "⚠️ 詳細境界未判定",

  entryClass:"grey",

  reason:
  "町字名だけでは制度境界を確定できません"

 };

}


/* ===================================
 EVALUATE
=================================== */

async function evaluate(
 lat,lng,accuracy
){

 const inOkuma=

 pointInPolygon(
  lat,lng,okuma
 );


 if(!inOkuma){

  setStatus(

   "<b>📍 大熊町外</b><br>"+

   lat.toFixed(6)+
   ", "+
   lng.toFixed(6)+

   '<div class="row grey">'+
   "v32では大熊町を詳細判定中です。"+
   "</div>"

  );

  return;

 }


 setStatus(
  "<b>📍 住所・区域を照合しています…</b>"
 );


 const ad=
 await reverseAddress(
  lat,lng
 );


 lastAddress=ad;


 const c=
 classifyAddress(ad);


 let place="大熊町";


 if(ad && ad.town){

  place+=" "+ad.town;

 }


 let html=

 "<b>📍 "+
 place+
 "</b><br>"+

 lat.toFixed(6)+
 ", "+
 lng.toFixed(6);


 html+=

 '<div class="row blue">'+
 '<b>市町村</b><br>'+
 '🔵 大熊町内（ベクトル判定）'+
 '</div>';


 html+=

 '<div class="row '+c.evacClass+'">'+
 '<b>避難指示</b><br>'+
 c.evac+
 '</div>';


 html+=

 '<div class="row '+c.slarClass+'">'+
 '<b>特定帰還居住区域</b><br>'+
 c.slar+
 '</div>';


 html+=

 '<div class="row '+c.entryClass+'">'+
 '<b>立入規制</b><br>'+
 c.entry+
 '</div>';


 html+=

 '<div style="'+
 'font-size:8px;'+
 'color:#666;'+
 'margin-top:4px'+
 '">'+

 c.reason;


 if(accuracy>0){

  html+=
  "<br>GPS精度 約±"+
  Math.round(accuracy)+
  "m";

 }


 html+=
 "</div>";


 setStatus(html);

}


/* ===================================
 GPS
=================================== */

let gpsMarker=null;
let accuracyCircle=null;


function drawGPS(
 pos,follow
){

 const lat=
 pos.coords.latitude;

 const lng=
 pos.coords.longitude;

 const acc=
 pos.coords.accuracy;


 if(gpsMarker)
  map.removeLayer(gpsMarker);


 if(accuracyCircle)
  map.removeLayer(accuracyCircle);


 gpsMarker=

 L.circleMarker(
  [lat,lng],
  {
   radius:9,
   color:"#fff",
   weight:3,
   fillColor:"#1677ff",
   fillOpacity:1
  }
 )
 .addTo(map);


 accuracyCircle=

 L.circle(
  [lat,lng],
  {
   radius:acc,
   color:"#1677ff",
   weight:1,
   fillColor:"#1677ff",
   fillOpacity:.08
  }
 )
 .addTo(map);


 if(follow){

  map.setView(
   [lat,lng],
   16
  );

 }


 evaluate(
  lat,lng,acc
 );

}


document
.getElementById("gps")
.onclick=()=>{

 setStatus(
  "<b>📍 現在地を取得しています…</b>"
 );


 navigator.geolocation
 .getCurrentPosition(

  p=>drawGPS(p,true),

  ()=>setStatus(
   "<b>現在地を取得できませんでした。</b>"
  ),

  {
   enableHighAccuracy:true,
   timeout:15000,
   maximumAge:1000
  }

 );

};


/* ===================================
 TRACKING
=================================== */

let tracking=false;
let watchId=null;


document
.getElementById("track")
.onclick=()=>{

 const b=
 document.getElementById("track");


 if(!tracking){

  tracking=true;

  b.innerHTML=
  "■ 追跡停止";

  b.style.background=
  "#a26b00";


  watchId=

  navigator.geolocation
  .watchPosition(

   p=>drawGPS(p,true),

   ()=>{},

   {
    enableHighAccuracy:true,
    timeout:20000,
    maximumAge:2000
   }

  );


 }else{

  tracking=false;


  if(watchId!==null){

   navigator.geolocation
   .clearWatch(watchId);

  }


  watchId=null;


  b.innerHTML=
  "▶ 移動追跡";

  b.style.background=
  "#08752e";

 }

};


/* ===================================
 MAP TAP
=================================== */

let tapMarker=null;


map.on(
 "click",
 e=>{

  if(tapMarker)
   map.removeLayer(tapMarker);


  tapMarker=

  L.circleMarker(
   e.latlng,
   {
    radius:7,
    color:"#fff",
    weight:2,
    fillColor:"#e58a00",
    fillOpacity:1
   }
  )
  .addTo(map);


  evaluate(
   e.latlng.lat,
   e.latlng.lng,
   0
  );

 }
);


/* ===================================
 MAP OVERLAYS
=================================== */

function hideOverlay(){

 if(overlay){

  map.removeLayer(overlay);

  overlay=null;

 }

}


function showWholeMap(){

 hideOverlay();


 overlay=

 L.imageOverlay(
  wholeOfficial,
  wholeBounds,
  {
   opacity:
   opacities[opacityIndex],
   zIndex:400
  }
 )
 .addTo(map);


 map.setView(
  [37.400,140.985],
  13
 );


 setStatus(

  "<b>🟣 大熊町公式区域図</b><br>"+
  "特定帰還居住区域等の位置を確認できます。<br>"+
  "画像の位置合わせは参考表示です。"

 );

}


function showGreen(n){

 hideOverlay();


 const z=
 greenMaps[n];


 overlay=

 L.imageOverlay(
  z.image,
  z.bounds,
  {
   opacity:
   opacities[opacityIndex],
   zIndex:450
  }
 )
 .addTo(map);


 map.setView(
  z.view,
  z.zoom,
  {animate:false}
 );


 setStatus(

  "<b>🟩 立入規制緩和区域</b><br>"+
  z.name+
  "<br>"+
  "2026年6月22日から。"+
  "<br>"+
  "公式図の緑部分を参考表示しています。"

 );

}


function changeOpacity(){

 opacityIndex=

 (opacityIndex+1)%
 opacities.length;


 if(overlay){

  overlay.setOpacity(
   opacities[opacityIndex]
  );

 }


 setStatus(

  "<b>👁 画像透明度 "+
  Math.round(
   opacities[opacityIndex]*100
  )+
  "%</b>"

 );

}


/* ===================================
 TOWN
=================================== */

function toggleTown(){

 if(townVisible){

  map.removeLayer(
   townPolygon
  );

  townVisible=false;

 }else{

  townPolygon.addTo(map);

  townVisible=true;

 }

}


/* ===================================
 ADDRESS BUTTON
=================================== */

function showLastAddress(){

 if(!lastAddress){

  setStatus(
   "<b>🏠 まだ地点を選択していません。</b>"
  );

  return;

 }


 setStatus(

  "<b>🏠 地理院住所情報</b><br>"+
  "市町村コード："+
  lastAddress.muni+
  "<br>"+
  "町字："+
  (
   lastAddress.town||
   "取得できません"
  )

 );

}


/* ===================================
 OTHER BUTTONS
=================================== */

document
.getElementById("source")
.onclick=()=>{

 window.open(

 "https://www.town.okuma.fukushima.jp/soshiki/somu/1534.html",

 "_blank"

 );

};


document
.getElementById("reset")
.onclick=()=>{

 map.fitBounds(
  townPolygon.getBounds(),
  {
   padding:[15,15]
  }
 );

};


/* ===================================
