<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#fff}
header{padding:10px}h1{margin:0;font-size:23px}.sub{font-size:12px;color:#666}

.row{margin-top:5px;padding:7px;background:#fff;border-radius:8px}

#map{width:100%;height:450px;min-height:450px;background:#ddd}
#controls{padding:8px}.title{font-size:12px;font-weight:bold;margin:6px 0 4px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}
button{border:0;border-radius:8px;padding:11px 2px;color:#fff;font-weight:bold;font-size:11px}
.town{background:#286bd7}.layer{background:#555}#gps{background:#286bd7}#wide{background:#555}#zonesBtn{background:#7034a0}
.note{font-size:10px;color:#666;line-height:1.4;margin-top:7px}
</style>
</head>
<body>

<header>
<h1>福島・規制区域マップ</h1>
<div class="sub">v40｜実町字ポリゴン拡張版</div>

<div id="status">
<b>🗺 実境界の着色を開始しました</b>
<div class="row green">🟢 大字全域の解除を公式確認できる区域</div>
<div class="row red">🔴 大字全域が帰還困難区域と公式確認できる区域</div>
<div class="row yellow">🟡 町字内で解除・未解除が混在するため要詳細確認</div>
</div>
</header>

<div id="map"></div>

<div id="controls">
<div class="title">対象市町村</div>

<div class="grid4">
<button class="town" data-t="minamisoma">南相馬</button>
<button class="town" data-t="iitate">飯舘</button>
<button class="town" data-t="namie">浪江</button>
<button class="town" data-t="katsurao">葛尾</button>
<button class="town" data-t="futaba">双葉</button>
<button class="town" data-t="okuma">大熊</button>
<button class="town" data-t="tomioka">富岡</button>
<button id="zonesBtn">着色区域</button>
</div>

<div class="grid3">
<button id="gps">📍 現在地</button>
<button class="layer" id="toggle">🎨 色 ON/OFF</button>
<button id="wide">🗾 広域</button>
</div>

<div class="note">
v40の面着色は、e-Stat 2020国勢調査の町丁・字等境界を表示用に軽量化し、
公式の避難指示解除情報と照合した参考表示です。
統計境界そのものを法的な避難指示境界とは扱いません。
黄色区域は特に地番単位の公式図確認が必要です。
</div>
</div>

}

}

function status(h){
document.getElementById("status").innerHTML=h;
}

fillOpacity:f.properties.s==="yellow"?.08:.32,
dashArray:f.properties.s==="yellow"?"7 5":null
}),
onEachFeature:(f,l)=>{

"<b>"+f.properties.c+" "+f.properties.n+"</b><br>"+

);

zoneLayer.addTo(map);

}

document.querySelectorAll("[data-t]").forEach(b=>{
b.onclick=()=>{
const t=towns[b.dataset.t];

map.invalidateSize(false);
map.setView([t[1],t[2]],t[3],{animate:false});

status(
"<b>🔵 "+t[0]+"</b>"+
"<div class='row blue'>地図の着色区域をタップすると根拠区分を表示します。</div>"
);
};
});

document.getElementById("wide").onclick=()=>{
map.setView([37.50,140.92],10,{animate:false});
};

let gpsMarker=null;
let accCircle=null;

document.getElementById("gps").onclick=()=>{
navigator.geolocation.getCurrentPosition(
p=>{
const lat=p.coords.latitude;
const lng=p.coords.longitude;
const acc=p.coords.accuracy;

if(gpsMarker)map.removeLayer(gpsMarker);
if(accCircle)map.removeLayer(accCircle);

gpsMarker=L.circleMarker(
[lat,lng],
{
radius:10,
color:"#fff",
weight:3,
fillColor:"#1677ff",
fillOpacity:1
}
).addTo(map);

accCircle=L.circle(
[lat,lng],
{
radius:acc,
color:"#1677ff",
weight:1,
fillOpacity:.08
}
).addTo(map);

map.invalidateSize(false);
map.setView([lat,lng],16,{animate:false});

let hit=null;

zoneLayer.eachLayer(l=>{
if(
!hit &&
l.getBounds &&
l.getBounds().contains([lat,lng])
){
const f=l.feature;
if(pointInFeature(l,[lat,lng])){
hit=f;
}
}
});

if(hit){
status(
"<b>📍 現在地</b>"+
"<div class='row "+hit.properties.s+"'>"+
"<b>"+hit.properties.c+" "+hit.properties.n+"</b><br>"+
label(hit.properties.s)+
"</div>"+
"<div class='row grey'>GPS精度 約±"+
Math.round(acc)+"m</div>"
);
}else{
status(
"<b>📍 現在地</b>"+
"<div class='row blue'>v40で着色済みの実町字ポリゴンには該当しません。</div>"+
"<div class='row grey'>これは「解除」「帰還困難」の否定ではありません。未実装区域は判定保留です。<br>"+
"GPS精度 約±"+Math.round(acc)+"m</div>"
);
}
},
()=>{
status("<b>現在地を取得できませんでした。</b>");
},
{
enableHighAccuracy:true,
timeout:15000,
maximumAge:1000
}
);
};

function pointInRing(p,ring){
let x=p[1];
let y=p[0];
let inside=false;

for(let i=0,j=ring.length-1;i<ring.length;j=i++){
let xi=ring[i][0];
let yi=ring[i][1];
let xj=ring[j][0];
let yj=ring[j][1];

if(
((yi>y)!=(yj>y)) &&
(x<(xj-xi)*(y-yi)/(yj-yi)+xi)
){
inside=!inside;
}
}

return inside;
}

function pointInFeature(layer,p){
const g=layer.feature.geometry;

if(g.type==="Polygon"){
return pointInRing(p,g.coordinates[0]);
}

if(g.type==="MultiPolygon"){
return g.coordinates.some(poly=>pointInRing(p,poly[0]));
}

return false;
}

function fix(){
map.invalidateSize(false);
}

window.addEventListener("load",()=>{
setTimeout(fix,100);
setTimeout(fix,500);
setTimeout(fix,1500);
});

window.addEventListener(
"orientationchange",
()=>setTimeout(fix,500)
);
</script>
