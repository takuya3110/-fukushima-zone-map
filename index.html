<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>福島・規制区域マップ</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 padding:0;
 width:100%;
 background:#fff;
 font-family:-apple-system,BlinkMacSystemFont,
 "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}

header{
 padding:10px;
}

h1{
 margin:0;
 font-size:23px;
}

.sub{
 color:#666;
 font-size:13px;
}

#status{
 margin-top:8px;
 padding:8px;
 background:#eef3f8;
 border-radius:12px;
 font-size:13px;
 line-height:1.5;
}

.row{
 margin-top:5px;
 padding:7px;
 background:white;
 border-radius:8px;
}

.blue{border-left:6px solid #1677ff}
.red{border-left:6px solid #d92323}
.orange{border-left:6px solid #df8500}
.green{border-left:6px solid #16963b}
.grey{border-left:6px solid #777}

/*
 IMPORTANT:
 iPhone Safari対策。
 flex任せにせず地図の高さを明示する。
*/
#map{
 width:100%;
 height:450px;
 min-height:450px;
 background:#ddd;
 border-top:1px solid #ccc;
 border-bottom:1px solid #ccc;
}

#controls{
 padding:8px;
 background:#fff;
}

.title{
 margin:6px 0 4px;
 font-size:12px;
 font-weight:bold;
}

.grid4{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:4px;
}

.grid3{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:5px;
 margin-top:8px;
}

button{
 border:0;
 border-radius:8px;
 padding:11px 2px;
 color:white;
 font-weight:bold;
 font-size:11px;
 touch-action:manipulation;
}

.town{background:#286bd7}
.road{background:#dc8427}
.purple{background:#7034a0}
#gps{background:#286bd7}
#track{background:#287a37}
#wide{background:#555}

.note{
 margin-top:7px;
 color:#666;
 font-size:10px;
 line-height:1.4;
}
</style>
</head>

<body>

<header>

<h1>福島・規制区域マップ</h1>

<div class="sub">
v37.2｜iPhone地図表示・修正版
</div>

<div id="status">

<b>📍 地図表示テスト</b>

<div class="row blue">
この下に地理院地図が表示されれば修正成功です。
</div>

</div>

</header>


<!-- 高さ450pxを必ず確保 -->
<div id="map"></div>


<div id="controls">

<div class="title">
🔴 帰還困難区域が残る7市町村
</div>

<div class="grid4">

<button class="town" data-town="minamisoma">
南相馬
</button>

<button class="town" data-town="iitate">
飯舘
</button>

<button class="town" data-town="namie">
浪江
</button>

<button class="town" data-town="katsurao">
葛尾
</button>

<button class="town" data-town="futaba">
双葉
</button>

<button class="town" data-town="okuma">
大熊
</button>

<button class="town" data-town="tomioka">
富岡
</button>

<button class="purple" id="allTowns">
7市町村
</button>

</div>


<div class="title">
🟠 特別通過交通
</div>

<div class="grid4">

<button class="road" data-road="114">
114号
</button>

<button class="road" data-road="49">
県49
</button>

<button class="road" data-road="35">
県35
</button>

<button class="road" data-road="288">
288号
</button>

<button class="road" data-road="252">
252
</button>

<button class="road" data-road="101">
双葉101
</button>

<button class="road" data-road="67">
東67
</button>

<button class="road" id="allRoads">
全8区分
</button>

</div>


<div class="grid3">

<button id="gps">
📍 現在地
</button>

<button id="track">
▶ 移動追跡
</button>

<button id="wide">
🗾 広域
</button>

</div>

<div class="note">
市町村ボタンは区域境界ではなく、対象地域への移動用です。
帰還困難区域そのものの境界は次段階で重ねます。
</div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
"use strict";


/* =========================
 MAP
========================= */

const map=L.map("map",{
 zoomControl:true,
 zoomAnimation:false
});

map.setView(
 [37.50,140.92],
 10
);


L.tileLayer(
 "https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",
 {
  maxZoom:18,
  attribution:"地理院タイル"
 }
).addTo(map);


/* 福島第一 */

L.circleMarker(
 [37.4211,141.0328],
 {
  radius:6,
  color:"#fff",
  weight:2,
  fillColor:"#111",
  fillOpacity:1
 }
)
.addTo(map)
.bindPopup(
 "福島第一原子力発電所"
);


/* =========================
 STATUS
========================= */

function status(html){

 document
 .getElementById("status")
 .innerHTML=html;

}


/* =========================
 TOWNS
========================= */

const towns={

 minamisoma:{
  name:"南相馬市",
  lat:37.638,
  lng:140.957,
  zoom:11
 },

 iitate:{
  name:"飯舘村",
  lat:37.616,
  lng:140.744,
  zoom:11
 },

 namie:{
  name:"浪江町",
  lat:37.494,
  lng:140.993,
  zoom:12
 },

 katsurao:{
  name:"葛尾村",
  lat:37.503,
  lng:140.765,
  zoom:12
 },

 futaba:{
  name:"双葉町",
  lat:37.449,
  lng:141.010,
  zoom:13
 },

 okuma:{
  name:"大熊町",
  lat:37.400,
  lng:140.985,
  zoom:13
 },

 tomioka:{
  name:"富岡町",
  lat:37.345,
  lng:141.008,
  zoom:13
 }

};


let marker=null;


function moveTo(
 lat,lng,zoom,name,color
){

 map.invalidateSize({
  pan:false
 });

 map.setView(
  [lat,lng],
  zoom,
  {
   animate:false
  }
 );


 if(marker){
  map.removeLayer(marker);
 }


 marker=L.circleMarker(
  [lat,lng],
  {
   radius:10,
   color:"#fff",
   weight:3,
   fillColor:color,
   fillOpacity:1
  }
 )
 .addTo(map)
 .bindPopup(name)
 .openPopup();

}


document
.querySelectorAll("[data-town]")
.forEach(function(btn){

 btn.addEventListener(
  "click",
  function(){

   const id=
   this.dataset.town;

   const t=
   towns[id];

   moveTo(
    t.lat,
    t.lng,
    t.zoom,
    t.name,
    "#1677ff"
   );


   status(

    "<b>🔵 "+
    t.name+
    "へ移動しました</b>"+

    '<div class="row red">'+
    "この市町村の一部に帰還困難区域が残っています。"+
    "</div>"+

    '<div class="row grey">'+
    "青い丸は市町村確認用の代表地点です。"+
    "</div>"

   );

  }

 );

});


/* =========================
 ROADS
========================= */

const roads={

 "114":{
  name:"国道114号・対象区間周辺",
  lat:37.62,
  lng:140.86,
  zoom:12
 },

 "49":{
  name:"県道49号・対象区間周辺",
  lat:37.60,
  lng:140.89,
  zoom:12
 },

 "35":{
  name:"県道35号・対象区間周辺",
  lat:37.46,
  lng:140.90,
  zoom:12
 },

 "288":{
  name:"国道288号・対象区間周辺",
  lat:37.42,
  lng:140.91,
  zoom:12
 },

 "252":{
  name:"県道252号等・対象区間周辺",
  lat:37.405,
  lng:140.993,
  zoom:14
 },

 "101":{
  name:"双葉町道101・109号周辺",
  lat:37.465,
  lng:141.000,
  zoom:14
 },

 "67":{
  name:"大熊町道東67号周辺",
  lat:37.386,
  lng:141.000,
  zoom:14
 }

};


document
.querySelectorAll("[data-road]")
.forEach(function(btn){

 btn.addEventListener(
  "click",
  function(){

   const r=
   roads[this.dataset.road];


   moveTo(
    r.lat,
    r.lng,
    r.zoom,
    r.name,
    "#df8500"
   );


   status(

    "<b>🟠 "+
    r.name+
    "</b>"+

    '<div class="row orange">'+
    "特別通過交通の対象道路周辺を表示しています。"+
    "</div>"+

    '<div class="row grey">'+
    "オレンジの丸は道路中心線ではありません。"+
    "</div>"

   );

  }

 );

});


/* =========================
 ALL
========================= */

document
.getElementById("allTowns")
.addEventListener(
 "click",
 function(){

  map.invalidateSize({
   pan:false
  });

  map.setView(
   [37.50,140.92],
   10,
   {animate:false}
  );


  status(

   "<b>🔴 帰還困難区域が残る7市町村</b>"+

   '<div class="row red">'+
   "南相馬市・飯舘村・浪江町・葛尾村・双葉町・大熊町・富岡町"+
   "</div>"

  );

 }
);


document
.getElementById("allRoads")
.addEventListener(
 "click",
 function(){

  status(

   "<b>🟠 特別通過交通・8区分</b>"+

   '<div class="row orange">'+
   "① 国道114号<br>"+
   "② 県道49号<br>"+
   "③ 大熊町道東15号～県道252号系統<br>"+
   "④ 県道252号<br>"+
   "⑤ 県道35号～国道288号<br>"+
   "⑥ 国道288号<br>"+
   "⑦ 双葉町道101・109号<br>"+
   "⑧ 大熊町道東67号～国道6号"+
   "</div>"

  );

 }
);


/* =========================
 GPS
========================= */

let gpsMarker=null;
let accuracyCircle=null;


function showGPS(p){

 const lat=
 p.coords.latitude;

 const lng=
 p.coords.longitude;

 const acc=
 p.coords.accuracy;


 if(gpsMarker)
  map.removeLayer(gpsMarker);

 if(accuracyCircle)
  map.removeLayer(accuracyCircle);


 gpsMarker=L.circleMarker(
  [lat,lng],
  {
   radius:10,
   color:"#fff",
   weight:3,
   fillColor:"#1677ff",
   fillOpacity:1
  }
 ).addTo(map);


 accuracyCircle=L.circle(
  [lat,lng],
  {
   radius:acc,
   color:"#1677ff",
   weight:1,
   fillOpacity:.08
  }
 ).addTo(map);


 map.invalidateSize({
  pan:false
 });


 map.setView(
  [lat,lng],
  16,
  {
   animate:false
  }
 );


 status(

  "<b>📍 現在地</b>"+

  '<div class="row blue">'+
  lat.toFixed(6)+
  ", "+
  lng.toFixed(6)+
  "<br>GPS精度 約±"+
  Math.round(acc)+
  "m"+
  "</div>"

 );

}


document
.getElementById("gps")
.addEventListener(
 "click",
 function(){

  navigator.geolocation
  .getCurrentPosition(

   showGPS,

   function(){
    status(
     "<b>現在地を取得できませんでした。</b>"
    );
   },

   {
    enableHighAccuracy:true,
    timeout:15000,
    maximumAge:1000
   }

  );

 }
);


/* =========================
 TRACK
========================= */

let tracking=false;
let watchId=null;


document
.getElementById("track")
.addEventListener(
 "click",
 function(){

  if(!tracking){

   tracking=true;

   this.textContent=
   "■ 追跡停止";

   this.style.background=
   "#a26b00";


   watchId=
   navigator.geolocation
   .watchPosition(

    showGPS,

    function(){},

    {
     enableHighAccuracy:true,
     maximumAge:2000
    }

   );


  }else{

   tracking=false;


   if(watchId!==null){

    navigator.geolocation
    .clearWatch(watchId);

   }


   watchId=null;

   this.textContent=
   "▶ 移動追跡";

   this.style.background=
   "#287a37";

  }

 }
);


/* =========================
 WIDE
========================= */

document
.getElementById("wide")
.addEventListener(
 "click",
 function(){

  map.invalidateSize({
   pan:false
  });

  map.setView(
   [37.50,140.92],
   10,
   {animate:false}
  );

  status(
   "<b>🗾 浜通り広域表示</b>"
  );

 }
);


/* =========================
 iPHONE SIZE FIX
========================= */

function fixMap(){

 map.invalidateSize({
  pan:false,
  debounceMoveend:true
 });

}


window.addEventListener(
 "load",
 function(){

  setTimeout(fixMap,100);
  setTimeout(fixMap,500);
  setTimeout(fixMap,1500);

 }
);


window.addEventListener(
 "orientationchange",
 function(){

  setTimeout(fixMap,500);

 }
);

</script>

</body>
</html>
