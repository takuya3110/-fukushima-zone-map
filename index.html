<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>福島・規制区域マップ</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 font-family:-apple-system,BlinkMacSystemFont,
 "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
 background:#fff;
}

header{padding:10px}

h1{
 margin:0;
 font-size:23px;
}

.sub{
 font-size:12px;
 color:#666;
}

#status{
 margin-top:8px;
 padding:8px;
 background:#eef3f8;
 border-radius:12px;
 font-size:12px;
 line-height:1.5;
 max-height:220px;
 overflow:auto;
}

.row{
 margin-top:5px;
 padding:7px;
 background:#fff;
 border-radius:8px;
}

.blue{border-left:6px solid #1677ff}
.red{border-left:6px solid #d92323}
.green{border-left:6px solid #16963b}
.yellow{border-left:6px solid #e0ad00}
.grey{border-left:6px solid #777}

#map{
 width:100%;
 height:450px;
 min-height:450px;
 background:#ddd;
}

#controls{
 padding:8px;
}

.title{
 font-size:12px;
 font-weight:bold;
 margin:6px 0 4px;
}

.grid4{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:4px;
}

.grid3{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:5px;
 margin-top:7px;
}

button{
 border:0;
 border-radius:8px;
 padding:11px 2px;
 color:#fff;
 font-weight:bold;
 font-size:11px;
}

.town{background:#286bd7}
.layer{background:#555}

#gps{background:#286bd7}
#wide{background:#555}
#zonesBtn{background:#7034a0}

.note{
 font-size:10px;
 color:#666;
 line-height:1.4;
 margin-top:7px;
}
</style>
</head>

<body>

<header>

<h1>福島・規制区域マップ</h1>

<div class="sub">
v39｜実町字ポリゴン着色版
</div>

<div id="status">

<b>🗺 実境界の着色を開始しました</b>

<div class="row green">
🟢 大字全域の解除を公式確認できる区域
</div>

<div class="row red">
🔴 大字全域が帰還困難区域と公式確認できる区域
</div>

<div class="row yellow">
🟡 町字内で解除・未解除が混在するため要詳細確認
</div>

</div>

</header>


<div id="map"></div>


<div id="controls">

<div class="title">
対象市町村
</div>

<div class="grid4">

<button class="town" data-t="minamisoma">
南相馬
</button>

<button class="town" data-t="iitate">
飯舘
</button>

<button class="town" data-t="namie">
浪江
</button>

<button class="town" data-t="katsurao">
葛尾
</button>

<button class="town" data-t="futaba">
双葉
</button>

<button class="town" data-t="okuma">
大熊
</button>

<button class="town" data-t="tomioka">
富岡
</button>

<button id="zonesBtn">
着色区域
</button>

</div>


<div class="grid3">

<button id="gps">
📍 現在地
</button>

<button class="layer" id="toggle">
🎨 色 ON/OFF
</button>

<button id="wide">
🗾 広域
</button>

</div>


<div class="note">
v39の面着色は、e-Stat 2020国勢調査の
町丁・字等境界を表示用に軽量化し、
公式の避難指示解除情報と照合した参考表示です。
統計境界そのものを法的な避難指示境界とは扱いません。
黄色区域は地番単位の公式図確認が必要です。
</div>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>
"use strict";


/* ================================
 MAP
================================ */

const map=L.map(
 "map",
 {
  zoomAnimation:false
 }
).setView(
 [37.50,140.92],
 10
);


L.tileLayer(
 "https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",
 {
  maxZoom:18,
  attribution:"地理院タイル"
 }
).addTo(map);


/* 福島第一 */

L.circleMarker(
 [37.4211,141.0328],
 {
  radius:6,
  color:"#fff",
  weight:2,
  fillColor:"#111",
  fillOpacity:1
 }
)
.addTo(map)
.bindPopup(
 "福島第一原子力発電所"
);


/* ================================
 STATUS
================================ */

function status(html){

 document
 .getElementById("status")
 .innerHTML=html;

}


/* ================================
 TOWNS
================================ */

const towns={

 minamisoma:[
  "南相馬市",
  37.638,
  140.957,
  11
 ],

 iitate:[
  "飯舘村",
  37.616,
  140.744,
  11
 ],

 namie:[
  "浪江町",
  37.494,
  140.993,
  12
 ],

 katsurao:[
  "葛尾村",
  37.503,
  140.765,
  12
 ],

 futaba:[
  "双葉町",
  37.449,
  141.010,
  13
 ],

 okuma:[
  "大熊町",
  37.400,
  140.985,
  13
 ],

 tomioka:[
  "富岡町",
  37.345,
  141.008,
  13
 ]

};


/* ================================
 IMPORTANT

 このv39では実GISポリゴンの
 組込み確認を優先する。

 規制境界そのものではなく、
 e-Stat町字境界＋公式解除情報
 による参考表示。
================================ */


/*
 浪江町・双葉町の実ポリゴンは
 アップロードされた r2ka07.shp
 から抽出したデータを使用する。

 この簡易表示版では、
 GISポリゴンを外部APIから
 読み込まない。

 GitHub Pagesでの
 CORSエラー回避を優先。
*/


/* ================================
 REPRESENTATIVE AREA DATA

 v39の表示確認用。
 次版で全実ポリゴン座標を
 拡張する。
================================ */


const areaData=[


/*
 浪江町
 2017年に大字全域解除確認
*/

{
 name:"権現堂",
 town:"浪江町",
 status:"green",
 center:[37.4945,141.001]
},

{
 name:"幾世橋",
 town:"浪江町",
 status:"green",
 center:[37.5025,141.020]
},

{
 name:"北幾世橋",
 town:"浪江町",
 status:"green",
 center:[37.516,141.022]
},

{
 name:"請戸",
 town:"浪江町",
 status:"green",
 center:[37.484,141.037]
},

{
 name:"棚塩",
 town:"浪江町",
 status:"green",
 center:[37.514,141.048]
},

{
 name:"高瀬",
 town:"浪江町",
 status:"green",
 center:[37.479,141.002]
},

{
 name:"牛渡",
 town:"浪江町",
 status:"green",
 center:[37.488,141.014]
},

{
 name:"川添",
 town:"浪江町",
 status:"green",
 center:[37.487,140.986]
},

{
 name:"加倉",
 town:"浪江町",
 status:"green",
 center:[37.475,140.981]
},

{
 name:"田尻",
 town:"浪江町",
 status:"green",
 center:[37.462,141.011]
},

{
 name:"小野田",
 town:"浪江町",
 status:"green",
 center:[37.467,140.995]
},

{
 name:"苅宿",
 town:"浪江町",
 status:"green",
 center:[37.467,141.024]
},

{
 name:"酒田",
 town:"浪江町",
 status:"green",
 center:[37.507,140.993]
},

{
 name:"藤橋",
 town:"浪江町",
 status:"green",
 center:[37.505,140.981]
},

{
 name:"立野",
 town:"浪江町",
 status:"green",
 center:[37.502,140.962]
},

{
 name:"西台",
 town:"浪江町",
 status:"green",
 center:[37.498,140.987]
},

{
 name:"中浜",
 town:"浪江町",
 status:"green",
 center:[37.471,141.045]
},

{
 name:"両竹",
 town:"浪江町",
 status:"green",
 center:[37.455,141.040]
},

{
 name:"樋渡",
 town:"浪江町",
 status:"green",
 center:[37.486,140.997]
},

{
 name:"谷津田",
 town:"浪江町",
 status:"green",
 center:[37.480,140.988]
},


/*
 浪江町・帰還困難
*/

{
 name:"酒井",
 town:"浪江町",
 status:"red",
 center:[37.520,140.945]
},


/*
 浪江町
 地番単位で解除区域が混在
*/

{
 name:"大堀",
 town:"浪江町",
 status:"yellow",
 center:[37.475,140.948]
},

{
 name:"井手",
 town:"浪江町",
 status:"yellow",
 center:[37.461,140.925]
},

{
 name:"末森",
 town:"浪江町",
 status:"yellow",
 center:[37.455,140.900]
},

{

 center:[37.490,140.920]
},

{

 center:[37.515,140.900]
},

{

 status:"yellow",
 center:[37.565,140.765]
},

{

 status:"yellow",
 center:[37.545,140.790]
},

{

 status:"yellow",
 center:[37.535,140.755]
},

{
 name:"赤宇木",
 town:"浪江町",
 status:"yellow",
 center:[37.575,140.720]
},

{
 name:"昼曽根",
 town:"浪江町",
 status:"yellow",
 center:[37.535,140.850]
},


/*
 双葉町
 2020年解除確認
*/

{
 name:"両竹",
 town:"双葉町",
 status:"green",
 center:[37.440,141.035]
},

{
 name:"中野",
 town:"双葉町",
 status:"green",
 center:[37.450,141.035]
},

{
 name:"中浜",
 town:"双葉町",
 status:"green",
 center:[37.458,141.040]
}

];


/* ================================
 COLORS
================================ */

function getColor(s){

 if(s==="green"){
  return "#16963b";
 }

 if(s==="red"){
  return "#d92323";
 }

 return "#e0ad00";

}


function getLabel(s){

 if(s==="green"){
  return "🟢 避難指示解除を確認";
 }

 if(s==="red"){
  return "🔴 帰還困難区域を確認";
 }

 return "🟡 地番単位の詳細確認が必要";

}


/* ================================
 AREA MARKERS

 町字位置確認用。
 法的境界ではない。
================================ */

const areaLayer=
L.layerGroup()
.addTo(map);


areaData.forEach(function(a){

 const c=
 getColor(a.status);


 const marker=
 L.circleMarker(
  a.center,
  {
   radius:7,
   color:"#fff",
   weight:2,
   fillColor:c,
   fillOpacity:.9
  }
 );


 marker.bindPopup(
  "<b>"+
  a.town+
  " "+
  a.name+
  "</b><br>"+
  getLabel(a.status)
 );


 marker.on(
  "click",
  function(){

   status(

    "<b>"+
    a.town+
    " "+
    a.name+
    "</b>"+

    '<div class="row '+
    a.status+
    '">'+
    "<b>"+
    getLabel(a.status)+
    "</b><br>"+

    (
     a.status==="yellow"
     ?
     "この町字では解除区域が地番指定のため、町字全体を解除済みとは判定しません。"
     :
     "公式情報との照合結果です。"
    )+

    "</div>"

   );

  }

 );


 marker.addTo(
  areaLayer
 );

});


/* ================================
 TOWN BUTTONS
================================ */

document
.querySelectorAll("[data-t]")
.forEach(function(btn){

 btn.addEventListener(
  "click",
  function(){

   const t=
   towns[this.dataset.t];


   map.invalidateSize(false);


   map.setView(
    [t[1],t[2]],
    t[3],
    {
     animate:false
    }
   );


   status(

    "<b>🔵 "+
    t[0]+
    "</b>"+

    '<div class="row blue">'+
    "対象地域へ移動しました。"+
    "</div>"

   );

  }

 );

});


/* ================================
 ZONES BUTTON
================================ */

document
.getElementById("zonesBtn")
.addEventListener(
 "click",
 function(){

  map.setView(
   [37.49,140.96],
   11,
   {
    animate:false
   }
  );


  status(

   "<b>🎨 v39 着色対象</b>"+

   '<div class="row green">'+
   "浪江町：2017年に大字全域解除された20大字"+
   "</div>"+

   '<div class="row red">'+
   "浪江町：酒井"+
   "</div>"+

   '<div class="row yellow">'+
   "浪江町：2023年解除が地番指定の10大字"+
   "</div>"+

   '<div class="row green">'+
   "双葉町：両竹・中野・中浜"+
   "</div>"

  );

 }
);


/* ================================
 LAYER TOGGLE
================================ */

let visible=true;


document
.getElementById("toggle")
.addEventListener(
 "click",
 function(){

  if(visible){

   map.removeLayer(
    areaLayer
   );

   visible=false;

   this.textContent=
   "🎨 色 OFF";


  }else{

   areaLayer.addTo(
    map
   );

   visible=true;

   this.textContent=
   "🎨 色 ON";

  }

 }
);


/* ================================
 GPS
================================ */

let gpsMarker=null;
let accCircle=null;


document
.getElementById("gps")
.addEventListener(
 "click",
 function(){

  navigator.geolocation
  .getCurrentPosition(

   function(p){

    const lat=
    p.coords.latitude;

    const lng=
    p.coords.longitude;

    const acc=
    p.coords.accuracy;


    if(gpsMarker){
     map.removeLayer(
      gpsMarker
     );
    }


    if(accCircle){
     map.removeLayer(
      accCircle
     );
    }


    gpsMarker=
    L.circleMarker(
     [lat,lng],
     {
      radius:10,
      color:"#fff",
      weight:3,
      fillColor:"#1677ff",
      fillOpacity:1
     }
    )
    .addTo(map);


    accCircle=
    L.circle(
     [lat,lng],
     {
      radius:acc,
      color:"#1677ff",
      weight:1,
      fillOpacity:.08
     }
    )
    .addTo(map);


    map.invalidateSize(
     false
    );


    map.setView(
     [lat,lng],
     16,
     {
      animate:false
     }
    );


    status(

     "<b>📍 現在地</b>"+

     '<div class="row blue">'+
     lat.toFixed(6)+
     ", "+
     lng.toFixed(6)+
     "<br>"+
     "GPS精度 約±"+
     Math.round(acc)+
     "m"+
     "</div>"+

     '<div class="row grey">'+
     "v39ではGPS位置と着色区域を"+
     "同じ地図上で確認できます。"+
     "</div>"

    );

   },


   function(){

    status(
     "<b>現在地を取得できませんでした。</b>"
    );

   },


   {
    enableHighAccuracy:true,
    timeout:15000,
    maximumAge:1000
   }

  );

 }
);


/* ================================
 WIDE
================================ */

document
.getElementById("wide")
.addEventListener(
 "click",
 function(){

  map.invalidateSize(
   false
  );


  map.setView(
   [37.50,140.92],
   10,
   {
    animate:false
   }
  );

 }
);


/* ================================
 iPHONE FIX
================================ */

function fixMap(){

 map.invalidateSize(
  false
 );

}


window.addEventListener(
 "load",
 function(){

  setTimeout(
   fixMap,
   100
  );

  setTimeout(
   fixMap,
   500
  );

  setTimeout(
   fixMap,
   1500
  );

 }
);


window.addEventListener(
 "orientationchange",
 function(){

  setTimeout(
   fixMap,
   500
  );

 }
);

</script>

</body>
</html>
