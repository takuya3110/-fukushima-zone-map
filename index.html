<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>福島・規制区域マップ</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html,body{
 margin:0;height:100%;
 font-family:-apple-system,BlinkMacSystemFont,
 "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}

#app{
 height:100%;
 display:flex;
 flex-direction:column;
}

header{
 padding:9px 11px;
 background:#fff;
 border-bottom:1px solid #ddd;
}

h1{margin:0;font-size:20px}

.sub{
 font-size:10px;
 color:#666;
 margin-top:2px;
}

#status{
 margin-top:7px;
 padding:8px;
 border-radius:10px;
 background:#eef3f8;
 font-size:11px;
 line-height:1.45;
}

.card{
 background:#fff;
 margin-top:5px;
 padding:6px 8px;
 border-radius:7px;
}

.red{border-left:5px solid #d92727}
.purple{border-left:5px solid #a02dc5}
.green{border-left:5px solid #18a83c}
.grey{border-left:5px solid #777}

.small{
 font-size:9px;
 color:#666;
}

#mapWrap{
 position:relative;
 flex:1;
 min-height:300px;
}

#map{width:100%;height:100%}

#panel{
 position:absolute;
 left:7px;right:7px;bottom:7px;
 z-index:1000;
 background:rgba(255,255,255,.96);
 border-radius:10px;
 padding:7px;
 box-shadow:0 2px 10px rgba(0,0,0,.28);
}

.panelTitle{
 font-size:10px;
 font-weight:bold;
 margin-bottom:5px;
}

.grid3{
 display:grid;
 grid-template-columns:1fr 1fr 1fr;
 gap:4px;
}

.grid2{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:4px;
 margin-top:4px;
}

button{
 border:0;
 border-radius:8px;
 padding:8px 2px;
 color:#fff;
 font-size:10px;
 font-weight:bold;
}

.zone{background:#75438d}
.zone.active{background:#a332c3}
#opacity{background:#607681}
#off{background:#555}

.bottom{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:5px;
 padding:6px;
 background:#fff;
 border-top:1px solid #ddd;
}

#gps{background:#1769e0}
#track{background:#08752e}
#official{background:#705500}
#reset{background:#555}

.note{
 grid-column:1/3;
 font-size:8px;
 line-height:1.4;
 color:#666;
}

.legend{
 background:rgba(255,255,255,.95);
 padding:6px;
 border-radius:7px;
 box-shadow:0 1px 5px rgba(0,0,0,.3);
 font-size:9px;
 line-height:1.5;
}
</style>
</head>

<body>

<div id="app">

<header>

<h1>福島・規制区域マップ</h1>

<div class="sub">
v29｜避難指示・特定帰還居住・立入規制を分離
</div>

<div id="status">

<b>📍 現在地を取得すると制度状態を表示します</b>

<div class="card grey">
<b>避難指示</b><br>
現在地未取得
</div>

<div class="card grey">
<b>特定帰還居住区域</b><br>
現在地未取得
</div>

<div class="card grey">
<b>立入規制</b><br>
現在地未取得
</div>

</div>

</header>


<div id="mapWrap">

<div id="map"></div>

<div id="panel">

<div class="panelTitle">
🗺 大熊町公式・2026年6月22日立入規制緩和図
</div>

<div class="grid3">

<button id="z1" class="zone"
onclick="showZone(1)">
① 野上・下野上
</button>

<button id="z2" class="zone"
onclick="showZone(2)">
② 熊2・熊3
</button>

<button id="z3" class="zone"
onclick="showZone(3)">
③ 熊2・町区
</button>

</div>

<div class="grid2">

<button id="opacity"
onclick="changeOpacity()">
👁 透明度45%
</button>

<button id="off"
onclick="hideImage()">
画像OFF
</button>

</div>

</div>

</div>


<div class="bottom">

<button id="gps">📍 現在地判定</button>
<button id="track">▶ 移動追跡</button>

<button id="official">🏛 公式情報</button>
<button id="reset">🗾 大熊町</button>

<div class="note">
⚠️ v29では制度上の状態を3項目に分離しました。
公式図の境界は地番境界そのものではないため、
位置だけから確定できない場合は「未判定」と表示します。
</div>

</div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================
 MAP
========================= */

const map=L.map("map").setView(
 [37.400,140.985],13
);

L.tileLayer(
 "https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",
 {
  attribution:"地理院タイル",
  maxZoom:18
 }
).addTo(map);


/* Fukushima Daiichi */

L.circleMarker(
 [37.4211,141.0328],
 {
  radius:5,
  color:"#fff",
  weight:2,
  fillColor:"#111",
  fillOpacity:1
 }
)
.addTo(map)
.bindPopup("福島第一原子力発電所");


/* =========================
 OFFICIAL MAPS
========================= */

const zones={

1:{
 name:"野上2区・下野上1区",
 image:
 "https://www.town.okuma.fukushima.jp/uploaded/image/18395.jpg",

 bounds:[
  [37.3990,140.9400],
  [37.4235,140.9850]
 ],

 view:[37.4115,140.9635],
 zoom:15
},

2:{
 name:"熊2区・熊3区の一部",
 image:
 "https://www.town.okuma.fukushima.jp/uploaded/image/18400.jpg",

 bounds:[
  [37.3690,140.9850],
  [37.4000,141.0250]
 ],

 view:[37.3845,141.0060],
 zoom:15
},

3:{
 name:"熊2区・町区の一部",
 image:
 "https://www.town.okuma.fukushima.jp/uploaded/image/18397.jpg",

 bounds:[
  [37.3680,140.9950],
  [37.3980,141.0320]
 ],

 view:[37.3830,141.0130],
 zoom:15
}

};


let overlay=null;
let activeZone=1;

const opacityList=[
 .25,.45,.65,.80
];

let opacityIndex=1;


function showZone(n){

 activeZone=n;

 const z=zones[n];

 if(overlay){
  map.removeLayer(overlay);
 }

 overlay=
 L.imageOverlay(
  z.image,
  z.bounds,
  {
   opacity:
   opacityList[opacityIndex],
   zIndex:450
  }
 );

 overlay.addTo(map);

 map.setView(
  z.view,
  z.zoom,
  {animate:false}
 );

 document
 .querySelectorAll(".zone")
 .forEach(
  b=>b.classList.remove("active")
 );

 document
 .getElementById("z"+n)
 .classList.add("active");

}


function changeOpacity(){

 opacityIndex=
 (opacityIndex+1)%
 opacityList.length;

 const o=
 opacityList[opacityIndex];

 if(overlay){
  overlay.setOpacity(o);
 }

 document
 .getElementById("opacity")
 .innerHTML=
 "👁 透明度"+
 Math.round(o*100)+"%";

}


function hideImage(){

 if(overlay){

  map.removeLayer(overlay);
  overlay=null;

 }

}


/* =========================
 GSI REVERSE GEOCODER
========================= */

async function address(lat,lng){

 try{

  const url=
  "https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress"+
  "?lat="+lat+
  "&lon="+lng;

  const r=await fetch(url);
  const j=await r.json();

  if(!j.results) return null;

  return{
   muni:String(
    j.results.muniCd||""
   ),
   town:
    j.results.lv01Nm||""
  };

 }catch(e){

  return null;

 }

}


/* =========================
 CONSERVATIVE CLASSIFICATION

 Important:
 Only classifications that can
 safely be made from public
 administrative/address info.

 Mixed districts remain unknown.
========================= */

function classifyOkuma(ad){

 const town=
 ad ? ad.town : "";


 /*
 Clearly released-side
 address names.

 These are deliberately
 conservative.
 */

 const releasedWords=[
  "大川原",
  "中屋敷"
 ];


 let released=false;

 releasedWords.forEach(w=>{

  if(town.includes(w)){
   released=true;
  }

 });


 /*
 We do NOT classify mixed
 administrative districts
 automatically.
 */

 if(released){

  return{

   evacuation:
   "🟢 避難指示解除区域",

   evacuationClass:
   "green",

   slar:
   "― 特定帰還居住区域ではないと考えられる",

   slarClass:
   "grey",

   entry:
   "🟢 通常の立入りが可能な解除区域",

   entryClass:
   "green",

   confidence:
   "住所情報から保守的に判定"

  };

 }


 return{

  evacuation:
  "⚠️ 未判定",

  evacuationClass:
  "grey",

  slar:
  "⚠️ 未判定",

  slarClass:
  "grey",

  entry:
  "⚠️ 未判定",

  entryClass:
  "grey",

  confidence:
  "大熊町内は行政区の一部だけ解除・指定されている場所があるため、住所名だけでは判定しません"

 };

}


/* =========================
 STATUS
========================= */

function card(
 title,
 text,
 cls
){

 return(
  '<div class="card '+cls+'">'+
  '<b>'+title+'</b><br>'+
  text+
  '</div>'
 );

}


async function evaluate(
 lat,lng,accuracy
){

 const ad=
 await address(lat,lng);


 let locationText=
 lat.toFixed(6)+
 ", "+
 lng.toFixed(6);


 if(ad){

  if(ad.muni==="07545"){

   locationText=
   "大熊町 "+
   ad.town+
   "<br>"+
   locationText;

  }

 }


 /*
 Outside Okuma:
 v29 does not attempt
 other municipalities yet.
 */

 if(!ad || ad.muni!=="07545"){

  document
  .getElementById("status")
  .innerHTML=

  "<b>📍 "+
  locationText+
  "</b>"+

  card(
   "避難指示",
   "⚠️ v29では大熊町のみ判定対象",
   "grey"
  )+

  card(
   "特定帰還居住区域",
   "⚠️ 未判定",
   "grey"
  )+

  card(
   "立入規制",
   "⚠️ 未判定",
   "grey"
  );

  return;

 }


 const r=
 classifyOkuma(ad);


 document
 .getElementById("status")
 .innerHTML=

 "<b>📍 "+
 locationText+
 "</b>"+

 card(
  "避難指示",
  r.evacuation,
  r.evacuationClass
 )+

 card(
  "特定帰還居住区域",
  r.slar,
  r.slarClass
 )+

 card(
  "立入規制",
  r.entry,
  r.entryClass
 )+

 '<div class="small">'+
 'GPS精度 約±'+
 Math.round(accuracy)+
 'm<br>'+
 r.confidence+
 '</div>';

}


/* =========================
 GPS
========================= */

let gpsMarker=null;
let accuracyCircle=null;


function drawGPS(
 pos,
 follow
){

 const lat=
 pos.coords.latitude;

 const lng=
 pos.coords.longitude;

 const acc=
 pos.coords.accuracy;


 if(gpsMarker)
  map.removeLayer(gpsMarker);

 if(accuracyCircle)
  map.removeLayer(accuracyCircle);


 gpsMarker=
 L.circleMarker(
  [lat,lng],
  {
   radius:9,
   color:"#fff",
   weight:3,
   fillColor:"#1677ff",
   fillOpacity:1
  }
 )
 .addTo(map);


 accuracyCircle=
 L.circle(
  [lat,lng],
  {
   radius:acc,
   color:"#1677ff",
   weight:1,
   fillColor:"#1677ff",
   fillOpacity:.08
  }
 )
 .addTo(map);


 if(follow){

  map.setView(
   [lat,lng],
   16
  );

 }


 evaluate(
  lat,lng,acc
 );

}


/* GPS button */

document
.getElementById("gps")
.onclick=()=>{

 document
 .getElementById("status")
 .innerHTML=
 "<b>📍 現在地を取得しています…</b>";


 navigator.geolocation
 .getCurrentPosition(

  p=>drawGPS(p,true),

  ()=>{

   document
   .getElementById("status")
   .innerHTML=
   "<b>現在地を取得できませんでした。</b>";

  },

  {
   enableHighAccuracy:true,
   timeout:15000,
   maximumAge:1000
  }

 );

};


/* =========================
 TRACKING
========================= */

let tracking=false;
let watchId=null;


document
.getElementById("track")
.onclick=()=>{

 const b=
 document.getElementById("track");


 if(!tracking){

  tracking=true;

  b.innerHTML=
  "■ 追跡停止";

  b.style.background=
  "#a26b00";


  watchId=
  navigator.geolocation
  .watchPosition(

   p=>drawGPS(p,true),

   ()=>{},

   {
    enableHighAccuracy:true,
    timeout:20000,
    maximumAge:2000
   }

  );


 }else{

  tracking=false;

  if(watchId!==null){

   navigator.geolocation
   .clearWatch(watchId);

  }

  watchId=null;

  b.innerHTML=
  "▶ 移動追跡";

  b.style.background=
  "#08752e";

 }

};


/* =========================
 OTHER BUTTONS
========================= */

document
.getElementById("official")
.onclick=()=>{

 window.open(
  "https://www.town.okuma.fukushima.jp/soshiki/kankyoutaisaku/34555.html",
  "_blank"
 );

};


document
.getElementById("reset")
.onclick=()=>{

 map.setView(
  [37.400,140.985],
  13
 );

};


/* =========================
 MAP TAP

 Useful before physically
 visiting the location.
========================= */

let tapMarker=null;


map.on(
 "click",
 async e=>{

  const lat=e.latlng.lat;
  const lng=e.latlng.lng;


  if(tapMarker)
   map.removeLayer(tapMarker);


  tapMarker=
  L.circleMarker(
   [lat,lng],
   {
    radius:7,
    color:"#fff",
    weight:2,
    fillColor:"#e58a00",
    fillOpacity:1
   }
  )
  .addTo(map);


  await evaluate(
   lat,lng,0
  );

 }
);


/* =========================
 LEGEND
========================= */

const legend=
L.control({
 position:"topright"
});


legend.onAdd=function(){

 const d=
 L.DomUtil.create(
  "div",
  "legend"
 );

 d.innerHTML=

 "<b>v29</b><br>"+
 "🔴 帰還困難<br>"+
 "🟣 特定帰還居住<br>"+
 "🟩 立入規制緩和<br>"+
 "🟢 避難指示解除<br>"+
 "🔵 GPS<br>"+
 "<hr style='margin:4px 0'>"+
 "制度を分離して判定";

 return d;

};


legend.addTo(map);


/* =========================
 START
========================= */

setTimeout(
 ()=>showZone(1),
 350
);

</script>

</body>
</html>
