/* =========================================
   REVERSE GEOCODER
========================================= */

async function reverseGeocode(lat,lng){

 try{

  const url=
   "https://mreversegeocoder.gsi.go.jp/reverse-geocoder/"+
   "LonLatToAddress?lat="+
   encodeURIComponent(lat)+
   "&lon="+
   encodeURIComponent(lng);

  const r=
   await fetch(url);

  if(!r.ok)
   throw new Error();

  const j=
   await r.json();

  if(!j.results)
   return null;

  return{
   code:String(j.results.muniCd || ""),
   town:j.results.lv01Nm || ""
  };

 }catch(e){

  return null;

 }

}


/* =========================================
   RULE MATCH
========================================= */

function matchRule(rules,code,town){

 const rule=
  rules[code];

 if(!rule || !town)
  return null;

 const hit=
  rule.words.find(
   word=>town.indexOf(word)!==-1
  );

 if(!hit)
  return null;

 return{
  hit:hit,
  text:rule.text
 };

}


/* =========================================
   DISPLAY STATE
========================================= */

let currentMarker=null;
let selectedMarker=null;
let accuracyCircle=null;

let watchId=null;
let tracking=false;

let currentOfficial=
 "https://www.pref.fukushima.lg.jp/sec/11050a/";

let currentEntry=

const trackButton=

/* =========================================
   EVALUATE POINT
========================================= */

async function evaluatePoint(
 lat,
 lng,
 source,
 accuracy=null
){

 status.innerHTML=
  "<b>住所と区域情報を確認しています…</b>";

 status.style.background=
  "#eef3f8";


 const ad=
  await reverseGeocode(lat,lng);


 const code=
  ad ? ad.code : "";

 const town=
  ad ? ad.town : "";


 currentCode=
  code;


 const muni=
  municipalities[code];


 if(muni){

  currentOfficial=
   muni.official;

  currentEntry=
   muni.entry;

 }else{

  currentOfficial=
   "https://www.pref.fukushima.lg.jp/sec/11050a/";

  currentEntry=
   "https://www.meti.go.jp/earthquake/nuclear/kinkyu.html";

 }


 const difficult=
  matchRule(
   difficultRules,
   code,
   town
  );


 const relaxed=
  matchRule(
   relaxedRules,
   code,
   town
  );


 let evacuationHTML="";

 let entryHTML="";

 let trafficHTML="";


 /* ---------- 避難指示 ---------- */

 if(!muni){

    </span>
    </div>`;

 }else{

   `<div class="resultRow">
    <div class="resultTitle">

    </div>

    </div>`;

 /* ---------- 立入規制 ---------- */

 if(relaxed){

   `<div class="resultRow">

/* =========================================
   GPS
========================================= */

async function showGPS(pos,follow){

 const lat=
  pos.coords.latitude;

 const lng=
  pos.coords.longitude;

 const acc=
  pos.coords.accuracy;


 if(currentMarker)
  map.removeLayer(currentMarker);

 if(accuracyCircle)
  map.removeLayer(accuracyCircle);


 currentMarker=
  L.circleMarker(
   [lat,lng],
   {
    radius:9,
    color:"white",
    weight:3,
    fillColor:"#1769e0",
    fillOpacity:1
   }
  )
  .addTo(map);


 accuracyCircle=
  L.circle(
   [lat,lng],
   {
    radius:acc,
    color:"#1769e0",
    weight:1,
    fillOpacity:.07
   }
  )
  .addTo(map);


 if(follow){

  map.setView(
   [lat,lng],
   16
  );

 }


 await evaluatePoint(
  lat,
  lng,
  "gps",
  acc
 );

}


document
.getElementById("gps")
.onclick=()=>{

 status.innerHTML=
  "<b>現在地を取得しています…</b>";


 navigator.geolocation.getCurrentPosition(

  p=>showGPS(p,true),

  ()=>{

   status.innerHTML=
    "<b>現在地を取得できませんでした。</b>";

  },

  {
   enableHighAccuracy:true,
   timeout:15000,
   maximumAge:2000
  }

 );

};


/* =========================================
   TRACK
========================================= */

trackButton.onclick=()=>{

 if(!tracking){

  tracking=true;

  trackButton.innerHTML=
   "■ 追跡停止";

  trackButton.style.background=
   "#a06400";


  watchId=
   navigator.geolocation.watchPosition(

    p=>showGPS(p,true),

    ()=>{},

    {
     enableHighAccuracy:true,
     maximumAge:3000,
     timeout:20000
    }

   );

 }else{

  tracking=false;

  if(watchId!==null){

   navigator.geolocation.clearWatch(
    watchId
   );

  }


  watchId=null;

  trackButton.innerHTML=
   "▶ 移動追跡";

  trackButton.style.background=
   "#08752e";

 }

};

  const lat=e.latlng.lat;

  if(selectedMarker)
   map.removeLayer(selectedMarker);


  selectedMarker=
   L.marker(
    [lat,lng]

   .addTo(map)
   .bindPopup(
    "<b>調べる地点</b>"
   )
   .openPopup();


  await evaluatePoint(
   lat,
   lng,
   "tap"

 }

document
.getElementById("traffic")
.onclick=()=>{

 const box=
  document.getElementById(
   "trafficBox"
  );

 const text=
  document.getElementById(
   "trafficText"
  );


 if(trafficInfo[currentCode]){

  text.innerHTML=

   `<b>🚗 特別通過交通</b><br><br>`+

   trafficInfo[currentCode]+

   `<br><br>
   <b>注意：</b>
   地点が同じ市町村にあるだけでは、
   現在走行している道路が対象路線とは判定できません。
   実際の道路標識とMETI公式情報を確認してください。`;

 }else{

  text.innerHTML=

   `<b>🚗 特別通過交通</b><br><br>
   現在選択している地点について、
   このアプリで表示できる個別ルート情報はありません。`;

 }


 box.style.display=
  "block";

};


document
.getElementById("trafficClose")
.onclick=()=>{

 document
 .getElementById("trafficBox")
 .style.display=
  "none";

};
