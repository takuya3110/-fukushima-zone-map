<header>

<h1>福島・帰還困難区域チェッカー</h1>

<div class="sub">
現在地と帰還困難区域の参考GIS境界を地図上で確認できます。
</div>

<div id="status">
「現在地」を押してください。
</div>

</header>

<div id="map"></div>

<div class="controls">

📍 現在地
</button>

</button>

<button id="officialButton">
🗺 福島県公式区域図を見る
</button>

<div class="note">
※ 赤色は公開研究データに収録された旧帰還困難区域のGIS境界です。
2026年現在の法的境界そのものではありません。
特定復興再生拠点区域等の解除後の最新区域については公式資料を優先してください。
</div>

</div>

</div>


<div id="officialPanel">

<div class="panel">

<div class="panelHead">
<strong>福島県公式 避難指示区域図</strong>
<button id="closeButton">閉じる</button>
</div>

<img
id="officialImage"
src="https://www.pref.fukushima.lg.jp/img/portal2023/en131-202506.webp"
alt="福島県公式避難指示区域図"
/>

<div class="panelText">

現在の帰還困難区域を確認するための公式資料です。<br><br>

赤いGIS区域はこの図と完全には一致しません。
境界付近・立入可否については必ず国・自治体の最新情報を確認してください。

</div>

</div>

</div>

{
  attribution: "地理院タイル",
  maxZoom: 18
}
).addTo(map);

const zonePoints =
zoneText
.replace(/\n/g,"")
.split(";")
.map(function(p) {
  const a = p.split(",");
  return [
    Number(a[0]),
    Number(a[1])
  ];
});


const zoneLayer =
L.polygon(
  zonePoints,
  {
    color: "#b00020",
    weight: 2,
    fillColor: "#e32636",
    fillOpacity: 0.24,
    dashArray: "6,4"
  }
)
.addTo(map)
.bindPopup(
  "<b>旧・帰還困難区域 参考GIS境界</b><br>" +
  "公開研究データから作成。<br>" +
  "2026年現在の公式境界ではありません。"
);



/* 福島第一 */

const daiichi = [37.4211,141.0328];

L.circleMarker(
  daiichi,
  {
    radius: 8,
    color: "white",
    weight: 2,
    fillColor: "#111",
    fillOpacity: 1
  }
)
.addTo(map)
.bindPopup(
  "<b>福島第一原子力発電所</b>"
);



let userMarker = null;
let accuracyCircle = null;

const status =
document.getElementById("status");



function pointInPolygon(lat,lng,polygon) {

  let inside = false;

  for (
    let i = 0, j = polygon.length - 1;
    i < polygon.length;
    j = i++
  ) {

    const yi = polygon[i][0];
    const xi = polygon[i][1];

    const yj = polygon[j][0];
    const xj = polygon[j][1];

    const intersect =
      ((yi > lat) !== (yj > lat)) &&
      (
        lng <
        (xj - xi) *
        (lat - yi) /
        (yj - yi) +
        xi
      );

    if (intersect) {
      inside = !inside;
    }
  }

  return inside;
}



document
.getElementById("gpsButton")
.addEventListener(
"click",
function() {

  status.innerHTML =
  "現在地を取得しています…";

  navigator.geolocation.getCurrentPosition(

    function(pos) {

      const lat =
      pos.coords.latitude;

      const lng =
      pos.coords.longitude;

      const acc =
      pos.coords.accuracy;


      if (userMarker) {
        map.removeLayer(userMarker);
      }

      if (accuracyCircle) {
        map.removeLayer(accuracyCircle);
      }


      userMarker =
      L.circleMarker(
        [lat,lng],
        {
          radius: 9,
          color: "white",
          weight: 3,
          fillColor: "#1769e0",
          fillOpacity: 1
        }
      )
      .addTo(map);


      accuracyCircle =
      L.circle(
        [lat,lng],
        {
          radius: acc,
          color: "#1769e0",
          weight: 1,
          fillOpacity: 0.07
        }
      )
      .addTo(map);


      const inside =
      pointInPolygon(
        lat,
        lng,
        zonePoints
      );


      if (inside) {

        status.innerHTML =
        "⚠️ 旧DTRZ参考境界では区域内です。<br>" +
        "ただし2026年現在は解除済みの場所を含む可能性があります。公式区域図を確認してください。";

      } else {

        status.innerHTML =
        "✓ 旧DTRZ参考境界では区域外です。<br>" +
        "2026年現在の法的な区域判定を保証するものではありません。";

      }


      map.setView(
        [lat,lng],
        15
      );

      userMarker
      .bindPopup(
        "<b>現在地</b><br>" +
        lat.toFixed(6) +
        ", " +
        lng.toFixed(6) +
        "<br>GPS精度 約" +
        Math.round(acc) +
        "m"
      )
      .openPopup();

    },

    function() {

      status.innerHTML =
      "現在地を取得できませんでした。位置情報設定を確認してください。";

    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 3000
    }

  );

}
);

.addEventListener(

function() {

  map.fitBounds(
    zoneLayer.getBounds(),
    {
      padding: [15,15]
    }

"click",

.addEventListener(
"click",
function() {

  .style.display = "none";

}

  position: "bottomright"
});

  const div =
  L.DomUtil.create(
    "div",
    "legend"
  );

  div.innerHTML =
  '<span style="color:#1769e0;font-size:18px">●</span> 現在地<br>' +
  '<span style="color:#e32636;font-size:18px">■</span> 旧DTRZ参考境界<br>' +
  '<span style="color:#111;font-size:18px">●</span> 福島第一';

  return div;

};
