<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>福島・帰還困難区域チェッカー</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html,body{
 margin:0;height:100%;
 font-family:-apple-system,BlinkMacSystemFont,
 "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
#app{height:100%;display:flex;flex-direction:column}

header{
 background:#fff;padding:7px 9px;
 border-bottom:1px solid #ddd;z-index:1000
}
h1{margin:0;font-size:18px}
.sub{font-size:10px;color:#666;margin-top:2px}

#status{
 margin-top:6px;padding:7px;border-radius:9px;
 background:#eef3f8;font-size:11px;line-height:1.35
}
.place{font-weight:700;font-size:13px;margin-bottom:4px}
.row{
 background:white;border-radius:7px;
 padding:5px 7px;margin-top:4px
}
.row b{font-size:12px}
.detail{display:block;color:#555;font-size:10px;margin-top:2px}
.badge{
 display:inline-block;border-radius:10px;
 padding:2px 6px;margin-top:3px;
 font-size:9px;font-weight:700
}
.green{background:#def3e3;color:#176b2d}
.red{background:#ffe0e4;color:#a00018}
.orange{background:#fff0c7;color:#795000}
.purple{background:#eee2f5;color:#63317a}
.coords{font-size:9px;color:#777;margin-top:5px}

#map{flex:1;min-height:280px}

.controls{
 display:grid;grid-template-columns:1fr 1fr;
 gap:5px;padding:6px;background:#fff;
 border-top:1px solid #ddd
}
button{
 border:0;border-radius:8px;padding:9px 3px;
 font-size:11px;font-weight:600;color:white
}
#gps{background:#1769e0}
#track{background:#08752e}
#municipal{background:#a05a00}
#entry{background:#b24600}
#traffic{background:#006d77}
#official{background:#444}
#meti{background:#62509b}
#returnArea{background:#6e3b8e}

.note{
 grid-column:1/3;font-size:8px;color:#666;
 line-height:1.35
}

#trafficBox{
 display:none;position:absolute;left:10px;right:10px;
 bottom:90px;z-index:2000;background:white;padding:12px;
 border-radius:10px;box-shadow:0 3px 14px rgba(0,0,0,.35);
 max-height:45%;overflow:auto;font-size:12px;line-height:1.5
}
#trafficClose{width:100%;margin-top:8px;background:#555}

.legend{
 background:white;padding:6px 8px;font-size:9px;
 line-height:1.5;box-shadow:0 1px 5px rgba(0,0,0,.3);
 border-radius:5px
}
</style>
</head>

<body>

<div id="app">

<header>
<h1>福島・帰還困難区域チェッカー</h1>
<div class="sub">
v21｜避難指示・帰還居住区域・立入規制を分離表示
</div>

<div id="status">
<b>📍現在地を押すか、地図上をタップしてください。</b>
</div>
</header>

<div id="map"></div>

<div id="trafficBox">
 <div id="trafficText"></div>
 <button id="trafficClose">閉じる</button>
</div>

<div class="controls">

<button id="gps">📍 現在地</button>
<button id="track">▶ 移動追跡</button>

<button id="municipal">🏛 自治体公式</button>
<button id="entry">🚧 立入規制</button>

<button id="traffic">🚗 通過交通</button>
<button id="official">🗺 福島県公式</button>

<button id="meti">📋 METI最新</button>
<button id="returnArea">🟣 帰還居住区域</button>

<div class="note">
🟢＝解除を確認できる住所　
🔴＝帰還困難区域またはそれを含む地区　
🟠＝境界未確定　
🟣＝特定帰還居住区域・立入規制緩和に関係。<br>
特定帰還居住区域や立入規制緩和区域は
「避難指示解除済み」という意味ではありません。
</div>

</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* ================= MAP ================= */

const map=L.map("map").setView([37.47,140.93],10);

L.tileLayer(
 "https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",
 {attribution:"地理院タイル",maxZoom:18}
).addTo(map);

L.circleMarker([37.4211,141.0328],{
 radius:7,color:"white",weight:2,
 fillColor:"#111",fillOpacity:1
}).addTo(map)
.bindPopup("<b>福島第一原子力発電所</b>");

/* ================= MUNICIPALITIES ================= */

const municipalities={

 "07212":{
  name:"南相馬市",
  official:"https://www.city.minamisoma.lg.jp/portal/sections/12/1240/12401/genshiryokusaigaikuiki/1424.html",
  entry:"https://www.meti.go.jp/earthquake/nuclear/kinkyu.html"
 },

 "07543":{
  name:"富岡町",
  official:"https://www.tomioka-town.jp/",
  entry:"https://www.tomioka-town.jp/soshiki/anzentaisaku/1153.html"
 },

 "07545":{
  name:"大熊町",
  official:"https://www.town.okuma.fukushima.jp/soshiki/somu/1534.html",
  entry:"https://www.meti.go.jp/earthquake/nuclear/kinkyu/hinanshiji/2026/260615ookumamachi-tachiirikiseikanwa.html"
 },

 "07546":{
  name:"双葉町",
  official:"https://www.town.fukushima-futaba.lg.jp/",
  entry:"https://www.meti.go.jp/earthquake/nuclear/kinkyu.html"
 },

 "07547":{
  name:"浪江町",
  official:"https://www.town.namie.fukushima.jp/soshiki/2/34026.html",
  entry:"https://www.town.namie.fukushima.jp/soshiki/1/19635.html"
 },

 "07548":{
  name:"葛尾村",
  official:"https://www.katsurao.org/",
  entry:"https://www.meti.go.jp/earthquake/nuclear/kinkyu.html"
 },

 "07564":{
  name:"飯舘村",
  official:"https://www.vill.iitate.fukushima.jp/",
  entry:"https://www.meti.go.jp/earthquake/nuclear/20250331iitatemura-tachiirikiseikanwa.html"
 }

};

/* ================= 解除を確実に確認 ================= */

const releasedWords={

 "07545":[
  "中屋敷",
  "大川原"
 ],

 "07546":[
  "両竹",
  "中野",
  "中浜"
 ],

 "07547":[
  "立野","藤橋","西台","酒田","苅宿",
  "棚塩","北幾世橋","幾世橋","権現堂","請戸",
  "中浜","両竹","高瀬","牛渡","川添",
  "樋渡","谷津田","加倉","田尻","小野田"
 ],

 "07548":[
  "大字落合"
 ]

};

/* ================= 全域帰還困難 ================= */

const definiteDifficult={
 "07547":["酒井"]
};

/* ================= 帰還困難区域混在 ================= */

const difficultRules={

 "07212":{
  words:["小高区金谷"],
  text:"小高区金谷の一部に現在も帰還困難区域があります。"
 },

 "07543":{
  words:["小良ヶ浜","深谷"],
  text:"小良ヶ浜・深谷地区に帰還困難区域が残っています。"
 },

 "07545":{
  words:["野上","下野上","熊","夫沢","小入野"],
  text:"帰還困難区域、解除済み区域、特定帰還居住区域等が混在します。"
 },

 "07546":{
  words:[
   "下長塚","三字","羽鳥","石熊",
   "山田","細谷","寺松","渋川","鴻草"
  ],
  text:"帰還困難区域、解除済み区域等が混在します。"
 },

 "07547":{
  words:[
   "井手","小丸","大堀","室原","末森",
   "津島","南津島","下津島","赤宇木",
   "川房","昼曽根","羽附"
  ],
  text:"帰還困難区域と解除済み区域等が混在します。"
 },

 "07548":{
  words:["野行","柏原","大字葛尾"],
  text:"帰還困難区域と解除済み区域等が混在します。"
 },

 "07564":{
  words:["長泥"],
  text:"長泥地区には帰還困難区域と解除済み区域が混在します。"
 }

};

/* ================= 特定帰還居住区域 ================= */

const residenceRules={

 "07545":{
  words:[
   "下野上","野上","熊",
   "熊川","夫沢"
  ],
  text:
  "大熊町では2026年3月の変更認定を含め、"+
  "この地区の一部に特定帰還居住区域があります。"+
  "現在は避難指示解除に向けて整備中です。"
 },

 "07546":{
  words:[
   "下長塚","羽鳥","三字",
   "石熊","山田"
  ],
  text:
  "双葉町ではこの地区の一部に特定帰還居住区域があります。"
 },

 "07547":{
  words:[
   "大堀","井手","室原","末森",
   "津島","南津島","下津島",
   "赤宇木","羽附"
  ],
  text:
  "浪江町ではこの地区の一部に特定帰還居住区域があります。"
 },

 "07543":{
  words:[
   "小良ヶ浜","深谷"
  ],
  text:
  "富岡町ではこの地区の一部に特定帰還居住区域があります。"
 },

 "07548":{
  words:[
   "小出谷","野行","柏原"
  ],
  text:
  "葛尾村ではこの地区の一部に特定帰還居住区域があります。"
 },

 "07564":{
  words:[
   "長泥"
  ],
  text:
  "飯舘村の長泥地区では帰還・復興に向けた区域整備が続いています。"
 }

};

/* ================= 立入規制緩和 ================= */

const relaxedRules={

 "07545":{
  words:["下野上","野上","熊"],
  text:
  "2026年6月22日から、下野上1区・野上2区、"+
  "熊2・3区、町区の各一部で立入規制が緩和されています。"
 },

 "07546":{
  words:["下長塚","羽鳥","三字"],
  text:
  "この地区の一部に立入規制緩和区域があります。"
 },

 "07547":{
  words:["津島","南津島"],
  text:
  "この地区の一部に立入規制緩和区域があります。"
 },

 "07564":{
  words:["長泥"],
  text:
  "長泥地区の一部に立入規制緩和区域があります。"
 }

};

/* ================= TRAFFIC ================= */

const trafficInfo={

 "07212":
 "南相馬市周辺には帰還困難区域に関係する通行ルートがあります。",

 "07543":
 "富岡町では道路によって通行条件が異なります。",

 "07545":
 "大熊町には特別通過交通の対象道路があります。",

 "07546":
 "双葉町には特別通過交通の対象道路があります。",

 "07547":
 "浪江町周辺には特別通過交通に関係する道路があります。",

 "07548":
 "葛尾村では道路ごとの最新通行規制を確認してください。",

 "07564":
 "飯舘村では道路ごとの最新通行規制を確認してください。"

};

/* ================= GEOCODER ================= */

async function reverseGeocode(lat,lng){

 try{

  const url=
   "https://mreversegeocoder.gsi.go.jp/reverse-geocoder/"+
   "LonLatToAddress?lat="+encodeURIComponent(lat)+
   "&lon="+encodeURIComponent(lng);

  const r=await fetch(url);

  if(!r.ok) throw new Error();

  const j=await r.json();

  if(!j.results) return null;

  return{
   code:String(j.results.muniCd||""),
   town:j.results.lv01Nm||""
  };

 }catch(e){

  return null;

 }

}

/* ================= MATCH ================= */

function match(town,words){

 if(!town || !words) return null;

 return words.find(
  w=>town.indexOf(w)!==-1
 ) || null;

}

/* ================= EVACUATION ================= */

function evacuationResult(code,town){

 if(!municipalities[code]){

  return{
   type:"released",
   icon:"🟢",
   title:"帰還困難区域が残る7市町村の外",
   text:"市町村レベルで帰還困難区域の対象外です。"
  };

 }

 /* 南相馬市 */

 if(
  code==="07212" &&
  town &&
  town.indexOf("小高区金谷")===-1
 ){

  return{
   type:"released",
   icon:"🟢",
   title:"公表されている残存地区外",
   text:
   "南相馬市が帰還困難区域として公表している"+
   "小高区金谷の該当地区には一致しません。"
  };

 }

 /* 飯舘村 */

 if(
  code==="07564" &&
  town &&
  town.indexOf("長泥")===-1
 ){

  return{
   type:"released",
   icon:"🟢",
   title:"避難指示解除側",
   text:"現在帰還困難区域が残る長泥地区には一致しません。"
  };

 }

 const release=
  match(town,releasedWords[code]);

 if(release){

  return{
   type:"released",
   icon:"🟢",
   title:"避難指示解除を確認",
   text:
   "「"+release+"」は公式情報から解除側であることを確認できます。"
  };

 }

 const definite=
  match(town,definiteDifficult[code]);

 if(definite){

  return{
   type:"difficult",
   icon:"🔴",
   title:"帰還困難区域を確認",
   text:
   "「"+definite+"」は大字全域が帰還困難区域として扱われます。"
  };

 }

 const rule=difficultRules[code];

 if(rule){

  const hit=match(town,rule.words);

  if(hit){

   return{
    type:"mixed",
    icon:"🔴",
    title:"帰還困難区域を含む地区",
    text:
    "「"+hit+"」に一致。"+
    rule.text+
    " 選択地点そのものは境界確認が必要です。"
   };

  }

 }

 return{
  type:"unknown",
  icon:"🟠",
  title:"区域境界の確認が必要",
  text:
  "住所情報だけでは、この地点が帰還困難区域か確定できません。"
 };

}

/* ================= RESIDENCE ================= */

function residenceResult(code,town){

 const rule=residenceRules[code];

 if(!rule){

  return{
   active:false,
   title:"特定帰還居住区域",
   text:"この住所から該当を確認していません。"
  };

 }

 const hit=match(town,rule.words);

 if(hit){

  return{
   active:true,
   title:"特定帰還居住区域が存在する地区",
   text:
   "「"+hit+"」に一致。"+
   rule.text+
   " 地区全体が区域という意味ではありません。"
  };

 }

 return{
  active:false,
  title:"特定帰還居住区域",
  text:"取得した地区名では該当を確認していません。"
 };

}

/* ================= ENTRY ================= */

function entryResult(code,town){

 const rule=relaxedRules[code];

 if(rule){

  const hit=match(town,rule.words);

  if(hit){

   return{
    active:true,
    title:"立入規制緩和区域が存在する地区",
    text:
    "「"+hit+"」に一致。"+
    rule.text+
    " 避難指示解除とは別です。"
   };

  }

 }

 return{
  active:false,
  title:"立入条件は公式情報で確認",
  text:
  "住所情報だけでは、この地点の立入条件を確定できません。"
 };

}

/* ================= COLORS ================= */

function markerColor(type){

 if(type==="released") return "#1b8f3a";
 if(type==="difficult") return "#d00020";
 if(type==="mixed") return "#c82d42";

 return "#e28a00";

}

/* ================= STATE ================= */

let gpsMarker=null;
let selectedMarker=null;
let accuracyCircle=null;

let tracking=false;
let watchId=null;

let currentCode="";

let currentOfficial=
 "https://www.pref.fukushima.lg.jp/sec/11050a/";

let currentEntry=
 "https://www.meti.go.jp/earthquake/nuclear/kinkyu.html";

const status=document.getElementById("status");
const trackButton=document.getElementById("track");

/* ================= EVALUATE ================= */

async function evaluatePoint(lat,lng,source,accuracy=null){

 status.innerHTML="<b>住所と区域情報を確認しています…</b>";

 const ad=await reverseGeocode(lat,lng);

 if(!ad){

  status.innerHTML=
   "<b>住所情報を取得できませんでした。</b>";

  return null;

 }

 const code=ad.code;
 const town=ad.town;
 const muni=municipalities[code];

 currentCode=code;

 if(muni){

  currentOfficial=muni.official;
  currentEntry=muni.entry;

 }else{

  currentOfficial=
   "https://www.pref.fukushima.lg.jp/sec/11050a/";

  currentEntry=
   "https://www.meti.go.jp/earthquake/nuclear/kinkyu.html";

 }

 const ev=evacuationResult(code,town);
 const residence=residenceResult(code,town);
 const entry=entryResult(code,town);

 let bg="#fff7df";

 if(ev.type==="released") bg="#e9f6ec";
 if(ev.type==="difficult") bg="#ffe5e7";
 if(ev.type==="mixed") bg="#fff0f1";

 status.style.background=bg;

 const place=
  (muni?muni.name:"対象7市町村外")+
  (town?" "+town:"");

 const sourceLabel=
  source==="gps"?"📍現在地":"👆地図選択";

 const acc=
  accuracy!==null
  ?"・GPS精度 約"+Math.round(accuracy)+"m"
  :"";

 let evBadge="orange";

 if(ev.type==="released") evBadge="green";
 if(ev.type==="difficult" || ev.type==="mixed") evBadge="red";

 const residenceHTML=
  residence.active
  ?
  '<div class="row">'+
   '<b>🟣 特定帰還居住区域｜'+residence.title+'</b>'+
   '<br><span class="badge purple">避難指示解除前</span>'+
   '<span class="detail">'+residence.text+'</span>'+
  '</div>'
  :
  "";

 const entryHTML=
  '<div class="row">'+
   '<b>'+(entry.active?"🟣":"🚧")+
   ' 立入規制｜'+entry.title+'</b>'+
   (entry.active
    ?'<br><span class="badge purple">規制緩和あり</span>'
    :"")+
   '<span class="detail">'+entry.text+'</span>'+
  '</div>';

 status.innerHTML=

  '<div class="place">'+sourceLabel+"： "+place+'</div>'+

  '<div class="row">'+
   '<b>'+ev.icon+" 避難指示｜"+ev.title+'</b>'+
   '<br><span class="badge '+evBadge+'">'+
   (ev.type==="released"
    ?"解除側"
    :ev.type==="unknown"
     ?"未確定"
     :"帰還困難区域関係")+
   '</span>'+
   '<span class="detail">'+ev.text+'</span>'+
  '</div>'+

  residenceHTML+

  entryHTML+

  '<div class="coords">'+
   lat.toFixed(6)+", "+lng.toFixed(6)+acc+
  '</div>';

 return{
  ev:ev,
  place:place
 };

}

/* ================= GPS ================= */

async function showGPS(pos,follow){

 const lat=pos.coords.latitude;
 const lng=pos.coords.longitude;
 const acc=pos.coords.accuracy;

 if(gpsMarker) map.removeLayer(gpsMarker);
 if(accuracyCircle) map.removeLayer(accuracyCircle);

 const result=
  await evaluatePoint(lat,lng,"gps",acc);

 if(!result) return;

 const color=markerColor(result.ev.type);

 gpsMarker=L.circleMarker([lat,lng],{
  radius:10,
  color:"white",
  weight:3,
  fillColor:color,
  fillOpacity:1
 }).addTo(map)
 .bindPopup(
  "<b>"+result.place+"</b><br>"+
  result.ev.icon+" "+result.ev.title
 );

 accuracyCircle=L.circle([lat,lng],{
  radius:acc,
  color:color,
  weight:1,
  fillOpacity:.06
 }).addTo(map);

 if(follow) map.setView([lat,lng],16);

}

/* ================= GPS BUTTON ================= */

document.getElementById("gps").onclick=()=>{

 status.innerHTML="<b>現在地を取得しています…</b>";

 navigator.geolocation.getCurrentPosition(

  p=>showGPS(p,true),

  ()=>{
   status.innerHTML="<b>現在地を取得できませんでした。</b>";
  },

  {
   enableHighAccuracy:true,
   timeout:15000,
   maximumAge:2000
  }

 );

};

/* ================= TRACK ================= */

trackButton.onclick=()=>{

 if(!tracking){

  tracking=true;
  trackButton.innerHTML="■ 追跡停止";
  trackButton.style.background="#a06400";

  watchId=navigator.geolocation.watchPosition(
   p=>showGPS(p,true),
   ()=>{},
   {
    enableHighAccuracy:true,
    maximumAge:3000,
    timeout:20000
   }
  );

 }else{

  tracking=false;

  if(watchId!==null)
   navigator.geolocation.clearWatch(watchId);

  watchId=null;

  trackButton.innerHTML="▶ 移動追跡";
  trackButton.style.background="#08752e";

 }

};

/* ================= MAP TAP ================= */

map.on("click",async e=>{

 const lat=e.latlng.lat;
 const lng=e.latlng.lng;

 if(selectedMarker)
  map.removeLayer(selectedMarker);

 const result=
  await evaluatePoint(lat,lng,"tap");

 if(!result) return;

 const color=
  markerColor(result.ev.type);

 selectedMarker=L.circleMarker([lat,lng],{
  radius:9,
  color:"white",
  weight:3,
  fillColor:color,
  fillOpacity:1
 }).addTo(map)
 .bindPopup(
  "<b>"+result.place+"</b><br>"+
  result.ev.icon+" "+result.ev.title
 )
 .openPopup();

});

/* ================= TRAFFIC ================= */

document.getElementById("traffic").onclick=()=>{

 const box=document.getElementById("trafficBox");
 const text=document.getElementById("trafficText");

 text.innerHTML=

  "<b>🚗 特別通過交通・道路規制</b><br><br>"+

  (trafficInfo[currentCode] ||
   "この地点について個別ルート情報はありません。")+

  "<br><br><b>注意：</b>"+
  "同じ市町村内でも道路によって条件が異なります。"+
  "このアプリは現在の座標が特別通過交通の対象道路上か"+
  "までは判定していません。";

 box.style.display="block";

};

document.getElementById("trafficClose").onclick=()=>{
 document.getElementById("trafficBox").style.display="none";
};
