<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>福島・規制区域マップ</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html,body{
 margin:0;height:100%;
 font-family:-apple-system,BlinkMacSystemFont,
 "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
#app{height:100%;display:flex;flex-direction:column}
header{padding:8px;background:#fff;border-bottom:1px solid #ddd}
h1{margin:0;font-size:18px}
.sub{font-size:10px;color:#666}

#status{
 margin-top:5px;padding:7px;
 background:#eef3f8;border-radius:8px;
 font-size:10px;line-height:1.45;
 max-height:150px;overflow:auto;
}

.row{
 margin-top:4px;padding:5px 7px;
 background:white;border-radius:6px;
}
.blue{border-left:5px solid #1677ff}
.red{border-left:5px solid #d92323}
.purple{border-left:5px solid #9d28c2}
.green{border-left:5px solid #18a83c}
.orange{border-left:5px solid #e58a00}
.grey{border-left:5px solid #777}

#mapWrap{position:relative;flex:1;min-height:280px}
#map{height:100%;width:100%}

#panel{
 position:absolute;
 left:6px;right:6px;bottom:7px;
 z-index:1000;
 background:rgba(255,255,255,.96);
 padding:7px;border-radius:10px;
 box-shadow:0 2px 10px rgba(0,0,0,.3);
}

.title{font-size:9px;font-weight:bold;margin-bottom:4px}

.grid4{
 display:grid;
 grid-template-columns:1fr 1fr 1fr 1fr;
 gap:3px;
}

.grid3{
 display:grid;
 grid-template-columns:1fr 1fr 1fr;
 gap:3px;
 margin-top:4px;
}

button{
 border:0;border-radius:6px;
 padding:8px 2px;color:white;
 font-size:8px;font-weight:bold;
}

.road{background:#df7900}
#official{background:#8526a7}
.greenBtn{background:#148d35}
.tool{background:#586b76}

.bottom{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:5px;padding:6px;background:white;
}

#gps{background:#1769e0}
#track{background:#08752e}
#all{background:#df7900}
#reset{background:#555}

.note{
 grid-column:1/3;
 font-size:8px;color:#666;line-height:1.4;
}
</style>
</head>

<body>

<div id="app">

<header>

<h1>福島・規制区域マップ</h1>

<div class="sub">
v36｜特別通過交通・道路ナビ版
</div>

<div id="status">
<b>📍 地点を選択してください</b>
<div class="row blue">
GPSまたは地図タップで地点を確認できます。
</div>
</div>

</header>


<div id="mapWrap">

<div id="map"></div>

<div id="panel">

<div class="title">
🟠 大熊町・特別通過交通
</div>

<div class="grid4">

<button class="road"
onclick="road67()">
東67号
</button>

<button class="road"
onclick="road252()">
252系統
</button>

<button class="road"
onclick="road288()">
288号
</button>

<button class="road"
onclick="road35()">
県道35
</button>

</div>


<div class="grid3">

<button id="official"
onclick="officialMap()">
🟣 公式区域図
</button>

<button class="greenBtn"
onclick="greenMap()">
🟩 立入緩和
</button>

<button class="tool"
onclick="hideOverlay()">
画像OFF
</button>

</div>

</div>

</div>


<div class="bottom">

<button id="gps">📍 現在地判定</button>
<button id="track">▶ 移動追跡</button>

<button id="all">🟠 全通過制度</button>
<button id="reset">🗾 大熊町</button>

<div class="note">
オレンジの道路ボタンは対象道路周辺へ移動する機能です。
道路中心線を推測して描画していません。
「道路上」との自動判定もまだ行いません。
</div>

</div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* MAP */

const map=L.map("map").setView(
 [37.400,140.985],13
);

L.tileLayer(
 "https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",
 {
  attribution:"地理院タイル",
  maxZoom:18
 }
).addTo(map);


/* Daiichi */

L.circleMarker(
 [37.4211,141.0328],
 {
  radius:5,
  color:"#fff",
  weight:2,
  fillColor:"#111",
  fillOpacity:1
 }
)
.addTo(map)
.bindPopup("福島第一原子力発電所");


/* Reference points */

const points={

 okumaIC:[37.412372,140.963952],

 ono:[37.409384,140.984313],

 kumamachi:[37.381742,141.007522],

 ogawara:[37.383730,140.959200],

 central:[37.3910,141.0210],

 nogami:[37.410542,140.957923]

};


/* Important places */

function point(
 xy,name,color
){

 return L.circleMarker(
  xy,
  {
   radius:6,
   color:"#fff",
   weight:2,
   fillColor:color,
   fillOpacity:1
  }
 )
 .addTo(map)
 .bindPopup(name);

}


point(
 points.okumaIC,
 "大熊IC",
 "#555"
);

point(
 points.ono,
 "大野駅",
 "#555"
);

point(
 points.ogawara,
 "大川原地区",
 "#18a83c"
);


/* =================================
 ROAD NAVIGATION

 These views indicate road areas.
 They are NOT road geometry.
================================= */


function road67(){

 map.setView(
  [37.3865,141.000],
  14
 );

 setStatus(

 '<b>🟠 町道東67号</b>'+

 '<div class="row orange">'+
 '<b>対象</b><br>'+
 '大熊町避難指示解除区域境 ～ 国道6号'+
 '</div>'+

 '<div class="row green">'+
 '🚗 自動車：通行可<br>'+
 '🏍 二輪：通行可<br>'+
 '🚲 自転車：通行可<br>'+
 '🚶 歩行者：通行可<br>'+
 '通行証：不要'+
 '</div>'+

 '<div class="row red">'+
 '⚠️ 道路の脇道・周辺の帰還困難区域へ入る場合は別途規制があります。'+
 '</div>'

 );

}


function road252(){

 map.setView(
  [37.405,140.993],
  15
 );

 setStatus(

 '<b>🟠 県道252号系統</b>'+

 '<div class="row orange">'+
 '県道35号 → 西20号 → 西9号 → 西13号 → '+
 '県道252号 → 東15号 → 国道6号'+
 '</div>'+

 '<div class="row grey">'+
 '対象区間：約5km'+
 '</div>'+

 '<div class="row green">'+
 '🚗 自動車：通行可<br>'+
 '🏍 二輪：通行可<br>'+
 '🚲 軽車両：帰還困難区域区間は不可<br>'+
 '🚶 歩行者：帰還困難区域区間は不可<br>'+
 '通行証：不要'+
 '</div>'

 );

}


function road288(){

 map.setView(
  [37.414,140.925],
  13
 );

 setStatus(

 '<b>🟠 国道288号</b>'+

 '<div class="row orange">'+
 '県道35号 ～ 双葉町側の立入規制緩和区域境'+
 '</div>'+

 '<div class="row grey">'+
 '特別通過交通対象区間：約4.5km'+
 '</div>'+

 '<div class="row green">'+
 '🚗 自動車：通行可<br>'+
 '🏍 自動二輪・原付：通行可<br>'+
 '🚲 軽車両：不可<br>'+
 '🚶 歩行者：不可<br>'+
 '通行証：不要'+
 '</div>'

 );

}


function road35(){

 map.setView(
  [37.415,140.905],
  13
 );

 setStatus(

 '<b>🟠 県道35号（いわき浪江線）</b>'+

 '<div class="row orange">'+
 '浪江・双葉・大熊を南北方向につなぐ特別通過交通路線'+
 '</div>'+

 '<div class="row green">'+
 '通行証不要の特別通過交通対象区間があります。'+
 '</div>'+

 '<div class="row red">'+
 '⚠️ 道路から帰還困難区域内へ入ることとは別です。'+
 '</div>'

 );

}


/* =================================
 OFFICIAL MAP
================================= */

let overlay=null;


function hideOverlay(){

 if(overlay){

  map.removeLayer(overlay);
  overlay=null;

 }

}


function officialMap(){

 hideOverlay();

 overlay=L.imageOverlay(

 "https://www.town.okuma.fukushima.jp/uploaded/image/18390.jpg",

 [
  [37.3600,140.8300],
  [37.4470,141.0600]
 ],

 {
  opacity:.45,
  zIndex:400
 }

 ).addTo(map);


 map.setView(
  [37.400,140.985],
  13
 );


 setStatus(

  "<b>🟣 大熊町公式区域図</b><br>"+
  "帰還困難区域・特定帰還居住区域等を確認できます。"+
  "<br>画像位置は参考表示です。"

 );

}


/* ENTRY RELAXATION */

function greenMap(){

 hideOverlay();

 overlay=L.imageOverlay(

 "https://www.town.okuma.fukushima.jp/uploaded/image/18395.jpg",

 [
  [37.3990,140.9400],
  [37.4235,140.9850]
 ],

 {
  opacity:.55,
  zIndex:450
 }

 ).addTo(map);


 map.setView(
  [37.4115,140.9635],
  15
 );


 setStatus(

 "<b>🟩 立入規制緩和区域</b><br>"+
 "野上2区・下野上1区の公式図を表示しています。"

 );

}


/* =================================
 SPECIAL TRAFFIC LIST
================================= */

function showAll(){

 setStatus(

 '<b>🟠 特別通過交通</b>'+

 '<div class="row orange">'+
 '① 国道114号・南相馬市区間'+
 '</div>'+

 '<div class="row orange">'+
 '② 県道49号・南相馬市区間'+
 '</div>'+

 '<div class="row orange">'+
 '③ 大熊町道東15号～県道252号系統'+
 '</div>'+

 '<div class="row orange">'+
 '④ 県道252号'+
 '</div>'+

 '<div class="row orange">'+
 '⑤ 県道35号～国道288号'+
 '</div>'+

 '<div class="row orange">'+
 '⑥ 国道288号'+
 '</div>'+

 '<div class="row orange">'+
 '⑦ 双葉町道101号・109号（8:00～18:00）'+
 '</div>'+

 '<div class="row orange">'+
 '⑧ 大熊町道東67号～国道6号'+
 '</div>'

 );

}


/* =================================
 ADDRESS
================================= */

async function reverseAddress(
 lat,lng
){

 try{

  const r=await fetch(

   "https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress"+
   "?lat="+lat+
   "&lon="+lng

  );

  const j=await r.json();

  if(!j.results)
   return null;

  return{
   muni:String(j.results.muniCd||""),
   town:j.results.lv01Nm||""
  };

 }catch(e){

  return null;

 }

}


/* =================================
 LOCATION
================================= */

function setStatus(html){

 document
 .getElementById("status")
 .innerHTML=html;

}


async function evaluate(
 lat,lng,accuracy
){

 setStatus(
  "<b>📍 地点照合中…</b>"
 );

 const ad=
 await reverseAddress(lat,lng);


 let html=

 "<b>📍 "+
 lat.toFixed(6)+
 ", "+
 lng.toFixed(6)+
 "</b>";


 if(ad){

  html+=

  '<div class="row blue">'+
  '<b>住所</b><br>'+
  (ad.town||"町字名なし")+
  '</div>';

 }


 if(
  ad &&
  ad.muni==="07545"
 ){

  html+=

  '<div class="row blue">'+
  '<b>大熊町内</b>'+
  '</div>';


  const n=
  ad.town||"";


  if(n.includes("大川原")){

   html+=

   '<div class="row green">'+
   '<b>避難指示</b><br>'+
   '🟢 解除側'+
   '</div>';

  }else{

   html+=

   '<div class="row grey">'+
   '<b>避難指示</b><br>'+
   '⚠️ 詳細境界未確定'+
   '</div>';

  }


  html+=

  '<div class="row orange">'+
  '<b>道路通行</b><br>'+
  '🟠 大熊町内には特別通過交通路線があります。'+
  '<br>上の道路ボタンで確認してください。'+
  '</div>';

 }


 if(accuracy>0){

  html+=

  '<div style="font-size:8px;color:#666">'+
  'GPS精度 約±'+
  Math.round(accuracy)+
  'm</div>';

 }


 setStatus(html);

}


/* =================================
 GPS
================================= */

let gpsMarker=null;
let accCircle=null;


function drawGPS(pos){

 const lat=pos.coords.latitude;
 const lng=pos.coords.longitude;
 const acc=pos.coords.accuracy;


 if(gpsMarker)
  map.removeLayer(gpsMarker);

 if(accCircle)
  map.removeLayer(accCircle);


 gpsMarker=L.circleMarker(
  [lat,lng],
  {
   radius:9,
   color:"#fff",
   weight:3,
   fillColor:"#1677ff",
   fillOpacity:1
  }
 ).addTo(map);


 accCircle=L.circle(
  [lat,lng],
  {
   radius:acc,
   color:"#1677ff",
   weight:1,
   fillOpacity:.08
  }
 ).addTo(map);


 map.setView(
  [lat,lng],
  16
 );


 evaluate(
  lat,lng,acc
 );

}


document
.getElementById("gps")
.onclick=()=>{

 navigator.geolocation
 .getCurrentPosition(

  drawGPS,

  ()=>setStatus(
   "<b>現在地を取得できませんでした。</b>"
  ),

  {
   enableHighAccuracy:true,
   timeout:15000,
   maximumAge:1000
  }

 );

};


/* TRACK */

let watchId=null;
let tracking=false;


document
.getElementById("track")
.onclick=()=>{

 const b=
 document.getElementById("track");


 if(!tracking){

  tracking=true;

  b.innerHTML=
  "■ 追跡停止";

  b.style.background=
  "#a26b00";


  watchId=

  navigator.geolocation
  .watchPosition(
   drawGPS,
   ()=>{},
   {
    enableHighAccuracy:true,
    maximumAge:2000
   }
  );


 }else{

  tracking=false;

  navigator.geolocation
  .clearWatch(watchId);

  watchId=null;

  b.innerHTML=
  "▶ 移動追跡";

  b.style.background=
  "#08752e";

 }

};


/* MAP TAP */

let tapMarker=null;


map.on(
 "click",
 e=>{

  if(tapMarker)
   map.removeLayer(tapMarker);


  tapMarker=L.circleMarker(
   e.latlng,
   {
    radius:7,
    color:"#fff",
    weight:2,
    fillColor:"#e58a00",
    fillOpacity:1
   }
  ).addTo(map);


  evaluate(
   e.latlng.lat,
   e.latlng.lng,
   0
  );

 }
);


/* BUTTONS */

document
.getElementById("all")
.onclick=showAll;


document
.getElementById("reset")
.onclick=()=>{

 map.setView(
  [37.400,140.985],
  13
 );

};


/* START */

setTimeout(()=>{

 map.setView(
  [37.400,140.985],
  13
 );

},300);

</script>

</body>
</html>
