<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>福島・帰還困難区域チェッカー</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

html,body{
 margin:0;
 height:100%;
 font-family:-apple-system,BlinkMacSystemFont,
 "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}

#app{
 height:100%;
 display:flex;
 flex-direction:column;
}

header{
 background:#fff;
 padding:8px 10px;
 border-bottom:1px solid #ddd;
 z-index:1000;
}

h1{
 margin:0;
 font-size:18px;
}

.sub{
 margin-top:3px;
 font-size:10px;
 color:#555;
}

#status{
 margin-top:7px;
 padding:10px;
 border-radius:9px;
 background:#eef3f8;
 font-size:13px;
 line-height:1.5;
}

#map{
 flex:1;
 min-height:250px;
}

.controls{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:6px;
 padding:7px;
 background:#fff;
 border-top:1px solid #ddd;
}

button{
 border:0;
 border-radius:8px;
 padding:10px 3px;
 font-size:12px;
 font-weight:600;
}

#gps{
 background:#1769e0;
 color:#fff;
}

#track{
 background:#08752e;
 color:#fff;
}

#official{
 background:#444;
 color:#fff;
}

#meti{
 background:#62509b;
 color:#fff;
}

#municipal{
 background:#a05a00;
 color:#fff;
}

#entry{
 background:#b24600;
 color:#fff;
}

#returnArea{
 grid-column:1/3;
 background:#166b83;
 color:#fff;
}

.note{
 grid-column:1/3;
 font-size:9px;
 color:#666;
 line-height:1.45;
}

.badge{
 display:inline-block;
 margin-top:3px;
 padding:3px 7px;
 border-radius:12px;
 font-size:10px;
 font-weight:bold;
}

.high{
 background:#ffd9dd;
 color:#a00018;
}

.medium{
 background:#fff0c7;
 color:#7a4c00;
}

.low{
 background:#dff2e3;
 color:#086323;
}

.tap{
 background:#e8efff;
 color:#174f9d;
}

.legend{
 background:white;
 padding:6px 8px;
 font-size:10px;
 line-height:1.55;
 box-shadow:0 1px 5px rgba(0,0,0,.3);
 border-radius:5px;
}

</style>
</head>

<body>

<div id="app">

<header>

<h1>福島・帰還困難区域チェッカー</h1>

<div class="sub">
GPSまたは地図タップで、避難指示・立入情報を確認
</div>

<div id="status">
<b>📍「現在地」を押すか、地図上の調べたい場所をタップしてください。</b>
</div>

</header>

<div id="map"></div>

<div class="controls">

<button id="gps">
📍 現在地
</button>

<button id="track">
▶ 移動追跡
</button>

<button id="official">
🗺 福島県公式区域情報
</button>

<button id="meti">
📋 METI最新避難指示
</button>

<button id="municipal">
🏛 この市町村の公式情報
</button>

<button id="entry">
🚧 立入・通行情報
</button>

<button id="returnArea">
🟣 特定帰還居住区域
</button>

<div class="note">
<b>重要：</b>
このアプリは行政上の避難指示・立入規制の確認を補助するものです。
放射線安全性を判定するものではありません。
地区名が一致しても同じ地区内に解除済み区域等が含まれる場合があります。
最終的な区域確認は国・自治体の公式情報で行ってください。
<br>
特定帰還居住区域や立入規制緩和区域は、
「避難指示解除済み」と同じ意味ではありません。
</div>

</div>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script>

/* ===========================
   地図
=========================== */

const map=
 L.map("map")
 .setView([37.47,140.93],10);

L.tileLayer(
 "https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",
 {
  attribution:"地理院タイル",
  maxZoom:18
 }
).addTo(map);


/* 福島第一 */

L.circleMarker(
 [37.4211,141.0328],
 {
  radius:7,
  color:"white",
  weight:2,
  fillColor:"#111",
  fillOpacity:1
 }
)
.addTo(map)
.bindPopup("<b>福島第一原子力発電所</b>");


/* ===========================
   解除済み拠点・代表地点
   ※境界ではない
=========================== */

const lifted=[
 ["大熊町・大野駅",37.4075,140.9830],
 ["双葉町・双葉駅",37.4545,141.0053],
 ["浪江町・拠点区域",37.4938,140.9890],
 ["富岡町・夜ノ森",37.3683,140.9950],
 ["飯舘村・長泥拠点",37.6160,140.7330],
 ["葛尾村・拠点区域",37.5140,140.7920]
];

lifted.forEach(p=>{

 L.circleMarker(
  [p[1],p[2]],
  {
   radius:5,
   color:"#08752e",
   weight:2,
   fillColor:"#34a853",
   fillOpacity:1
  }
 )
 .addTo(map)
 .bindPopup(
  "<b>"+p[0]+"</b><br>"+
  "特定復興再生拠点区域は解除済み。"+
  "<br><small>この点は区域境界を表しません。</small>"
 );

});


/* ===========================
   市町村
=========================== */

const municipalities={

 "07212":{
   name:"南相馬市",
   official:
    "https://www.city.minamisoma.lg.jp/portal/sections/12/1240/12401/genshiryokusaigaikuiki/1424.html",
   entry:
    "https://www.meti.go.jp/earthquake/nuclear/kinkyu.html"
 },

 "07543":{
   name:"富岡町",
   official:
    "https://www.tomioka-town.jp/",
   entry:
    "https://www.tomioka-town.jp/soshiki/anzentaisaku/1153.html"
 },

 "07545":{
   name:"大熊町",
   official:
    "https://www.town.okuma.fukushima.jp/",
   entry:
    "https://www.town.okuma.fukushima.jp/soshiki/kankyoutaisaku/34555.html"
 },

 "07546":{
   name:"双葉町",
   official:
    "https://www.town.fukushima-futaba.lg.jp/",
   entry:
    "https://www.town.fukushima-futaba.lg.jp/item/17316.htm"
 },

 "07547":{
   name:"浪江町",
   official:
    "https://www.town.namie.fukushima.jp/",
   entry:
    "https://www.town.namie.fukushima.jp/soshiki/1/19635.html"
 },

 "07548":{
   name:"葛尾村",
   official:
    "https://www.katsurao.org/",
   entry:
    "https://www.katsurao.org/soshiki/3/tuukoukisei20260826.html"
 },

 "07564":{
   name:"飯舘村",
   official:
    "https://www.vill.iitate.fukushima.jp/",
   entry:
    "https://www.meti.go.jp/earthquake/nuclear/20250331iitatemura-tachiirikiseikanwa.html"
 }

};


/* ===========================
   現在帰還困難区域が
   存在することを公式情報で
   確認できる地区名
=========================== */

const rules={

 "07212":{
   words:[
    "小高区金谷"
   ],
   detail:
    "南相馬市の帰還困難区域は、小高区金谷のうち"+
    "小畑・ドウケ・出戸間船・野中などです。"
 },

 "07543":{
   words:[
    "小良ヶ浜",
    "深谷"
   ],
   detail:
    "富岡町では小良ヶ浜・深谷地区に帰還困難区域が残っています。"
 },

 "07545":{
   words:[
    "野上",
    "下野上",
    "熊",
    "夫沢",
    "小入野"
   ],
   detail:
    "大熊町ではこの地区の全部または一部に"+
    "帰還困難区域または特定帰還居住区域があります。"+
    "大野駅周辺など解除済み区域も混在します。"
 },

 "07546":{
   words:[
    "下長塚",
    "三字",
    "羽鳥"
   ],
   detail:
    "双葉町ではこの地区の一部に特定帰還居住区域や"+
    "立入規制緩和区域があります。避難指示解除とは別です。"
 },

 "07547":{
   words:[
    "井手",
    "小丸",
    "大堀",
    "酒井",
    "室原",
    "末森",
    "津島",
    "南津島",
    "川房",
    "昼曽根",
    "下津島",
    "赤宇木",
    "羽附"
   ],
   detail:
    "浪江町が帰還困難区域への立入り申請対象として"+
    "公表している地域名に一致します。"+
    "一部解除済み区域を含みます。"
 },

 "07548":{
   words:[
    "小出谷",
    "野行",
    "柏原"
   ],
   detail:
    "葛尾村の帰還困難区域・特定帰還居住区域に"+
    "関係する地区です。解除済み部分もあります。"
 },

 "07564":{
   words:[
    "長泥"
   ],
   detail:
    "飯舘村で帰還困難区域が残る長泥地区です。"+
    "特定復興再生拠点区域や曲田の一部には解除済み区域があります。"
 }

};


/* ===========================
   逆ジオコーダ
=========================== */

async function reverseGeocode(lat,lng){

 try{

  const url=
   "https://mreversegeocoder.gsi.go.jp/reverse-geocoder/"+
   "LonLatToAddress?lat="+
   encodeURIComponent(lat)+
   "&lon="+
   encodeURIComponent(lng);

  const r=await fetch(url);

  if(!r.ok)
   throw new Error();

  const j=await r.json();

  if(!j.results)
   return null;

  return{
   code:String(j.results.muniCd || ""),
   town:j.results.lv01Nm || ""
  };

 }catch(e){

  return null;

 }

}


/* ===========================
   判定
=========================== */

function classifyAddress(code,town){

 if(!municipalities[code]){

  return{
   level:"low",
   title:"🟢 帰還困難区域が残る7市町村の外",
   text:
    "現在、帰還困難区域が残る7市町村には該当しません。"
  };

 }

 const rule=rules[code];

 if(rule && town){

  const hit=
   rule.words.find(
    w=>town.indexOf(w)!==-1
   );

  if(hit){

   return{
    level:"high",
    title:"🔴 帰還困難区域等に関係する地区名",
    text:
     "地区名「"+hit+"」に一致しました。"+
     rule.detail+
     " 同じ地区内に解除済み区域がある場合があるため、"+
     "この結果だけで法的区域を確定しないでください。"
   };

  }

 }

 return{
  level:"medium",
  title:"🟠 7市町村内・区域境界の確認が必要",
  text:
   "この市町村には現在も帰還困難区域があります。"+
   "取得できた住所情報だけでは区域内・区域外を確定できません。"
 };

}


/* ===========================
   表示
=========================== */

let currentMarker=null;
let accuracyCircle=null;
let selectedMarker=null;

let tracking=false;
let watchId=null;

let currentOfficial=
 "https://www.pref.fukushima.lg.jp/sec/11050a/";

let currentEntry=
 "https://www.meti.go.jp/earthquake/nuclear/kinkyu.html";

const status=
 document.getElementById("status");

const trackButton=
 document.getElementById("track");


async function evaluatePoint(
 lat,
 lng,
 source,
 accuracy=null
){

 status.style.background="#eef3f8";

 status.innerHTML=
  "<b>住所を確認しています…</b>";

 const ad=
  await reverseGeocode(lat,lng);

 const code=
  ad ? ad.code : "";

 const town=
  ad ? ad.town : "";

 const muni=
  municipalities[code];

 if(muni){

  currentOfficial=
   muni.official;

  currentEntry=
   muni.entry;

 }else{

  currentOfficial=
   "https://www.pref.fukushima.lg.jp/sec/11050a/";

  currentEntry=
   "https://www.meti.go.jp/earthquake/nuclear/kinkyu.html";

 }

 const result=
  classifyAddress(code,town);

 let bg="#eef3f8";
 let badge="";

 if(result.level==="high"){

  bg="#fff0f1";

  badge=
   '<span class="badge high">'+
   '公式地区名との照合：注意'+
   '</span>';

 }

 if(result.level==="medium"){

  bg="#fff7df";

  badge=
   '<span class="badge medium">'+
   '境界確認が必要'+
   '</span>';

 }

 if(result.level==="low"){

  bg="#e9f6ec";

  badge=
   '<span class="badge low">'+
   '市町村レベルで区域外'+
   '</span>';

 }

 status.style.background=bg;

 const sourceText=
  source==="gps"
  ? "📍 現在地"
  : "👆 地図で選択";

 let accText="";

 if(accuracy!==null){

  accText=
   "　GPS精度：約"+
   Math.round(accuracy)+
   "m";

 }

 status.innerHTML=

  "<b>"+result.title+"</b><br>"+

  sourceText+
  "："+
  (muni ? muni.name : "対象7市町村外")+
  (town ? " "+town : "")+

  "<br>"+badge+

  "<br>"+result.text+

  "<br><small>"+
  "緯度経度："+

  lat.toFixed(6)+
  ", "+
  lng.toFixed(6)+

  accText+

  "</small>";

}


/* ===========================
   GPS
=========================== */

async function showPosition(pos,follow){

 const lat=
  pos.coords.latitude;

 const lng=
  pos.coords.longitude;

 const acc=
  pos.coords.accuracy;

 if(currentMarker)
  map.removeLayer(currentMarker);

 if(accuracyCircle)
  map.removeLayer(accuracyCircle);

 currentMarker=
  L.circleMarker(
   [lat,lng],
   {
    radius:9,
    color:"white",
    weight:3,
    fillColor:"#1769e0",
    fillOpacity:1
   }
  ).addTo(map);

 accuracyCircle=
  L.circle(
   [lat,lng],
   {
    radius:acc,
    color:"#1769e0",
    weight:1,
    fillOpacity:.07
   }
  ).addTo(map);

 if(follow)
  map.setView([lat,lng],16);

 await evaluatePoint(
  lat,
  lng,
  "gps",
  acc
 );

}


document
.getElementById("gps")
.onclick=()=>{

 status.innerHTML=
  "<b>現在地を取得しています…</b>";

 navigator.geolocation.getCurrentPosition(

  p=>showPosition(p,true),

  ()=>{
   status.innerHTML=
    "<b>現在地を取得できませんでした。</b>";
  },

  {
   enableHighAccuracy:true,
   timeout:15000,
   maximumAge:2000
  }

 );

};


/* ===========================
   移動追跡
=========================== */

trackButton.onclick=()=>{

 if(!tracking){

  tracking=true;

  trackButton.innerHTML=
   "■ 追跡停止";

  trackButton.style.background=
   "#a06400";

  watchId=
   navigator.geolocation.watchPosition(

    p=>showPosition(p,true),

    ()=>{},

    {
     enableHighAccuracy:true,
     maximumAge:3000,
     timeout:20000
    }

   );

 }else{

  tracking=false;

  if(watchId!==null)
   navigator.geolocation.clearWatch(watchId);

  watchId=null;

  trackButton.innerHTML=
   "▶ 移動追跡";

  trackButton.style.background=
   "#08752e";

 }

};


/* ===========================
   地図をタップして判定
=========================== */

map.on("click",async e=>{

 const lat=e.latlng.lat;
 const lng=e.latlng.lng;

 if(selectedMarker)
  map.removeLayer(selectedMarker);

 selectedMarker=
  L.marker([lat,lng])
  .addTo(map)
  .bindPopup(
   "<b>調べる地点</b><br>"+
   "住所を確認しています…"
  )
  .openPopup();

 await evaluatePoint(
  lat,
  lng,
  "tap"
 );

 const ad=
  await reverseGeocode(lat,lng);

 if(ad){

  const muni=
   municipalities[ad.code];

  selectedMarker
   .setPopupContent(
    "<b>調べる地点</b><br>"+
    (muni ? muni.name : "")+
    (ad.town ? " "+ad.town : "")
   );

 }

});


/* ===========================
   リンク
=========================== */

document
.getElementById("official")
.onclick=()=>{

 window.open(
  "https://www.pref.fukushima.lg.jp/sec/11050a/",
  "_blank"
 );

};


document
.getElementById("meti")
.onclick=()=>{

 window.open(
  "https://www.meti.go.jp/earthquake/nuclear/kinkyu.html",
  "_blank"
 );

};


document
.getElementById("municipal")
.onclick=()=>{

 window.open(
  currentOfficial,
  "_blank"
 );

};


document
.getElementById("entry")
.onclick=()=>{

 window.open(
  currentEntry,
  "_blank"
 );

};


document
.getElementById("returnArea")
.onclick=()=>{

 window.open(
  "https://www.reconstruction.go.jp/topics/cat-11/cat-41/cat-142/20230928101604/",
  "_blank"
 );

};


/* ===========================
   凡例
=========================== */

const legend=
 L.control({
  position:"bottomright"
 });

legend.onAdd=function(){

 const d=
  L.DomUtil.create(
   "div",
   "legend"
  );

 d.innerHTML=
  '<span style="color:#1769e0;font-size:16px">●</span> 現在地<br>'+
  '📍 地図タップ＝任意地点を確認<br>'+
  '<span style="color:#18863b;font-size:16px">●</span> 解除済み拠点の代表地点';

 return d;

};

legend.addTo(map);

</script>

</body>
</html>
