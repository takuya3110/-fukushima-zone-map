/* ==============================
 POINT IN POLYGON
============================== */

function pointInPolygon(
 lat,lng,poly
){

 let inside=false;


 for(
  let i=0,j=poly.length-1;
  i<poly.length;
  j=i++
 ){

  const yi=poly[i][0];
  const xi=poly[i][1];

  const yj=poly[j][0];
  const xj=poly[j][1];


  const hit=

  ((yi>lat)!=(yj>lat))

  &&

  (
   lng<
   (xj-xi)*
   (lat-yi)/
   (yj-yi)+xi
  );


  if(hit)
   inside=!inside;

 }


 return inside;

}

/* ==============================
 GSI REVERSE GEOCODER
============================== */

async function reverseAddress(
 lat,lng
){

 try{

  const url=

  "https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress"+
  "?lat="+
  encodeURIComponent(lat)+
  "&lon="+
  encodeURIComponent(lng);


  const r=
  await fetch(url);


  const j=
  await r.json();


  if(!j.results)
   return null;


  return{

   muni:
   String(
    j.results.muniCd||""
   ),

   town:
   j.results.lv01Nm||""

  };


 }catch(e){

  return null;

 }

}


/* ==============================
 AZA MATCHING
============================== */

function findAza(name){

 if(!name)
  return null;


 /*
 exact / longest matching
 */

 let best=null;


 for(const a of azaData){

  const n=a[1];


  if(
   name===n ||
   name.includes(n) ||
   n.includes(name)
  ){

   if(
    !best ||
    n.length>best[1].length
   ){

    best=a;

   }

  }

 }


 return best;

}

/* ==============================
 GPS
============================== */

let gpsMarker=null;
let accCircle=null;


function drawGPS(
 pos,follow
){

 const lat=
 pos.coords.latitude;

 const lng=
 pos.coords.longitude;

 const acc=
 pos.coords.accuracy;


 if(gpsMarker)
  map.removeLayer(gpsMarker);


 if(accCircle)
  map.removeLayer(accCircle);


 gpsMarker=

 L.circleMarker(
  [lat,lng],
  {
   radius:9,
   color:"#fff",
   weight:3,
   fillColor:"#1677ff",
   fillOpacity:1
  }
 )
 .addTo(map);


 accCircle=

 L.circle(
  [lat,lng],
  {
   radius:acc,
   color:"#1677ff",
   weight:1,
   fillColor:"#1677ff",
   fillOpacity:.08
  }
 )
 .addTo(map);


 if(follow){

  map.setView(
   [lat,lng],
   16
  );

 }


 evaluate(
  lat,lng,acc
 );

}

  ()=>setStatus(

  ),

  {
   enableHighAccuracy:true,
   timeout:15000,
   maximumAge:1000

/* ==============================

============================== */

let watchId=null;

.getElementById("track")
.onclick=()=>{

 const b=
 document.getElementById("track");


 if(!tracking){

  tracking=true;

  b.innerHTML=
  "■ 追跡停止";

  b.style.background=
  "#a26b00";


  watchId=

  navigator.geolocation
  .watchPosition(

   p=>drawGPS(p,true),

   ()=>{},

   {
    enableHighAccuracy:true,
    timeout:20000,
    maximumAge:2000
   }

  );


 }else{

  tracking=false;


  if(watchId!==null){

   navigator.geolocation
   .clearWatch(watchId);

  }


  watchId=null;


  b.innerHTML=
  "▶ 移動追跡";

  b.style.background=
  "#08752e";

 }

};

 );


 setStatus(

 "<b>🟩 立入規制緩和区域</b><br>"+
 z.name+
 "<br>"+
 "2026年6月22日から。"+
 "<br>"+
 "公式図の緑色部分を参考表示しています。"

 );

}


function changeOpacity(){

 opacityIndex=

 (opacityIndex+1)%
 opacityList.length;


 if(overlay){

  overlay.setOpacity(
   opacityList[opacityIndex]
  );

 }


 setStatus(

 "<b>👁 画像透明度 "+
 Math.round(
  opacityList[opacityIndex]*100
 )+
 "%</b>"

 );

}


/* ==============================
 TOWN
============================== */

function toggleTown(){

 if(townVisible){

  map.removeLayer(
   townPolygon
  );

  townVisible=false;

 }else{

  townPolygon.addTo(map);

  townVisible=true;

 }

}

  "野上":5,
  "下野上":5,
  "大川原":2,
  "熊":6,
  "熊川":2,
  "小入野":4,
  "夫沢":5,
  "小良浜":1

 };


 let text=
 "<b>🏠 大熊町30町字データ</b><br>";


 for(const k in groups){

  k+
  "："+
  groups[k]+
  "区画<br>";

 }


 text+=
 "<br>合計：30区画";


 setStatus(text);

}
