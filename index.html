<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>福島・帰還困難区域マップ</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html,body,#map{
 height:100%;
 width:100%;
 margin:0;
 font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
}

#map{z-index:1}

#title{
 position:absolute;
 top:10px;
 left:50%;
 transform:translateX(-50%);
 z-index:1000;
 background:rgba(255,255,255,.96);
 padding:8px 12px;
 border-radius:9px;
 box-shadow:0 1px 7px #777;
 font-size:14px;
 font-weight:bold;
 white-space:nowrap;
}

#controls{
 position:absolute;
 left:12px;
 bottom:25px;
 z-index:1000;
 display:flex;
 flex-direction:column;
 gap:7px;
}

button{
 background:white;
 border:1px solid #ccc;
 border-radius:9px;
 padding:11px 13px;
 box-shadow:0 1px 6px #888;
 font-size:14px;
 font-weight:bold;
}

#status{
 position:absolute;
 left:12px;
 right:12px;
 bottom:135px;
 z-index:1000;
 background:rgba(255,255,255,.96);
 border-radius:10px;
 padding:9px 11px;
 box-shadow:0 1px 6px #888;
 font-size:13px;
 line-height:1.45;
 display:none;
}

#legend{
 position:absolute;
 right:10px;
 top:55px;
 z-index:1000;
 background:rgba(255,255,255,.95);
 border-radius:8px;
 padding:7px 9px;
 box-shadow:0 1px 5px #999;
 font-size:11px;
}

.redbox{
 display:inline-block;
 width:13px;
 height:13px;
 background:rgba(220,0,0,.35);
 border:2px solid #d00000;
 vertical-align:-2px;
 margin-right:4px;
}

.small{
 font-size:10px;
 color:#666;
 margin-top:4px;
}
</style>
</head>

<body>

<div id="title">福島・帰還困難区域マップ</div>

<div id="legend">
 <span class="redbox"></span>帰還困難区域・参考境界
</div>

<div id="status"></div>

<div id="controls">
 <button id="locate">◎ 現在地を判定</button>
 <button id="whole">浜通り全体</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/osmtogeojson@3.0.0/osmtogeojson.js"></script>

<script>

const map=L.map("map").setView([37.47,141.00],10);

L.tileLayer(
 "https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",
 {
  attribution:"地理院地図",
  maxZoom:18
 }
).addTo(map);


/* 福島第一原発 */

L.circleMarker(
 [37.4211,141.0328],
 {
  radius:6,
  color:"#111",
  weight:2,
  fillColor:"#fff",
  fillOpacity:1
 }
)
.addTo(map)
.bindPopup("福島第一原子力発電所");


let currentMarker=null;
let accuracyCircle=null;
let zoneGeoJSON=null;


/* 帰還困難区域をOpenStreetMapから取得 */

async function loadZone(){

 const status=document.getElementById("status");

 try{

  const url=
   "https://api.openstreetmap.org/api/0.6/relation/20011373/full";

  const response=await fetch(url);

  if(!response.ok){
   throw new Error("取得失敗");
  }

  const xmlText=await response.text();

  const xml=
   new DOMParser()
   .parseFromString(xmlText,"text/xml");

  zoneGeoJSON=osmtogeojson(xml);

  L.geoJSON(
   zoneGeoJSON,
   {
    style:{
     color:"#d00000",
     weight:2,
     fillColor:"#e00000",
     fillOpacity:0.28
    },

    onEachFeature:function(feature,layer){

     layer.bindPopup(
      "<b>帰還困難区域・参考境界</b>"+
      "<br>OpenStreetMap relation 20011373"+
      "<br><small>法的な最新区域は国・県の情報を確認してください。</small>"
     );

    }
   }
  ).addTo(map);

 }catch(e){

  status.style.display="block";

  status.innerHTML=
   "<b>区域データを取得できませんでした。</b>"+
   "<br>地図と現在地機能は利用できます。"+
   "<br>ページを再読み込みしてください。";

 }

}


/* 点がポリゴン内か判定 */

function pointInRing(lat,lng,ring){

 let inside=false;

 for(
  let i=0,j=ring.length-1;
  i<ring.length;
  j=i++
 ){

  const xi=ring[i][0];
  const yi=ring[i][1];

  const xj=ring[j][0];
  const yj=ring[j][1];

  const intersect=
   ((yi>lat)!=(yj>lat)) &&
   (lng<
    (xj-xi)*
    (lat-yi)/
    (yj-yi+0.0000000001)+xi
   );

  if(intersect){
   inside=!inside;
  }

 }

 return inside;

}


function featureContains(lat,lng,feature){

 const g=feature.geometry;

 if(!g)return false;

 if(g.type==="Polygon"){

  return pointInRing(
   lat,lng,g.coordinates[0]
  );

 }

 if(g.type==="MultiPolygon"){

  return g.coordinates.some(
   p=>pointInRing(lat,lng,p[0])
  );

 }

 return false;

}


function isInsideZone(lat,lng){

 if(!zoneGeoJSON)return null;

 let inside=false;

 zoneGeoJSON.features.forEach(f=>{

  if(featureContains(lat,lng,f)){
   inside=true;
  }

 });

 return inside;

}


/* 現在地 */

document.getElementById("locate").onclick=function(){

 const status=
  document.getElementById("status");

 status.style.display="block";

 status.innerHTML=
  "現在地を取得しています…";

 if(!navigator.geolocation){

  status.innerHTML=
   "この端末では位置情報を利用できません。";

  return;

 }

 navigator.geolocation.getCurrentPosition(

  function(pos){

   const lat=pos.coords.latitude;
   const lng=pos.coords.longitude;
   const accuracy=pos.coords.accuracy;

   if(currentMarker){
    map.removeLayer(currentMarker);
   }

   if(accuracyCircle){
    map.removeLayer(accuracyCircle);
   }


   accuracyCircle=L.circle(
    [lat,lng],
    {
     radius:accuracy,
     color:"#007aff",
     weight:1,
     fillOpacity:.07
    }
   ).addTo(map);


   currentMarker=L.circleMarker(
    [lat,lng],
    {
     radius:9,
     color:"white",
     weight:3,
     fillColor:"#007aff",
     fillOpacity:1
    }
   )
   .addTo(map);


   map.setView([lat,lng],15);


   const result=
    isInsideZone(lat,lng);


   if(result===true){

    status.innerHTML=
     "<b style='color:#c00000;font-size:17px'>"+
     "帰還困難区域内です"+
     "</b>"+
     "<br>現在地："+
     lat.toFixed(6)+
     ", "+
     lng.toFixed(6)+
     "<div class='small'>"+
     "OpenStreetMap参考境界による判定。"+
     "実際の立入可否は公式情報を確認してください。"+
     "</div>";

   }

   else if(result===false){

    status.innerHTML=
     "<b style='color:#087830;font-size:17px'>"+
     "帰還困難区域の外です"+
     "</b>"+
     "<br>現在地："+
     lat.toFixed(6)+
     ", "+
     lng.toFixed(6)+
     "<div class='small'>"+
     "OpenStreetMap参考境界による判定。"+
     "</div>";

   }

   else{

    status.innerHTML=
     "<b>現在地を取得しました</b>"+
     "<br>区域データの読み込みを待っています。";

   }


   currentMarker
    .bindPopup("現在地")
    .openPopup();

  },

  function(){

   status.innerHTML=
    "現在地を取得できません。"+
    "<br>Safariの位置情報を許可してください。";

  },

  {
   enableHighAccuracy:true,
   timeout:15000
  }

 );

};


document.getElementById("whole").onclick=function(){

 map.setView(
  [37.47,141.00],
  10
 );

};


loadZone();

</script>

</body>
</html>
