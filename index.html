<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>福島・帰還困難区域チェッカー</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      background: #f4f5f7;
    }

    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    header {
      background: white;
      padding: 12px 14px 10px;
      border-bottom: 1px solid #ddd;
      z-index: 1000;
    }

    h1 {
      font-size: 19px;
      margin: 0 0 6px;
    }

    .subtitle {
      font-size: 12px;
      color: #555;
      line-height: 1.45;
    }

    #status {
      margin-top: 9px;
      padding: 9px 10px;
      border-radius: 8px;
      background: #eef3f8;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.45;
    }

    #map {
      flex: 1;
      min-height: 300px;
    }

    .controls {
      background: white;
      padding: 10px;
      border-top: 1px solid #ddd;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 12px 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    #gpsButton {
      background: #1769e0;
      color: white;
    }

    #officialButton {
      background: #d8334a;
      color: white;
    }

    .small-note {
      grid-column: 1 / 3;
      font-size: 11px;
      color: #666;
      line-height: 1.45;
    }

    #officialPanel {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.82);
      z-index: 9999;
      overflow-y: auto;
      padding: 15px;
    }

    .panelBox {
      max-width: 900px;
      margin: auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    .panelHeader {
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panelHeader strong {
      font-size: 16px;
    }

    #closeButton {
      background: #eee;
      color: #222;
      padding: 7px 12px;
    }

    #officialImage {
      display: block;
      width: 100%;
      height: auto;
    }

    .panelText {
      padding: 12px;
      font-size: 13px;
      line-height: 1.6;
    }

    .legend {
      background: white;
      padding: 7px 9px;
      border-radius: 5px;
      box-shadow: 0 1px 5px rgba(0,0,0,.3);
      font-size: 12px;
      line-height: 1.5;
    }

    .redDot {
      display: inline-block;
      width: 11px;
      height: 11px;
      background: #d80000;
      border-radius: 50%;
      margin-right: 5px;
    }

    .blueDot {
      display: inline-block;
      width: 11px;
      height: 11px;
      background: #1769e0;
      border-radius: 50%;
      margin-right: 5px;
    }
  </style>
</head>

<body>

<div id="app">

  <header>
    <h1>福島・帰還困難区域チェッカー</h1>

    <div class="subtitle">
      浜通り周辺の現在地と、公式避難指示区域図を確認するための地図です。
    </div>

    <div id="status">
      「現在地」を押してください
    </div>
  </header>

  <div id="map"></div>

  <div class="controls">

    <button id="gpsButton">
      📍 現在地
    </button>

    <button id="officialButton">
      🗺 公式区域図
    </button>

    <div class="small-note">
      ※ 帰還困難区域の法的な境界・立入可否は国・自治体の最新情報を優先してください。
      この版では誤判定を避けるため、概念図からの自動区域判定は行っていません。
    </div>

  </div>

</div>


<div id="officialPanel">

  <div class="panelBox">

    <div class="panelHeader">
      <strong>福島県公式・避難指示区域図</strong>
      <button id="closeButton">閉じる</button>
    </div>

    <img
      id="officialImage"
      src="https://www.pref.fukushima.lg.jp/img/portal2023/en131-202506.webp"
      alt="福島県 避難指示区域図"
    >

    <div class="panelText">
      <b>ピンク：</b>避難指示が継続している帰還困難区域<br>
      <b>緑斜線：</b>特定復興再生拠点区域（避難指示解除済み）<br><br>

      福島県が公表している2025年3月31日時点の概念図です。
      2026年の特定帰還居住区域や立入規制緩和については、
      次のバージョンで別レイヤーとして追加します。
    </div>

  </div>

</div>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script>

  const map = L.map("map", {
    zoomControl: true
  }).setView(
    [37.45, 140.95],
    10
  );


  L.tileLayer(
    "https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",
    {
      attribution: "地理院タイル",
      maxZoom: 18
    }
  ).addTo(map);


  const daiichiLat = 37.4211;
  const daiichiLng = 141.0328;


  const daiichiIcon = L.divIcon({
    className: "",
    html:
      '<div style="' +
      'width:18px;' +
      'height:18px;' +
      'background:#d80000;' +
      'border:3px solid white;' +
      'border-radius:50%;' +
      'box-shadow:0 0 5px rgba(0,0,0,.6);' +
      '"></div>',
    iconSize: [18,18],
    iconAnchor: [9,9]
  });


  L.marker(
    [daiichiLat, daiichiLng],
    { icon: daiichiIcon }
  )
  .addTo(map)
  .bindPopup(
    "<b>東京電力 福島第一原子力発電所</b>"
  );


  let userMarker = null;
  let accuracyCircle = null;


  const status = document.getElementById("status");


  document
    .getElementById("gpsButton")
    .addEventListener(
      "click",
      function() {

        if (!navigator.geolocation) {
          status.innerHTML =
            "この端末では現在地を取得できません。";
          return;
        }

        status.innerHTML =
          "現在地を取得しています…";


        navigator.geolocation.getCurrentPosition(

          function(position) {

            const lat =
              position.coords.latitude;

            const lng =
              position.coords.longitude;

            const accuracy =
              position.coords.accuracy;


            if (userMarker) {
              map.removeLayer(userMarker);
            }

            if (accuracyCircle) {
              map.removeLayer(accuracyCircle);
            }


            userMarker =
              L.circleMarker(
                [lat, lng],
                {
                  radius: 9,
                  color: "white",
                  weight: 3,
                  fillColor: "#1769e0",
                  fillOpacity: 1
                }
              )
              .addTo(map)
              .bindPopup(
                "<b>現在地</b><br>" +
                lat.toFixed(6) +
                ", " +
                lng.toFixed(6) +
                "<br>精度 約" +
                Math.round(accuracy) +
                "m"
              );


            accuracyCircle =
              L.circle(
                [lat, lng],
                {
                  radius: accuracy,
                  color: "#1769e0",
                  weight: 1,
                  fillOpacity: 0.08
                }
              )
              .addTo(map);


            map.setView(
              [lat, lng],
              15
            );


            userMarker.openPopup();


            status.innerHTML =
              "📍 現在地：" +
              lat.toFixed(5) +
              ", " +
              lng.toFixed(5) +
              "<br>" +
              "「公式区域図」で帰還困難区域を確認できます。";

          },


          function(error) {

            let message =
              "現在地を取得できませんでした。";

            if (error.code === 1) {
              message =
                "位置情報の使用が許可されていません。Safariの位置情報設定を確認してください。";
            }

            status.innerHTML = message;

          },


          {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 5000
          }

        );

      }
    );


  document
    .getElementById("officialButton")
    .addEventListener(
      "click",
      function() {
        document
          .getElementById("officialPanel")
          .style.display = "block";
      }
    );


  document
    .getElementById("closeButton")
    .addEventListener(
      "click",
      function() {
        document
          .getElementById("officialPanel")
          .style.display = "none";
      }
    );


  const legend = L.control({
    position: "bottomright"
  });


  legend.onAdd = function() {

    const div =
      L.DomUtil.create(
        "div",
        "legend"
      );

    div.innerHTML =
      '<span class="blueDot"></span>現在地<br>' +
      '<span class="redDot"></span>福島第一原発';

    return div;
  };


  legend.addTo(map);

</script>

</body>
</html>
